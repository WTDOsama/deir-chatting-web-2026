<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراسلات إدارة إيواءات دير البلح</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
  * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
  body { background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%); min-height: 100vh; margin: 0; }
  .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
  .btn-primary { background: linear-gradient(135deg, #0f766e, #134e4a); color: white; cursor: pointer; border: none; transition: all 0.3s; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,118,110,0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.4s ease-in; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #0f766e; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app" class="fade-in"></div>

<script>
// =====================================================
// CONFIGURATION - ⚠️ استبدل القيم هنا ببياناتك الحقيقية
// =====================================================
const CONFIG = {
  APP_NAME: 'مراسلات إدارة إيواءات دير البلح',
  VERSION: '5.1.0',
  SUPABASE_URL: 'https://supabase.com/dashboard/project/vhypuurifaeqgyxdgubz/settings/api-keys',
  SUPABASE_KEY: 'sb_publishable_rhTVmxm81mzW-2_a4o7x6A_ii8b4hNk',
};

// =====================================================
// SUPABASE CLIENT - الآن يعمل بشكل صحيح
// =====================================================
let sb = null;
let isConnected = false;

try {
  if (window.supabase && CONFIG.SUPABASE_URL && CONFIG.SUPABASE_KEY && 
      CONFIG.SUPABASE_URL.includes('supabase.co') && 
      !CONFIG.SUPABASE_KEY.includes('YOUR_KEY')) {
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    isConnected = true;
    console.log('✓ Supabase connected successfully');
  } else {
    console.log('ℹ Demo mode (Supabase not configured)');
  }
} catch (e) {
  console.error('✗ Supabase init failed:', e);
}

// =====================================================
// AUTH
// =====================================================
const Auth = {
  user: null,
  
  async login(email, password) {
    if (!isConnected) {
      // Demo mode
      if (email === 'admin@deir-albalah.ps' && password === 'password') {
        this.user = { 
          id: 'demo-1', 
          username: 'admin', 
          full_name: 'المدير العام', 
          role: 'super_admin',
          sector_id: null 
        };
        localStorage.setItem('db_user', JSON.stringify(this.user));
        return this.user;
      }
      throw new Error('بيانات الدخول غير صحيحة');
    }
    
    // Supabase mode
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message);
    
    const { data: profile } = await sb
      .from('profiles')
      .select('*')
      .eq('id', data.user.id)
      .single();
    
    this.user = profile || { 
      id: data.user.id, 
      full_name: email.split('@')[0], 
      role: 'sector_staff' 
    };
    return this.user;
  },
  
  async logout() {
    if (isConnected && sb) await sb.auth.signOut();
    this.user = null;
    localStorage.removeItem('db_user');
    render();
  },
  
  load() {
    const saved = localStorage.getItem('db_user');
    if (saved) {
      try { this.user = JSON.parse(saved); } catch(e) {}
    }
    return this.user;
  }
};

// =====================================================
// RENDER
// =====================================================
function render() {
  Auth.load();
  const app = document.getElementById('app');
  
  if (!Auth.user) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md">
          <div class="text-center mb-6">
            <div class="text-6xl mb-3">🏢</div>
            <h1 class="text-2xl font-bold text-teal-800">${CONFIG.APP_NAME}</h1>
            <p class="text-gray-600 text-sm mt-2">نظام المراسلات الإدارية</p>
            <div class="mt-2 text-xs">
              ${isConnected ? '<span class="text-green-600 font-bold">🔗 متصل بـ Supabase</span>' : '<span class="text-orange-600 font-bold">💾 وضع تجريبي</span>'}
            </div>
          </div>
          
          <div id="errorMsg" class="hidden bg-red-100 border-r-4 border-red-500 text-red-700 p-3 rounded mb-4 text-sm"></div>
          
          <form class="space-y-4" onsubmit="return false;">
            <div>
              <label class="block text-sm font-semibold mb-2 text-gray-700">البريد الإلكتروني</label>
              <input type="email" id="emailInput" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="admin@deir-albalah.ps">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2 text-gray-700">كلمة المرور</label>
              <input type="password" id="passInput" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="••••••••">
            </div>
            <button type="button" id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-bold text-lg">
              🔐 تسجيل الدخول
            </button>
          </form>
          
          <div class="mt-4 p-3 bg-blue-50 rounded-xl text-xs text-blue-800">
            <p class="font-bold mb-1">بيانات تجريبية:</p>
            <p>البريد: <strong>admin@deir-albalah.ps</strong></p>
            <p>كلمة المرور: <strong>password</strong></p>
          </div>
          
          <button onclick="showSettings()" class="mt-4 text-sm text-teal-700 hover:underline w-full text-center">
            ⚙️ إعدادات الاتصال
          </button>
          
          <div class="mt-4 text-xs text-gray-500 text-center">
            <p>الإصدار ${CONFIG.VERSION}</p>
            <p class="mt-1">© 2026 إدارة إيواءات دير البلح</p>
          </div>
        </div>
      </div>
    `;
    document.getElementById('loginBtn').onclick = handleLogin;
  } else {
    app.innerHTML = `
      <div class="min-h-screen">
        <nav class="glass shadow-lg sticky top-0 z-50">
          <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
              <span class="text-3xl">🏢</span>
              <div>
                <div class="font-bold text-teal-800">${CONFIG.APP_NAME}</div>
                <div class="text-xs text-gray-600">${Auth.user.full_name}</div>
              </div>
            </div>
            <button onclick="Auth.logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold">
              🚪 خروج
            </button>
          </div>
        </nav>
        
        <div class="max-w-7xl mx-auto p-6">
          <div class="glass rounded-2xl shadow-xl p-6 mb-6">
            <h1 class="text-3xl font-bold text-teal-800 mb-2"> أهلاً ${Auth.user.full_name}</h1>
            <p class="text-gray-600">${Auth.user.role || 'مستخدم'} ${isConnected ? '🔗' : '💾'}</p>
          </div>
          
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <button class="glass rounded-2xl shadow-lg p-6 text-right hover:shadow-2xl transition cursor-pointer">
              <div class="bg-gradient-to-br from-yellow-500 to-orange-600 text-white rounded-xl p-3 inline-block text-3xl mb-2">🌅</div>
              <h3 class="font-bold text-gray-800">القاطع الشرقي</h3>
            </button>
            <button class="glass rounded-2xl shadow-lg p-6 text-right hover:shadow-2xl transition cursor-pointer">
              <div class="bg-gradient-to-br from-blue-500 to-blue-700 text-white rounded-xl p-3 inline-block text-3xl mb-2">🌊</div>
              <h3 class="font-bold text-gray-800">القاطع الغربي</h3>
            </button>
            <button class="glass rounded-2xl shadow-lg p-6 text-right hover:shadow-2xl transition cursor-pointer">
              <div class="bg-gradient-to-br from-purple-500 to-purple-700 text-white rounded-xl p-3 inline-block text-3xl mb-2">🏔️</div>
              <h3 class="font-bold text-gray-800">القاطع الشمالي</h3>
            </button>
            <button class="glass rounded-2xl shadow-lg p-6 text-right hover:shadow-2xl transition cursor-pointer">
              <div class="bg-gradient-to-br from-red-500 to-red-700 text-white rounded-xl p-3 inline-block text-3xl mb-2">☀️</div>
              <h3 class="font-bold text-gray-800">القاطع الجنوبي</h3>
            </button>
          </div>
          
          <div class="glass rounded-2xl shadow-xl p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">📋 الإجراءات السريعة</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <button class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-3 rounded-xl font-semibold">➕ مراسلة جديدة</button>
              <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-xl font-semibold"> التقارير</button>
              <button class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-3 rounded-xl font-semibold">📋 المتابعة</button>
              <button class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-3 rounded-xl font-semibold">📦 الأرشيف</button>
            </div>
          </div>
          
          <div class="text-center text-xs text-white/70 mt-8 pb-4">
            <p>© 2026 إدارة إيواءات دير البلح – جميع الحقوق محفوظة</p>
            <p class="mt-1">تطوير: WTDOsama – وتد لبرمجة مواقع الويب</p>
          </div>
        </div>
      </div>
    `;
  }
}

async function handleLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');
  
  if (!email || !password) {
    showError('الرجاء إدخال البريد وكلمة المرور');
    return;
  }
  
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<span class="spinner"></span> جاري تسجيل الدخول...';
  errorMsg.classList.add('hidden');
  
  try {
    await Auth.login(email, password);
    render();
  } catch (error) {
    showError(error.message);
    loginBtn.disabled = false;
    loginBtn.innerHTML = ' تسجيل الدخول';
  }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
  }
}

function showSettings() {
  const url = prompt('أدخل Supabase URL:', CONFIG.SUPABASE_URL);
  if (!url) return;
  const key = prompt('أدخل Supabase Anon Key:', CONFIG.SUPABASE_KEY);
  if (!key) return;
  
  CONFIG.SUPABASE_URL = url;
  CONFIG.SUPABASE_KEY = key;
  
  alert('تم الحفظ. سيتم إعادة تحميل الصفحة لتطبيق التغييرات.');
  location.reload();
}

render();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded`);
console.log(`Supabase: ${isConnected ? 'Connected ✅' : 'Not configured ️'}`);
</script>
</body>
</html>
