{id:1,ref:'DBS-EAST-2026-00001',sector:'الشرقي',sender:'محمد أبو عيشة',job:'منسق إيواءات القاطع الشرقي',recipient:'الإدارة العامة',subject:'تقرير الاحتياجات اليومية لمركز الأمل',body:'نرفع لحضرتكم تقرير الاحتياجات اليومية للمركز، حيث نحتاج إلى دعم عاجل بالمياه الصالحة للشرب والبطانيات قبل نهاية اليوم. كما نرفق كشفاً محدثاً بأعداد الأسر المستفيدة.',type:'تقرير يومي',priority:'عاجل',date:'2026-09-30',time:'08:45',read:false,archived:false,attachments:1,status:'قيد المتابعة'},
