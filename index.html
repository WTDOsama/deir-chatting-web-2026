<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراسلات إدارة إيواءات دير البلح</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
  * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
  body { background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%); min-height: 100vh; margin: 0; }
  .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
  .btn-primary { background: linear-gradient(135deg, #0f766e, #134e4a); color: white; cursor: pointer; border: none; }
  .btn-primary:hover { opacity: 0.9; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const CONFIG = {
  APP_NAME: 'مراسلات إدارة إيواءات دير البلح',
  VERSION: '3.2.0',
  SB_URL: localStorage.getItem('SB_URL') || '',
  SB_KEY: localStorage.getItem('SB_KEY') || '',
  USE_SB: localStorage.getItem('USE_SB') === 'true',
};

let sb = null;
if (CONFIG.USE_SB && CONFIG.SB_URL && CONFIG.SB_KEY) {
  try {
    sb = window.supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);
    console.log('✓ Supabase connected');
  } catch (e) {
    console.error('Supabase error:', e);
  }
}

const Auth = {
  user: null,
  async login(email, password) {
    if (!sb) {
      if (email === 'admin@deir-albalah.ps' && password === 'password') {
        this.user = { id: 'demo', full_name: 'المدير العام', role: 'super_admin' };
        return this.user;
      }
      throw new Error('بيانات غير صحيحة');
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw new Error(error.message);
    const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
    this.user = profile;
    return profile;
  },
  async logout() {
    if (sb) await sb.auth.signOut();
    this.user = null;
    render();
  },
};

function render() {
  const app = document.getElementById('app');
  if (!Auth.user) {
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md">
          <div class="text-center mb-6">
            <div class="text-6xl mb-3">🏢</div>
            <h1 class="text-2xl font-bold text-teal-800">${CONFIG.APP_NAME}</h1>
            <p class="text-gray-600 text-sm mt-2">نظام المراسلات الإدارية</p>
          </div>
          <div id="err" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm"></div>
          <form class="space-y-4" onsubmit="return false;">
            <input type="email" id="em" placeholder="البريد الإلكتروني" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl">
            <input type="password" id="pw" placeholder="كلمة المرور" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl">
            <button type="button" id="btn" class="btn-primary w-full py-3 rounded-xl font-bold">🔐 تسجيل الدخول</button>
          </form>
          <div class="mt-4 p-3 bg-blue-50 rounded-xl text-xs text-blue-800">
            <p>تجريبي: <strong>admin@deir-albalah.ps</strong> / <strong>password</strong></p>
          </div>
          <button onclick="showSettings()" class="mt-4 text-sm text-teal-700 hover:underline w-full">⚙️ إعدادات الاتصال</button>
        </div>
      </div>
    `;
    document.getElementById('btn').onclick = doLogin;
  } else {
    app.innerHTML = `
      <div class="max-w-7xl mx-auto p-6">
        <div class="glass rounded-2xl shadow-xl p-6 mb-6">
          <h1 class="text-3xl font-bold text-teal-800">👋 أهلاً ${Auth.user.full_name}</h1>
          <p class="text-gray-600">${Auth.user.role}</p>
        </div>
        <button onclick="Auth.logout()" class="bg-red-600 text-white px-6 py-3 rounded-xl font-bold">🚪 خروج</button>
      </div>
    `;
  }
}

async function doLogin() {
  const em = document.getElementById('em').value;
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');
  
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';
  err.classList.add('hidden');
  
  try {
    await Auth.login(em, pw);
    render();
  } catch (e) {
    err.textContent = e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = '🔐 تسجيل الدخول';
  }
}

function showSettings() {
  const url = prompt('Supabase URL:', CONFIG.SB_URL);
  const key = prompt('Supabase Anon Key:', CONFIG.SB_KEY);
  if (url && key) {
    localStorage.setItem('SB_URL', url);
    localStorage.setItem('SB_KEY', key);
    localStorage.setItem('USE_SB', 'true');
    location.reload();
  }
}

render();
console.log('✓ App loaded v' + CONFIG.VERSION);
</script>
</body>
</html>
