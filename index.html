<body>

<div id="app"></div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const CONFIG = {
  APP_NAME: 'مراسلات إدارة إيواءات دير البلح',
  ORG: 'إدارة إيواءات دير البلح',
  DEV: 'WTDOsama – وتد لبرمجة مواقع الويب',
  VERSION: '3.0.0',
  
  // Supabase Configuration - استبدل هذه القيم بمفاتيح مشروعك
  SUPABASE_URL: localStorage.getItem('SUPABASE_URL') || 'https://YOUR_PROJECT.supabase.co',
  SUPABASE_ANON_KEY: localStorage.getItem('SUPABASE_ANON_KEY') || 'YOUR_ANON_KEY',
  
  USE_SUPABASE: localStorage.getItem('USE_SUPABASE') === 'true',
  STORAGE_KEY: 'deir_albalah_correspondence',
  USER_KEY: 'deir_albalah_user',
};

const SECTORS = [
  { id: 'east', name: 'القاطع الشرقي', code: 'EAST', class: 'sector-east', icon: '🌅' },
  { id: 'west', name: 'القاطع الغربي', code: 'WEST', class: 'sector-west', icon: '🌊' },
  { id: 'north', name: 'القاطع الشمالي', code: 'NORTH', class: 'sector-north', icon: '🏔️' },
  { id: 'south', name: 'القاطع الجنوبي', code: 'SOUTH', class: 'sector-south', icon: '☀️' },
];

const ROLES = {
  super_admin: 'مدير عام للنظام',
  general_admin: 'مدير عام',
  sector_admin: 'مدير قاطع',
  sector_staff: 'موظف قاطع',
};

// ============================================================
// SUPABASE CLIENT
// ============================================================
let supabase = null;
try {
  if (CONFIG.USE_SUPABASE && CONFIG.SUPABASE_URL !== 'https://YOUR_PROJECT.supabase.co') {
    supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    console.log('✓ Supabase client initialized');
  }
} catch (e) {
  console.error(' Supabase init failed:', e);
}

// ============================================================
// UTILITIES
// ============================================================
const Utils = {
  uuid: () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  }),
  
  now: () => new Date().toISOString(),
  
  formatDate: (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  },
  
  formatShortDate: (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
  },
  
  generateRef: (sectorCode) => {
    const year = new Date().getFullYear();
    const rand = Math.floor(Math.random() * 9000) + 1000;
    return `DB-${sectorCode}-${year}-${rand}`;
  },
  
  escapeHtml: (str) => {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  },
  
  saveLocal: (key, data) => {
    try {
      localStorage.setItem(key, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error(`Failed to save ${key}:`, e);
      return false;
    }
  },
  
  loadLocal: (key, def = null) => {
    try { 
      const d = localStorage.getItem(key); 
      return d ? JSON.parse(d) : def;
    } catch (e) { 
      return def; 
    }
  },
  
  toast: (msg, type = 'info') => {
    const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-600' };
    const el = document.createElement('div');
    el.className = `fixed top-4 left-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-2xl z-[200] fade-in`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  },
};

// ============================================================
// AUTHENTICATION SERVICE
// ============================================================
const AuthService = {
  currentUser: null,
  
  async getCurrentUser() {
    if (!supabase) return Utils.loadLocal(CONFIG.USER_KEY, null);
    
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return null;
    
    const { data: profile } = await supabase
      .from('profiles')
      .select('*, sectors(name_ar, code)')
      .eq('id', user.id)
      .single();
    
    this.currentUser = profile;
    return profile;
  },
  
  async login(email, password) {
    if (!supabase) throw new Error('Supabase غير مهيأ');
    
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password,
    });
    
    if (error) throw new Error(error.message);
    
    const { data: profile } = await supabase
      .from('profiles')
      .select('*, sectors(name_ar, code)')
      .eq('id', data.user.id)
      .single();
    
    this.currentUser = profile;
    return profile;
  },
  
  async signup(email, password, metadata) {
    if (!supabase) throw new Error('Supabase غير مهيأ');
    
    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: metadata },
    });
    
    if (error) throw new Error(error.message);
    return data;
  },
  
  async logout() {
    if (supabase) await supabase.auth.signOut();
    this.currentUser = null;
    localStorage.removeItem(CONFIG.USER_KEY);
    Router.navigate('login');
  },
  
  hasPermission(permission) {
    if (!this.currentUser) return false;
    const perms = {
      super_admin: ['all'],
      general_admin: ['all_sectors', 'manage_users', 'view_reports'],
      sector_admin: ['manage_sector', 'view_sector'],
      sector_staff: ['view_sector', 'create_correspondence'],
    };
    const userPerms = perms[this.currentUser.role] || [];
    return userPerms.includes('all') || userPerms.includes(permission);
  },
};

// ============================================================
// DATA SERVICE (Supabase + Local Fallback)
// ============================================================
const DataService = {
  async getCorrespondence(filters = {}) {
    if (!supabase) {
      let data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
      if (filters.sectorId) data = data.filter(d => d.sector_id === filters.sectorId);
      if (filters.search) {
        const s = filters.search.toLowerCase();
        data = data.filter(d => (d.subject + d.content + d.reference_number).toLowerCase().includes(s));
      }
      return data.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    }
    
    let query = supabase.from('correspondence').select('*, sectors(name_ar, code), profiles(full_name)');
    if (filters.sectorId) query = query.eq('sector_id', filters.sectorId);
    if (filters.is_archived !== undefined) query = query.eq('is_archived', filters.is_archived);
    
    const { data, error } = await query.order('created_at', { ascending: false });
    if (error) throw new Error(error.message);
    return data;
  },
  
  async createCorrespondence(record) {
    if (!supabase) {
      const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
      const newRec = {
        ...record,
        id: Utils.uuid(),
        reference_number: record.reference_number || Utils.generateRef(SECTORS.find(s => s.id === record.sector_id)?.code || 'XX'),
        created_at: Utils.now(),
        is_archived: false,
      };
      data.push(newRec);
      Utils.saveLocal(CONFIG.STORAGE_KEY, data);
      return newRec;
    }
    
    const { data, error } = await supabase
      .from('correspondence')
      .insert([{
        reference_number: record.reference_number || Utils.generateRef(SECTORS.find(s => s.id === record.sector_id)?.code || 'XX'),
        subject: record.subject,
        content: record.content,
        sender_id: AuthService.currentUser?.id,
        sender_name: AuthService.currentUser?.full_name,
        sector_id: record.sector_id,
        priority: record.priority || 'normal',
      }])
      .select()
      .single();
    
    if (error) throw new Error(error.message);
    return data;
  },
  
  async updateCorrespondence(id, updates) {
    if (!supabase) {
      const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
      const idx = data.findIndex(d => d.id === id);
      if (idx === -1) throw new Error('السجل غير موجود');
      data[idx] = { ...data[idx], ...updates, updated_at: Utils.now() };
      Utils.saveLocal(CONFIG.STORAGE_KEY, data);
      return data[idx];
    }
    
    const { data, error } = await supabase
      .from('correspondence')
      .update(updates)
      .eq('id', id)
      .select()
      .single();
    
    if (error) throw new Error(error.message);
    return data;
  },
  
  async archiveCorrespondence(id) {
    return this.updateCorrespondence(id, { is_archived: true, status: 'archived' });
  },
  
  async restoreCorrespondence(id) {
    return this.updateCorrespondence(id, { is_archived: false, status: 'active' });
  },
  
  async deleteCorrespondence(id) {
    if (!supabase) {
      const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []).filter(d => d.id !== id);
      Utils.saveLocal(CONFIG.STORAGE_KEY, data);
      return;
    }
    
    const { error } = await supabase.from('correspondence').delete().eq('id', id);
    if (error) throw new Error(error.message);
  },
  
  async addReply(correspondenceId, content) {
    if (!supabase) {
      const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
      const rec = data.find(d => d.id === correspondenceId);
      rec.replies = rec.replies || [];
      rec.replies.push({ id: Utils.uuid(), content, author: AuthService.currentUser?.full_name, created_at: Utils.now() });
      Utils.saveLocal(CONFIG.STORAGE_KEY, data);
      return rec;
    }
    
    const { data, error } = await supabase
      .from('replies')
      .insert([{
        correspondence_id: correspondenceId,
        user_id: AuthService.currentUser?.id,
        author_name: AuthService.currentUser?.full_name,
        content,
      }])
      .select()
      .single();
    
    if (error) throw new Error(error.message);
    return data;
  },
  
  async addFollowUp(correspondenceId, followUp) {
    if (!supabase) {
      const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
      const rec = data.find(d => d.id === correspondenceId);
      rec.follow_ups = rec.follow_ups || [];
      rec.follow_ups.push({ id: Utils.uuid(), ...followUp, created_at: Utils.now() });
      Utils.saveLocal(CONFIG.STORAGE_KEY, data);
      return rec;
    }
    
    const { data, error } = await supabase
      .from('follow_ups')
      .insert([{
        correspondence_id: correspondenceId,
        user_id: AuthService.currentUser?.id,
        ...followUp,
      }])
      .select()
      .single();
    
    if (error) throw new Error(error.message);
    return data;
  },
  
  async getReplies(correspondenceId) {
    if (!supabase) return [];
    const { data, error } = await supabase
      .from('replies')
      .select('*')
      .eq('correspondence_id', correspondenceId)
      .order('created_at', { ascending: true });
    if (error) throw new Error(error.message);
    return data;
  },
  
  async getFollowUps(correspondenceId) {
    if (!supabase) return [];
    const { data, error } = await supabase
      .from('follow_ups')
      .select('*')
      .eq('correspondence_id', correspondenceId);
    if (error) throw new Error(error.message);
    return data;
  },
};

// ============================================================
// ROUTER
// ============================================================
const Router = {
  current: 'login',
  params: {},
  
  navigate(route, params = {}) {
    this.current = route;
    this.params = params;
    window.location.hash = route + (params.id ? `/${params.id}` : '');
    App.render();
  },
  
  init() {
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1) || 'login';
      const [route, id] = hash.split('/');
      this.current = route;
      this.params = id ? { id } : {};
      App.render();
    });
    
    const hash = window.location.hash.slice(1);
    if (hash) {
      const [route, id] = hash.split('/');
      this.current = route;
      this.params = id ? { id } : {};
    }
  }
};

// ============================================================
// APP
// ============================================================
const App = {
  async render() {
    const app = document.getElementById('app');
    const user = await AuthService.getCurrentUser();
    
    if (!user && Router.current !== 'login' && Router.current !== 'settings') {
      Router.current = 'login';
    }
    
    const routes = {
      login: Views.login,
      dashboard: Views.dashboard,
      sector: Views.sector,
      general: Views.general,
      archive: Views.archive,
      followups: Views.followups,
      view: Views.viewCorrespondence,
      settings: Views.settings,
      users: Views.users,
    };
    
    const viewFn = routes[Router.current] || Views.dashboard;
    const html = typeof viewFn === 'function' ? viewFn() : '<div>Page not found</div>';
    app.innerHTML = html;
    app.classList.add('fade-in');
    
    setTimeout(() => {
      if (Router.current === 'login') Views.attachLoginHandlers();
      if (Router.current === 'sector') Views.attachSectorHandlers();
      if (Router.current === 'general') Views.attachGeneralHandlers();
    }, 50);
  }
};

// ============================================================
// VIEWS
// ============================================================
const Views = {
  login() {
    return `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md">
          <div class="text-center mb-6">
            <div class="text-6xl mb-3">🏢</div>
            <h1 class="text-2xl font-bold text-teal-800">${CONFIG.APP_NAME}</h1>
            <p class="text-gray-600 text-sm mt-2">نظام المراسلات الإدارية</p>
            <div class="mt-2 text-xs">
              ${CONFIG.USE_SUPABASE ? '<span class="text-green-600 font-bold">🔗 متصل بـ Supabase</span>' : '<span class="text-orange-600 font-bold">💾 وضع تجريبي محلي</span>'}
            </div>
          </div>
          
          <div id="loginError" class="hidden bg-red-100 border-r-4 border-red-500 text-red-700 p-3 rounded mb-4 text-sm"></div>
          
          <form id="loginForm" class="space-y-4" onsubmit="return false;">
            <div>
              <label class="block text-sm font-semibold mb-2 text-gray-700">البريد الإلكتروني</label>
              <input type="email" id="loginEmail" required autocomplete="email" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="admin@example.com">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2 text-gray-700">كلمة المرور</label>
              <input type="password" id="loginPassword" required autocomplete="current-password" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="••••••••">
            </div>
            <button type="button" id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-bold text-lg">
              🔐 تسجيل الدخول
            </button>
          </form>
          
          ${!CONFIG.USE_SUPABASE ? `
            <div class="mt-4 p-3 bg-blue-50 rounded-xl text-xs text-blue-800">
              <p class="font-bold mb-1">بيانات تجريبية (وضع محلي):</p>
              <p>البريد: <strong>admin@demo.com</strong></p>
              <p>كلمة المرور: <strong>password</strong></p>
            </div>
          ` : ''}
          
          <div class="mt-6 pt-6 border-t border-gray-200">
            <button onclick="Router.navigate('settings')" class="text-sm text-teal-700 hover:underline w-full text-center cursor-pointer">
              ⚙️ إعدادات الاتصال
            </button>
          </div>
          
          <div class="mt-4 text-xs text-gray-500 text-center">
            <p>الإصدار ${CONFIG.VERSION}</p>
          </div>
        </div>
      </div>
    `;
  },
  
  attachLoginHandlers() {
    const btn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('loginError');
    
    if (!btn) return;
    
    const doLogin = async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      
      btn.disabled = true;
      btn.innerHTML = '<span class="loading-spinner"></span> جاري تسجيل الدخول...';
      errorDiv.classList.add('hidden');
      
      try {
        let user;
        
        if (CONFIG.USE_SUPABASE && supabase) {
          user = await AuthService.login(email, password);
        } else {
          // Demo mode
          if (email === 'admin@demo.com' && password === 'password') {
            user = {
              id: 'demo-admin',
              username: 'admin',
              full_name: 'المدير العام',
              role: 'super_admin',
              sector_id: null,
              sectors: null,
            };
            Utils.saveLocal(CONFIG.USER_KEY, user);
          } else {
            throw new Error('بيانات الدخول غير صحيحة');
          }
        }
        
        Utils.toast(`مرحباً ${user.full_name}`, 'success');
        setTimeout(() => Router.navigate('dashboard'), 500);
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove('hidden');
        Utils.toast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '🔐 تسجيل الدخول';
      }
    };
    
    btn.addEventListener('click', doLogin);
    
    document.getElementById('loginForm').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        doLogin();
      }
    });
  },
  
  dashboard() {
    const user = AuthService.currentUser || Utils.loadLocal(CONFIG.USER_KEY, {});
    
    return `
      ${this.navbar()}
      <div class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="glass rounded-2xl shadow-xl p-6 mb-6">
          <h1 class="text-3xl font-bold text-teal-800 mb-2"> أهلاً ${Utils.escapeHtml(user.full_name || user.fullName)}</h1>
          <p class="text-gray-600">${ROLES[user.role] || 'مستخدم'} ${user.sector_id ? '– ' + (SECTORS.find(s=>s.id===user.sector_id)?.name || '') : ''}</p>
          <div class="flex items-center mt-3 text-sm">
            <span class="sync-indicator ${navigator.onLine ? 'sync-online' : 'sync-offline'}"></span>
            <span class="text-gray-600">${navigator.onLine ? 'متصل' : 'غير متصل'}</span>
            ${CONFIG.USE_SUPABASE ? '<span class="mr-4 text-teal-700 font-semibold"> Supabase</span>' : '<span class="mr-4 text-orange-700 font-semibold">💾 محلي</span>'}
          </div>

    const listEl = document.getElementById('correspondenceList');

    try {
      let data = await DataService.getCorrespondence({ sectorId, is_archived: false });
      
      if (filters.search) {
        const s = filters.search;
        data = data.filter(r => (r.subject + r.content + r.reference_number).toLowerCase().includes(s));

      if (filters.priority) data = data.filter(r => r.priority === filters.priority);
      
      if (filters.sortBy === 'priority') {

        data.sort((a,b) => order[a.priority] - order[b.priority]);
      } else {
        data.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
      }
      
      listEl.innerHTML = data.length === 0 
        ? '<div class="glass rounded-2xl p-12 text-center text-gray-500">لا توجد مراسلات</div>'

const UI = {
  openCreateModal(sectorId) {
    const modal = document.getElementById('createModal');
    if (modal) modal.classList.remove('hidden');
    
    setTimeout(() => {
      const btn = document.getElementById('saveCorrespondenceBtn');
      if (btn) {
        btn.onclick = async () => {
          btn.disabled = true;
          btn.innerHTML = '<span class="loading-spinner"></span> جاري الحفظ...';
          
          try {
            await DataService.createCorrespondence({
              sector_id: document.getElementById('formSector').value,
              subject: document.getElementById('formSubject').value,
              content: document.getElementById('formContent').value,
              sender_name: document.getElementById('formSender').value || AuthService.currentUser?.full_name,
              priority: document.getElementById('formPriority').value,
            });
            Utils.toast('تم حفظ المراسلة', 'success');
            document.getElementById('createModal').classList.add('hidden');
            App.render();
          } catch (err) {
            Utils.toast(err.message, 'error');
          } finally {
            btn.disabled = false;
            btn.innerHTML = '💾 حفظ';
          }
        };
      }
    }, 100);
  },
  
  saveSettings() {
    const useSupabase = document.getElementById('useSupabase').checked;
    const supabaseUrl = document.getElementById('supabaseUrl').value.trim();
    const supabaseKey = document.getElementById('supabaseKey').value.trim();
    
    localStorage.setItem('USE_SUPABASE', useSupabase);
    localStorage.setItem('SUPABASE_URL', supabaseUrl);
    localStorage.setItem('SUPABASE_ANON_KEY', supabaseKey);
    
    CONFIG.USE_SUPABASE = useSupabase;
    CONFIG.SUPABASE_URL = supabaseUrl;
    CONFIG.SUPABASE_ANON_KEY = supabaseKey;
    
    Utils.toast('تم حفظ الإعدادات - سيتم إعادة التحميل', 'success');
    setTimeout(() => location.reload(), 1000);
  },
};

// EXPORT
// ============================================================
const Exporter = {
  async toExcel() {
    try {
      const records = await DataService.getCorrespondence({ is_archived: false });
      const data = records.map(r => ({
        'الرقم المرجعي': r.reference_number,
        'التاريخ': Utils.formatShortDate(r.created_at),
        'القطاع': SECTORS.find(s => s.id === r.sector_id)?.name || '',
        'الموضوع': r.subject,
        'المحتوى': r.content,
        'الأولوية': r.priority,
        'المرسل': r.sender_name || '',
      }));
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'المراسلات');
      XLSX.writeFile(wb, `correspondence_${Date.now()}.xlsx`);
      Utils.toast('تم التصدير', 'success');
    } catch (err) {
      Utils.toast(err.message, 'error');
    }
  },
};
