    }
    
    // ✅ 2. تسجيل الدخول العادي
    if (sbConnected) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      this.user = profile ? { ...profile, email: data.user.email } : { id: data.user.id, email: data.user.email, full_name: email.split('@')[0], role: 'sector_staff' };
      subscribeToNotifications();
      setTimeout(() => refreshNotifications(), 1000);
    } else {
      if (email === 'admin@deir-albalah.ps' && password === 'password') {
        this.user = { id: 'demo-1', email: 'admin@deir-albalah.ps', username: 'admin', full_name: 'المدير العام', role: 'super_admin', sector_id: null };
      } else {
        throw new Error('بيانات الدخول غير صحيحة أو لا يوجد اتصال بالإنترنت');
      }
    }
    U.save('db_user', this.user);
    return this.user;
  },
  async logout() {
    if (sbConnected) { await sb.auth.signOut(); realtimeSubs.forEach(s => s?.unsubscribe()); realtimeSubs = []; }
    this.user = null;
    centerSession = null;
    localStorage.removeItem('db_user');
    sessionStorage.removeItem('center_session');
    render();
  }
};

function subscribeToNotifications() {
  if (!sbConnected || !Auth.user) return;
  realtimeSubs.forEach(s => s?.unsubscribe());
  realtimeSubs = [];
  const notifSub = sb.channel('notifications')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, (payload) => {
      U.toast(`🔔 ${payload.new.title}: ${payload.new.message}`, 'info');
      refreshNotifications();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, () => { refreshNotifications(); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, () => { refreshNotifications(); })
    .subscribe((status) => { console.log('🔔 Realtime subscription status:', status); });
  realtimeSubs.push(notifSub);
}

async function refreshNotifications() {
  if (!sbConnected || !Auth.user) return;
  try {
    const { count, error } = await sb.from('notifications')
      .select('*', { count: 'exact', head: true })
      .eq('user_id', Auth.user.id)
      .eq('is_read', false);
    if (error) { console.error('Error counting notifications:', error); return; }
    const badge = document.getElementById('notifBadge');
    if (badge) { badge.textContent = count || 0; badge.classList.toggle('hidden', !count); }
  } catch (e) { console.error('Error in refreshNotifications:', e); }
}

      total: all.length, pending: all.filter(c => c.status === 'pending').length,
      in_progress: all.filter(c => c.status === 'in_progress').length,
      resolved: all.filter(c => c.status === 'resolved').length,
      rejected: all.filter(c => c.status === 'rejected').length,

    };

  async syncPending() {
    if (!sbConnected) { U.toast('⚠️ لا يوجد اتصال بالإنترنت', 'warning'); return; }
    const pending = U.load('db_pending_sync', []);
    if (pending.length === 0) { U.toast('✅ لا توجد بيانات للمزامنة', 'success'); return; }
    U.toast(`🔄 جاري مزامنة ${pending.length} عنصر...`, 'info');
    let success = 0;
    const remaining = [];
    for (const item of pending) {
      try {
        if (item.type === 'correspondence' && item.action === 'create') { await this.create(item.data, []); success++; }
        else if (item.type === 'complaint' && item.action === 'create') { await this.createComplaint(item.data); success++; }
      } catch (e) { remaining.push(item); }
    }
    U.save('db_pending_sync', remaining);
    updateSyncButton();
    U.toast(`✅ تمت مزامنة ${success} عنصر بنجاح`, 'success');
  }
};

    container.style.display = 'block';
    try {
      const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', 'a4');
      const imgData = canvas.toDataURL('image/png');
      const imgWidth = 297;
      const pageHeight = 210;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while (heightLeft >= 0) { position = heightLeft - imgHeight; pdf.addPage(); pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight); heightLeft -= pageHeight; }
      pdf.save(filename);
      U.toast('✅ تم تصدير PDF بنجاح', 'success');

    const stats = { 'إجمالي المراسلات': correspondence.length, 'نشطة': correspondence.filter(r => !r.is_archived).length, 'مؤرشفة': correspondence.filter(r => r.is_archived).length };
    await this.exportPDF(`تقرير_المراسلات_${Date.now()}.pdf`, 'تقرير المراسلات', sectorName, headers, rows, stats);
  },
  exportCorrespondenceExcel(correspondence, sectorName = 'جميع القواطع') {
    const headers = ['الرقم المرجعي', 'الموضوع', 'القطاع', 'المرسل', 'الأولوية', 'التاريخ', 'الحالة'];
    const rows = correspondence.map(r => {
      const sector = SECTORS.find(s => s.id === r.sector_id);
      return [r.reference_number || '-', r.subject || '', sector?.name || '-', r.sender_name || '-', PRIORITY_LABELS[r.priority] || r.priority, U.fmtShort(r.created_at), r.is_archived ? 'مؤرشف' : 'نشط'];
    });
    this.exportExcel(`تقرير_المراسلات_${Date.now()}.xlsx`, 'المراسلات', headers, rows);
  }
};

const UI = {
  // ✅ دالة التحقق من رمز المركز
  async validateCenterCode() {
    const codeInput = document.getElementById('centerCodeInput');
    const errEl = document.getElementById('codeErr');
    const successEl = document.getElementById('codeSuccess');
    const btn = document.getElementById('validateCodeBtn');
    if (!codeInput) return;
    const code = codeInput.value.trim().toUpperCase();
    
    if (!code) {
      errEl.textContent = 'الرجاء إدخال الرمز';
      errEl.classList.remove('hidden');
      return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري التحقق...';
    errEl.classList.add('hidden');
    successEl.classList.add('hidden');
    
    try {
      const { data, error } = await sb.from('center_access_codes')
        .select('*')
        .eq('code', code)
        .eq('is_active', true)
        .single();
        
      if (error || !data) {
        throw new Error('رمز غير صحيح أو ملغى');
      }
      
      if (data.expires_at && new Date(data.expires_at) < new Date()) {
        throw new Error('الرمز منتهي الصلاحية');
      }
      
      await sb.from('center_access_codes').update({ last_used_at: new Date().toISOString() }).eq('id', data.id);
      
      const sector = SECTORS.find(s => s.id === data.sector_id);
      
      // ✅ ترقية المستخدم إلى مدير مركز وتقييده
      Auth.user.role = 'center_manager';
      Auth.user.sector_id = data.sector_id;
      Auth.user.full_name = data.center_name;
      
      sessionStorage.setItem('center_session', JSON.stringify({
        sectorId: data.sector_id,
        centerName: data.center_name
      }));
      
      U.save('db_user', Auth.user);
      
      successEl.textContent = `✅ مرحباً ${data.center_name}`;
      successEl.classList.remove('hidden');
      
      setTimeout(() => { 
        Router.page = 'create'; 
        render(); 
      }, 800);
      
    } catch (e) {
      errEl.textContent = '❌ ' + (e.message || 'فشل التحقق');
      errEl.classList.remove('hidden');
      btn.disabled = false;
      btn.innerHTML = 'تحقق ودخول';
    }
  },

  // ✅ دالة توليد رمز عشوائي للمدراء
  async generateCenterCode() {
    const centerName = document.getElementById('newCenterName').value.trim();
    const sectorId = document.getElementById('newSectorId').value;
    
    if (!centerName || !sectorId) {
      U.toast('الرجاء إدخال اسم المركز والقطاع', 'warning');
      return;
    }
    
    // ✅ توليد كود عشوائي من 8 أحرف (أحرف وأرقام)
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 8; i++) {
      code += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    
    try {
      const { data, error } = await sb.from('center_access_codes').insert([{
        code: code,
        center_name: centerName,
        sector_id: sectorId,
        is_active: true,
        created_by: Auth.user?.id
      }]).select().single();
      
      if (error) throw error;
      
      U.toast(`✅ تم توليد الرمز بنجاح: ${code}`, 'success');
      alert(`تم إنشاء رمز الدخول بنجاح!\n\nالرمز: ${code}\nالمركز: ${centerName}\n\n⚠️ يرجى نسخ الرمز الآن، لن يظهر مرة أخرى.`);
      
      document.getElementById('generateCodeModal').classList.add('hidden');
      render();
    } catch (e) {
      U.toast('❌ خطأ: ' + e.message, 'error');
    }
  },

  showGenerateCodeModal() {
    document.getElementById('generateCodeModal').classList.remove('hidden');
  },

  async toggleCenterCode(id, isActive) {
    try {
      await sb.from('center_access_codes').update({ is_active: isActive }).eq('id', id);
      U.toast(isActive ? '✅ تم تفعيل الرمز' : '⚠️ تم إلغاء الرمز', 'success');
      render();
    } catch (e) {
      U.toast('❌ خطأ: ' + e.message, 'error');
    }
  },

  async deleteCenterCode(id) {
    if (!confirm('⚠️ هل تريد حذف هذا الرمز نهائياً؟')) return;
    try {
      await sb.from('center_access_codes').delete().eq('id', id);
      U.toast('✅ تم حذف الرمز', 'success');
      render();
    } catch (e) {
      U.toast('❌ خطأ: ' + e.message, 'error');
    }
  },
  
  // ... (باقي دوال UI كما هي)
  async syncOfflineData() { await DB.syncPending(); }
};

async function render() {
  Auth.load();
  const app = document.getElementById('app');
  const whatsappBtn = document.getElementById('whatsappBtn');
  sbConnected = isOnline && sb !== null;

  if (!Auth.user) {
    app.innerHTML = Views.login();
    whatsappBtn.classList.add('hidden');
    setTimeout(() => {
      const btn = document.getElementById('lgBtn');
      if (btn) { btn.onclick = handleLogin; document.getElementById('lgPass').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); }); }
    }, 0);
    
  // ✅ التحقق من جلسة مدير المركز (دور مؤقت)
  } else if (Auth.user.role === 'pending_center_code') {
    app.innerHTML = Views.centerCodeLogin();
    whatsappBtn.classList.add('hidden');
    setTimeout(() => {
      const btn = document.getElementById('validateCodeBtn');
      if (btn) { btn.onclick = UI.validateCenterCode; }
      const input = document.getElementById('centerCodeInput');
      if (input) { input.addEventListener('keypress', e => { if (e.key === 'Enter') UI.validateCenterCode(); }); input.focus(); }
    }, 100);
    
  } else {
    whatsappBtn.classList.remove('hidden');
    const u = Auth.user;
    
    // ✅ تقييد مدير المركز في صفحة "create" فقط
    if (u.role === 'center_manager' && Router.page !== 'create') {
      Router.page = 'create';
    }
    
    if (sbConnected) {
      try {
        // ✅ منع مدير المركز من جلب أي بيانات أخرى
        if (u.role === 'center_manager') {
          appData.correspondence = [];
          appData.complaints = [];
        } else {
          let filters = {};
          if (u.role === 'sector_admin' && u.sector_id) filters.sector_id = u.sector_id;
          appData.correspondence = await DB.getAll(filters);
          if (u.role === 'super_admin' || u.role === 'general_admin') {
            appData.complaints = await DB.getComplaints({});
          } else if (u.role === 'central_oversight' && u.sector_id) {
            appData.complaints = await DB.getComplaints({ sector_id: u.sector_id });
          } else if (u.role === 'sector_admin' && u.sector_id) {
            appData.complaints = await DB.getComplaints({ sector_id: u.sector_id });
          } else {
            appData.complaints = [];
          }
        }
      } catch (e) {
        console.error("فشل جلب البيانات", e);
        appData = { correspondence: [], complaints: [], _allFollowUps: [] };
      }
    } else {
      appData.correspondence = [];
      appData.complaints = [];
    }
    
    const views = {
      dashboard: () => Views.dashboard(appData.correspondence),
      create: () => Views.create(),
      complaints: () => Views.complaints(),
      oversightDashboard: () => Views.oversightDashboard(),
      oversightComplaints: () => Views.oversightComplaints(),
      createComplaint: () => Views.createComplaint(),
      viewComplaint: () => Views.viewComplaint(),
      adminCenterCodes: () => Views.adminCenterCodes(),
    };
    
    const viewFn = views[Router.page] || (u.role === 'central_oversight' ? views.oversightDashboard : (u.role === 'center_manager' ? views.create : views.dashboard));
    const html = await viewFn();
    app.innerHTML = html;
    updateSyncButton();
  }
}

async function handleLogin() {
  const email = document.getElementById('lgEmail').value.trim();
  const password = document.getElementById('lgPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('lgBtn');
  if (!email || !password) { errEl.textContent = 'الرجاء إدخال البريد وكلمة المرور'; errEl.classList.remove('hidden'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جاري الدخول...'; errEl.classList.add('hidden');
  try { 
    await Auth.login(email, password); 
    U.toast(`مرحباً ${Auth.user.full_name}`, 'success'); 
    render(); 
  } catch (e) { 
    errEl.textContent = e.message; 
    errEl.classList.remove('hidden'); 
    btn.disabled = false; 
    btn.innerHTML = '🔐 تسجيل الدخول'; 
  }
}

render();
updateSyncButton();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded (Center Access Fully Fixed)`);
</script>
</body>
</html>
