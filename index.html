  getFileType: (mime, name) => {
    mime = mime || ''; name = name || '';
    const lowerName = name.toLowerCase();
    if (mime.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(lowerName)) return 'image';
    if (mime.includes('excel') || mime.includes('spreadsheet') || /\.(xlsx|xls|csv)$/i.test(lowerName)) return 'excel';

    if (mime.includes('word') || mime.includes('document') || /\.(doc|docx)$/i.test(lowerName)) return 'document';

    return 'other';

    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      this.user = profile || { id: data.user.id, full_name: email.split('@')[0], role: 'sector_staff' };
      subscribeToNotifications();
    } else {
      if (email === 'admin@deir-albalah.ps' && password === 'password') {
        this.user = { id: 'demo-1', username: 'admin', full_name: 'المدير العام', role: 'super_admin', sector_id: null };
      } else {
        throw new Error('بيانات الدخول غير صحيحة أو لا يوجد اتصال بالإنترنت');
      }
    }
    U.save('db_user', this.user);
    return this.user;
  },
  async logout() {
    if (sbConnected) { await sb.auth.signOut(); realtimeSubs.forEach(s => s?.unsubscribe()); realtimeSubs = []; }
    this.user = null;
    localStorage.removeItem('db_user');
    render();
  }
};

function subscribeToNotifications() {
  if (!sbConnected || !Auth.user) return;
  const notifSub = sb.channel('notifications')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, (payload) => {
      U.toast(` ${payload.new.title}: ${payload.new.message}`, 'info');
      refreshNotifications();
    }).subscribe();
  realtimeSubs.push(notifSub);
}

async function refreshNotifications() {
  if (!sbConnected) return;
  const { count } = await sb.from('notifications').select('*', { count: 'exact', head: true }).eq('user_id', Auth.user.id).eq('is_read', false);
  const badge = document.getElementById('notifBadge');
  if (badge) { badge.textContent = count || 0; badge.classList.toggle('hidden', !count); }
}

const DB = {
  async getAll(filters = {}) {
    if (sbConnected) {
      try {
        let q = sb.from('correspondence').select('*, attachments(*), replies(*), follow_ups(*)');
        if (filters.sector_id) q = q.eq('sector_id', filters.sector_id);

        const { data, error } = await q.order('created_at', { ascending: false });

  async create(rec, files = []) {
    if (sbConnected) {
      if (rec.sector_id === 'ALL') {
        const results = [];
        for (const sector of SECTORS) {
          const newId = U.uuid();

          if (insertError) throw insertError;
          let atts = [];
          if (files.length > 0) {
            try {
              await this.uploadAttachments(newId, files);
              const { data: attData } = await sb.from('attachments').select('*').eq('correspondence_id', newId);
              atts = attData || [];
            } catch (e) { console.error('Failed to upload attachments:', e); }
          }
          results.push({ ...inserted, attachments: atts });
        }

      } else {
        const recordId = U.uuid();
        const refNum = rec.reference_number || U.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX');
        const { data: inserted, error: insertError } = await sb.from('correspondence').insert([{
          id: recordId, reference_number: refNum, subject: rec.subject, content: rec.content,
          sender_id: Auth.user?.id, sender_name: rec.sender_name || Auth.user?.full_name,
          sector_id: rec.sector_id, priority: rec.priority || 'normal',
        }]).select().single();
        if (insertError) throw insertError;
        let atts = [];
        if (files.length > 0) {
          try {
            await this.uploadAttachments(recordId, files);
            const { data: attData } = await sb.from('attachments').select('*').eq('correspondence_id', recordId);
            atts = attData || [];
          } catch (e) { console.error('Failed to upload attachments:', e); }
        }
        return { ...inserted, attachments: atts };
      }
    } else {
      const recordId = U.uuid();

      const record = { id: recordId, reference_number: refNum, subject: rec.subject, content: rec.content,
        sender_name: rec.sender_name || Auth.user?.full_name, sector_id: rec.sector_id, priority: rec.priority || 'normal',
        is_archived: false, replies: [], follow_ups: [], attachments: [], created_at: U.now(), _pending: true };

  async uploadAttachments(correspondenceId, files) {
    if (!sbConnected) return;
    for (let i = 0; i < files.length; i++) {

      const path = `${correspondenceId}/${U.uuid()}.${ext}`;

    }

  async createComplaint(complaint) {
    const files = complaint.files || [];
    const complaintData = {
      sector_id: complaint.sector_id,
      title: complaint.title,
      description: complaint.description,
      complainant_name: complaint.complainant_name || '',
      complainant_phone: complaint.complainant_phone || '',
      complainant_type: complaint.complainant_type || 'مواطن',
      priority: complaint.priority || 'medium',
      source: complaint.source || 'internal',
      submitted_by: Auth.user?.id,
      submitted_by_name: Auth.user?.full_name,
      status: 'pending',
      admin_response: '',
      created_at: new Date().toISOString()
    };
    const record = { ...complaintData, id: U.uuid(), _pending: !sbConnected, attachments: [] };
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').insert([complaintData]).select().single();
      if (error) throw new Error(error.message || 'فشل إنشاء الشكوى');
      if (files.length > 0 && data.id) {
        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const ext = file.name.split('.').pop();
            const path = `complaints/${data.id}/${U.uuid()}.${ext}`;
            const { error: uploadError } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type, upsert: false });
            if (uploadError) { console.error('Failed to upload file:', uploadError); continue; }
            await sb.from('attachments').insert([{
              correspondence_id: data.id, file_name: path, original_name: file.name,
              mime_type: file.type, size_bytes: file.size, file_type: U.getFileType(file.type, file.name),
              storage_path: path, uploaded_by: Auth.user?.id,
            }]);
          }
          const { data: attData } = await sb.from('attachments').select('*').eq('correspondence_id', data.id);
          return { ...data, attachments: attData || [] };
        } catch (e) { console.error('Error uploading attachments:', e); }
      }
      return { ...data, attachments: [] };
    } else {
      const pending = U.load('db_pending_sync', []);
      pending.push({ type: 'complaint', action: 'create', data: record, files: files.map(f => ({ name: f.name, type: f.type, size: f.size })) });
      U.save('db_pending_sync', pending);
      const complaints = U.load('db_complaints', []);
      complaints.push(record);
      U.save('db_complaints', complaints);
      U.save('db_complaints_cache', complaints);
      U.toast('💾 تم حفظ الشكوى محلياً', 'info');
      updateSyncButton();
      return record;
    }
  },
  
  async updateComplaint(id, updates) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').update({ ...updates, updated_at: new Date().toISOString() }).eq('id', id).select().single();
      if (error) throw error; return data;
    }
    const complaints = U.load('db_complaints', []);
    const idx = complaints.findIndex(c => c.id === id);
    if (idx === -1) throw new Error('غير موجود');
    complaints[idx] = { ...complaints[idx], ...updates, updated_at: U.now() };
    U.save('db_complaints', complaints);
    return complaints[idx];

  async getComplaintById(id) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').select('*').eq('id', id).single();
      if (!error && data) return data;
    }
    return U.load('db_complaints', []).find(c => c.id === id);
  },
  
  async getComplaintStats(sector_id) {
    const all = await this.getComplaints(sector_id ? { sector_id } : {});
    return {
      total: all.length, pending: all.filter(c => c.status === 'pending').length,
      in_progress: all.filter(c => c.status === 'in_progress').length,
      resolved: all.filter(c => c.status === 'resolved').length,
      rejected: all.filter(c => c.status === 'rejected').length,
      urgent: all.filter(c => c.priority === 'urgent').length,
    };
  },
  
  async syncPending() {
    if (!sbConnected) { U.toast('⚠️ لا يوجد اتصال بالإنترنت', 'warning'); return; }
    const pending = U.load('db_pending_sync', []);
    if (pending.length === 0) { U.toast('✅ لا توجد بيانات للمزامنة', 'success'); return; }
    U.toast(`🔄 جاري مزامنة ${pending.length} عنصر...`, 'info');
    let success = 0, failed = 0;
    const remaining = [];
    for (const item of pending) {
      try {
        if (item.type === 'correspondence' && item.action === 'create') {
          await this.create(item.data, []);
          success++;
        } else if (item.type === 'complaint' && item.action === 'create') {
          await this.createComplaint(item.data);
          success++;
        }
      } catch (e) {
        console.error('Sync failed for item:', e);
        remaining.push(item);
        failed++;
      }
    }
    U.save('db_pending_sync', remaining);
    updateSyncButton();
    if (failed === 0) U.toast(`✅ تمت مزامنة ${success} عنصر بنجاح`, 'success');
    else U.toast(`⚠️ تمت مزامنة ${success} وفشل ${failed}`, 'warning');
  }
};

const Reports = {
  buildReportHTML(title, subtitle, headers, rows, stats = null) {
    let html = `
      <div style="padding: 30px; background: white; direction: rtl; font-family: 'Cairo', sans-serif;">
        <div style="text-align: center; border-bottom: 3px solid #0f766e; padding-bottom: 20px; margin-bottom: 20px;">
          <h1 style="color: #0f766e; margin: 0; font-size: 28px;">${title}</h1>
          <h2 style="color: #6b7280; margin: 10px 0; font-size: 18px;">${subtitle}</h2>
          <p style="color: #9ca3af; margin: 5px 0; font-size: 14px;">تاريخ التقرير: ${U.fmtDate(new Date().toISOString())}</p>
          <p style="color: #9ca3af; margin: 5px 0; font-size: 14px;">${CONFIG.ORG} - ${CONFIG.DEV}</p>
        </div>
    `;
    if (stats) {
      html += `<div style="display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap;">`;
      for (const [key, value] of Object.entries(stats)) {
        html += `
          <div style="flex: 1; min-width: 120px; background: #f3f4f6; padding: 15px; border-radius: 10px; text-align: center; border-right: 4px solid #0f766e;">
            <div style="font-size: 24px; font-weight: bold; color: #0f766e;">${value}</div>
            <div style="font-size: 12px; color: #6b7280; margin-top: 5px;">${key}</div>
          </div>
        `;
      }
      html += `</div>`;
    }
    html += `
      <table class="report-table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
        <thead>
          <tr>
            ${headers.map(h => `<th style="background: #0f766e; color: white; padding: 12px; text-align: right; border: 1px solid #0d5f59; font-weight: 700;">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${rows.map((row, idx) => `
            <tr style="background: ${idx % 2 === 0 ? '#ffffff' : '#f9fafb'};">
              ${row.map(cell => `<td style="padding: 10px 12px; border: 1px solid #e5e7eb; text-align: right;">${cell}</td>`).join('')}
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e5e7eb; text-align: center; color: #9ca3af; font-size: 12px;">
        <p>© ${new Date().getFullYear()} ${CONFIG.ORG} - جميع الحقوق محفوظة</p>
        <p>تم إنشاء هذا التقرير بواسطة ${CONFIG.APP_NAME}</p>
      </div>
    </div>`;
    return html;
  },
  
  async exportPDF(filename, title, subtitle, headers, rows, stats = null) {
    U.toast('🔄 جاري إنشاء ملف PDF...', 'info');
    const container = document.getElementById('reportContainer');
    container.innerHTML = this.buildReportHTML(title, subtitle, headers, rows, stats);
    container.style.display = 'block';
    try {
      const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', 'a4');
      const imgData = canvas.toDataURL('image/png');
      const imgWidth = 297;
      const pageHeight = 210;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while (heightLeft >= 0) {
        position = heightLeft - imgHeight;
        pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
      }
      pdf.save(filename);
      U.toast('✅ تم تصدير PDF بنجاح', 'success');
    } catch (e) {
      console.error('PDF export error:', e);
      U.toast('❌ فشل تصدير PDF', 'error');
    } finally {
      container.style.display = 'none';
      container.innerHTML = '';
    }
  },
  
  exportExcel(filename, sheetName, headers, rows) {
    U.toast('🔄 جاري إنشاء ملف Excel...', 'info');
    try {
      const wb = XLSX.utils.book_new();
      const wsData = [headers, ...rows];
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const colWidths = headers.map(h => ({ wch: Math.max(h.length * 2, 15) }));
      ws['!cols'] = colWidths;
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
      U.toast('✅ تم تصدير Excel بنجاح', 'success');
    } catch (e) {
      console.error('Excel export error:', e);
      U.toast('❌ فشل تصدير Excel', 'error');
    }
  },

    const rows = followUps.map(fu => {
      const sector = fu.correspondence ? SECTORS.find(s => s.id === fu.correspondence.sector_id) : null;
      return [
        fu.correspondence?.reference_number || fu.correspondence_id?.substring(0, 8) || '-',
        fu.title || '',
        fu.correspondence?.subject || '-',
        sector?.name || '-',
        STATUS_LABELS[fu.status] || fu.status,
        U.fmtShort(fu.created_at),
        fu.due_date ? U.fmtShort(fu.due_date) : '-',
        fu.notes || '-'
      ];
    });
    const stats = {
      'إجمالي المتابعات': followUps.length,

    await this.exportPDF(`تقرير_المتابعات_${Date.now()}.pdf`, 'تقرير المتابعات', sectorName, headers, rows, stats);

  async exportComplaintsPDF(complaints, sectorName = 'جميع القواطع') {

            <div><div class="text-xs text-gray-500">الأولوية</div><div class="font-semibold">${r.priority === 'high' ? ' عالية' : r.priority === 'low' ? '🟢 منخفضة' : r.priority === 'urgent' ? '🚨 عاجلة' : '🔵 عادية'}</div></div>
          </div>

            return `<div class="attachment-card"><div class="attachment-info"><div class="attachment-icon">${fileIcon}</div><div class="min-w-0 flex-1"><div class="attachment-name">${U.esc(att.original_name || 'ملف')}</div><div class="attachment-size">${fileSize} • ${fileType.toUpperCase()}</div></div></div><a href="${fileUrl}" download="${U.esc(att.original_name || 'ملف')}" target="_blank" class="download-btn" onclick="event.stopPropagation();">⬇️ ${downloadLabel}</a></div>`;
          }).join('')}</div></div>` : '<div class="mb-6 text-center text-gray-500 text-sm py-4 bg-gray-50 rounded-xl"> لا توجد مرفقات</div>'}
          ${followUps.length > 0 ? `<div class="mb-6">

  async complaints() {
    const u = Auth.user || {};
    const isAdmin = u.role === 'super_admin' || u.role === 'general_admin';
    let allComplaints = [];
    try {
      if (isAdmin) allComplaints = await DB.getComplaints({});
      else if (u.role === 'sector_admin' && u.sector_id) allComplaints = await DB.getComplaints({ sector_id: u.sector_id });
      else if (u.role === 'central_oversight' && u.sector_id) allComplaints = await DB.getComplaints({ sector_id: u.sector_id });
      else allComplaints = await DB.getComplaints({ sector_id: u.sector_id });
    } catch (e) { console.error('Error fetching complaints:', e); }
    const stats = {
      total: allComplaints.length, pending: allComplaints.filter(c => c.status === 'pending').length,
      in_progress: allComplaints.filter(c => c.status === 'in_progress').length,
      resolved: allComplaints.filter(c => c.status === 'resolved').length,
      rejected: allComplaints.filter(c => c.status === 'rejected').length,
      urgent: allComplaints.filter(c => c.priority === 'urgent').length,
    };
    const statusColors = { pending: 'bg-yellow-100 text-yellow-800', in_progress: 'bg-blue-100 text-blue-800', resolved: 'bg-green-100 text-green-800', rejected: 'bg-red-100 text-red-800' };
    const statusLabels = { pending: 'قيد الانتظار', in_progress: 'قيد المعالجة', resolved: 'تم الحل', rejected: 'مرفوضة' };
    const priorityColors = { low: 'bg-gray-100 text-gray-700', medium: 'bg-blue-100 text-blue-700', high: 'bg-orange-100 text-orange-700', urgent: 'bg-red-100 text-red-700' };
    const priorityLabels = { low: 'منخفضة', medium: 'متوسطة', high: 'عالية', urgent: 'عاجلة' };
    const sectorName = isAdmin ? 'جميع القواطع' : (SECTORS.find(s => s.id === u.sector_id)?.name || '');
    return `<div class="min-h-screen">${this.navbar()}
      <div class="max-w-7xl mx-auto p-4 md:p-6 fade-in">
        <div class="glass rounded-2xl shadow-xl p-6 mb-6">
          <div class="flex justify-between items-center flex-wrap gap-4">
            <div><h1 class="text-3xl font-bold text-teal-800"> نظام الشكاوى</h1><p class="text-gray-600 mt-1">${isAdmin ? 'جميع شكاوى القواطع' : 'شكاوى القطاع'} (${allComplaints.length})</p></div>
            <div class="flex gap-2 flex-wrap">
              <button onclick="Router.go('createComplaint')" class="btn-primary px-6 py-3 rounded-xl font-bold cursor-pointer">➕ تسجيل شكوى جديدة</button>
              <button onclick="Reports.exportComplaintsPDF(allComplaints, '${sectorName}')" class="report-btn report-btn-pdf">📄 PDF</button>
              <button onclick="Reports.exportComplaintsExcel(allComplaints, '${sectorName}')" class="report-btn report-btn-excel">📊 Excel</button>
            </div>
          </div>
          <div class="mt-6 grid grid-cols-2 md:grid-cols-5 gap-3">
            <div class="bg-gray-50 p-4 rounded-xl text-center"><div class="text-2xl font-bold text-gray-700">${stats.total}</div><div class="text-xs text-gray-600">إجمالي الشكاوى</div></div>
            <div class="bg-yellow-50 p-4 rounded-xl text-center"><div class="text-2xl font-bold text-yellow-700">${stats.pending}</div><div class="text-xs text-gray-600">قيد الانتظار</div></div>
            <div class="bg-blue-50 p-4 rounded-xl text-center"><div class="text-2xl font-bold text-blue-700">${stats.in_progress}</div><div class="text-xs text-gray-600">قيد المعالجة</div></div>
            <div class="bg-green-50 p-4 rounded-xl text-center"><div class="text-2xl font-bold text-green-700">${stats.resolved}</div><div class="text-xs text-gray-600">تم الحل</div></div>
            <div class="bg-red-50 p-4 rounded-xl text-center"><div class="text-2xl font-bold text-red-700">${stats.urgent}</div><div class="text-xs text-gray-600">عاجلة 🔴</div></div>
          </div>
        </div>
        <div class="glass rounded-2xl shadow-xl p-4 mb-4">
          <div class="grid md:grid-cols-4 gap-3">
            <input type="text" id="cSearch" placeholder="🔍 بحث بالعنوان..." class="px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none">
            <select id="cStatus" class="px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none">
              <option value="">كل الحالات</option><option value="pending">قيد الانتظار</option><option value="in_progress">قيد المعالجة</option><option value="resolved">تم الحل</option><option value="rejected">مرفوضة</option>
            </select>
            <select id="cPriority" class="px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none">
              <option value="">كل الأولويات</option><option value="urgent">🔴 عاجلة</option><option value="high">🟠 عالية</option><option value="medium">🔵 متوسطة</option><option value="low">⚪ منخفضة</option>
            </select>
            ${isAdmin ? `<select id="cSector" class="px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none"><option value="">كل القواطع</option>${SECTORS.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select>` : '<div></div>'}
          </div>
        </div>
        <div id="complaintsList" class="space-y-3">
          ${allComplaints.length === 0 ? '<div class="glass rounded-2xl p-12 text-center text-gray-500">📭 لا توجد شكاوى مسجلة</div>' : allComplaints.map(c => {
            const sector = SECTORS.find(s => s.id === c.sector_id);
            return `<div class="glass rounded-2xl shadow-lg p-5 card-hover cursor-pointer ${c.priority === 'urgent' ? 'border-2 border-red-300' : ''}" onclick="Router.go('viewComplaint', {id:'${c.id}'})">
              <div class="flex justify-between items-start mb-3 flex-wrap gap-2">
                <div class="flex-1">
                  <div class="flex items-center gap-2 text-xs text-gray-500 mb-1">
                    <span>#${c.id.substring(0, 8)}</span><span>•</span><span>${U.fmtDate(c.created_at)}</span>
                    ${sector ? `<span>•</span><span>${sector.name}</span>` : ''}
                    ${c.complainant_name ? `<span>•</span><span>👤 ${U.esc(c.complainant_name)}</span>` : ''}
                  </div>
                  <h3 class="font-bold text-lg text-gray-800">${U.esc(c.title)}</h3>
                  <p class="text-sm text-gray-600 mt-1">${U.esc((c.description || '').substring(0, 150))}...</p>
                </div>
                <div class="flex flex-col gap-2">
                  <span class="px-3 py-1 rounded-full text-xs font-bold ${statusColors[c.status]}">${statusLabels[c.status]}</span>
                  <span class="px-3 py-1 rounded-full text-xs font-bold ${priorityColors[c.priority]}">${priorityLabels[c.priority]}</span>
                </div>
              </div>
              <div class="flex gap-4 text-xs text-gray-500 flex-wrap">
                ${c.complainant_phone ? `<span>📞 ${U.esc(c.complainant_phone)}</span>` : ''}
                <span>📤 ${U.esc(c.submitted_by_name || 'مستخدم')}</span>
                ${c.admin_response ? '<span class="text-green-600 font-semibold">✓ تم الرد</span>' : '<span class="text-orange-600">⏳ بانتظار الرد</span>'}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  },

    return `<nav class="glass shadow-lg sticky top-0 z-50 border-t-4 border-orange-500">

          <span class="text-2xl">🏢</span>
          <div><div class="font-bold text-teal-800 text-sm md:text-base">${CONFIG.APP_NAME}</div><div class="text-xs text-gray-600 hidden md:block">${U.esc(u.full_name)} ${!isOnline ? '📡' : ''}</div></div>

  async viewComplaint() {
    const id = Router.params.id;
    const complaint = await DB.getComplaintById(id);
    if (!complaint) return '<div class="p-8 text-white text-center text-xl">الشكوى غير موجودة</div>';
    const u = Auth.user || {};
    const sector = SECTORS.find(s => s.id === complaint.sector_id);
    const canRespond = ['super_admin', 'general_admin', 'sector_admin', 'central_oversight'].includes(u.role);
    const statusColors = { pending: 'bg-yellow-100 text-yellow-800', in_progress: 'bg-blue-100 text-blue-800', resolved: 'bg-green-100 text-green-800', rejected: 'bg-red-100 text-red-800' };
    const statusLabels = { pending: 'قيد الانتظار', in_progress: 'قيد المعالجة', resolved: 'تم الحل', rejected: 'مرفوضة' };
    const priorityLabels = { low: ' منخفضة', medium: '🔵 متوسطة', high: '🟠 عالية', urgent: ' عاجلة' };
    let attachments = [];
    if (sbConnected) {
      try {
        const { data } = await sb.from('attachments').select('*').eq('correspondence_id', complaint.id);
        attachments = data || [];
      } catch (e) { console.error('Error fetching attachments:', e); }
    }
    return `<div class="min-h-screen">
      ${u.role === 'central_oversight' ? this.oversightNavbar() : this.navbar()}
      <div class="max-w-4xl mx-auto p-4 md:p-6 fade-in">
        <button onclick="history.back()" class="mb-4 text-white hover:text-gray-200 font-semibold cursor-pointer">→ رجوع</button>
        <div class="glass rounded-2xl shadow-xl p-6 md:p-8">
          <div class="border-b-2 border-teal-600 pb-4 mb-6">
            <div class="flex justify-between items-start flex-wrap gap-3">
              <div><h1 class="text-2xl font-bold text-teal-800"> ${U.esc(complaint.title)}</h1><p class="text-gray-500 text-sm mt-1">#${complaint.id.substring(0, 8)} • ${U.fmtDate(complaint.created_at)}</p></div>
              <span class="px-3 py-1 rounded-full text-sm font-bold ${statusColors[complaint.status]}">${statusLabels[complaint.status]}</span>
            </div>
          </div>
          <div class="grid md:grid-cols-2 gap-4 mb-6">
            <div><div class="text-xs text-gray-500">القطاع</div><div class="font-semibold">${sector?.name || '-'}</div></div>
            <div><div class="text-xs text-gray-500">الأولوية</div><div class="font-semibold">${priorityLabels[complaint.priority] || complaint.priority}</div></div>
            ${complaint.complainant_name ? `<div><div class="text-xs text-gray-500">اسم المشتكي</div><div class="font-semibold">${U.esc(complaint.complainant_name)}</div></div>` : ''}
            ${complaint.complainant_phone ? `<div><div class="text-xs text-gray-500">الهاتف</div><div class="font-semibold">${U.esc(complaint.complainant_phone)}</div></div>` : ''}
            <div><div class="text-xs text-gray-500">نوع المشتكي</div><div class="font-semibold">${U.esc(complaint.complainant_type || 'مواطن')}</div></div>
            <div><div class="text-xs text-gray-500">أرسلها</div><div class="font-semibold">${U.esc(complaint.submitted_by_name || 'مستخدم')}</div></div>
          </div>
          <div class="mb-6"><div class="text-xs text-gray-500 mb-1">تفاصيل الشكوى</div><div class="bg-gray-50 p-4 rounded-xl whitespace-pre-wrap leading-relaxed">${U.esc(complaint.description)}</div></div>
          ${attachments.length > 0 ? `<div class="mb-6"><div class="text-xs text-gray-500 mb-2">📎 المرفقات (${attachments.length})</div><div class="space-y-2">${attachments.map(att => {
            const fileType = U.getFileType(att.mime_type, att.original_name);
            const fileIcon = U.getFileIcon(fileType);
            const downloadLabel = U.getDownloadLabel(fileType);
            const fileSize = U.formatFileSize(att.size_bytes);
            const fileUrl = sbConnected ? `${CONFIG.SB_URL}/storage/v1/object/public/attachments/${att.storage_path || att.file_name}` : '#';
            return `<div class="attachment-card"><div class="attachment-info"><div class="attachment-icon">${fileIcon}</div><div class="min-w-0 flex-1"><div class="attachment-name">${U.esc(att.original_name || 'ملف')}</div><div class="attachment-size">${fileSize} • ${fileType.toUpperCase()}</div></div></div><a href="${fileUrl}" download="${U.esc(att.original_name || 'ملف')}" target="_blank" class="download-btn">⬇️ ${downloadLabel}</a></div>`;
          }).join('')}</div></div>` : ''}
          ${complaint.admin_response ? `<div class="mb-6 bg-green-50 border-r-4 border-green-500 p-4 rounded-xl"><h3 class="font-bold text-gray-800 mb-2">✅ رد الإدارة</h3><div class="whitespace-pre-wrap">${U.esc(complaint.admin_response)}</div>${complaint.resolved_at ? `<div class="text-xs text-gray-500 mt-2">تم الحل في: ${U.fmtDate(complaint.resolved_at)}</div>` : ''}</div>` : ''}
          ${canRespond && complaint.status !== 'resolved' ? `<div class="border-t pt-4 mt-4">
            <h3 class="font-bold text-gray-800 mb-3">⚡ إجراءات</h3>
            <div class="space-y-3">
              <div><label class="block text-sm font-semibold mb-1">تغيير الحالة</label>
                <select id="updateStatus" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl">
                  <option value="pending" ${complaint.status === 'pending' ? 'selected' : ''}>قيد الانتظار</option>
                  <option value="in_progress" ${complaint.status === 'in_progress' ? 'selected' : ''}>قيد المعالجة</option>
                  <option value="resolved" ${complaint.status === 'resolved' ? 'selected' : ''}>تم الحل</option>
                  <option value="rejected" ${complaint.status === 'rejected' ? 'selected' : ''}>مرفوضة</option>
                </select>
              </div>
              <div><label class="block text-sm font-semibold mb-1">رد الإدارة</label><textarea id="adminResponse" rows="4" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl" placeholder="اكتب الرد هنا...">${U.esc(complaint.admin_response || '')}</textarea></div>
              <button onclick="UI.updateComplaint('${complaint.id}')" class="btn-primary w-full py-3 rounded-xl font-bold">💾 حفظ التحديثات</button>
            </div>
          </div>` : ''}
        </div>
      </div>
    </div>`;
  },

    const statusColors = { pending: 'bg-yellow-100 text-yellow-800', in_progress: 'bg-blue-100 text-blue-800', resolved: 'bg-green-100 text-green-800', rejected: 'bg-red-100 text-red-800' };
    const statusLabels = { pending: 'قيد الانتظار', in_progress: 'قيد المعالجة', resolved: 'تم الحل', rejected: 'مرفوضة' };
    const priorityColors = { low: 'bg-gray-100 text-gray-700', medium: 'bg-blue-100 text-blue-700', high: 'bg-orange-100 text-orange-700', urgent: 'bg-red-100 text-red-700' };
    const priorityLabels = { low: 'منخفضة', medium: 'متوسطة', high: 'عالية', urgent: 'عاجلة' };
    return `<div class="glass rounded-2xl shadow-lg p-5 card-hover cursor-pointer ${c.priority === 'urgent' ? 'border-2 border-red-300' : ''}" onclick="Router.go('viewComplaint', {id:'${c.id}'})">

        <div class="flex-1">
          <div class="flex items-center gap-2 text-xs text-gray-500 mb-1">
            <span>#${c.id.substring(0, 8)}</span><span>•</span><span>${U.fmtDate(c.created_at)}</span>
            ${sector ? `<span>•</span><span>${sector.name}</span>` : ''}
          </div>
          <h3 class="font-bold text-lg text-gray-800">${U.esc(c.title)}</h3>
          <p class="text-sm text-gray-600 mt-1">${U.esc((c.description || '').substring(0, 150))}...</p>
        </div>
        <div class="flex flex-col gap-2">
          <span class="px-3 py-1 rounded-full text-xs font-bold ${statusColors[c.status]}">${statusLabels[c.status]}</span>
          <span class="px-3 py-1 rounded-full text-xs font-bold ${priorityColors[c.priority]}">${priorityLabels[c.priority]}</span>
        </div>
      </div>
      <div class="flex gap-4 text-xs text-gray-500 flex-wrap">
        ${c.complainant_name ? `<span> ${U.esc(c.complainant_name)}</span>` : ''}
        ${c.complainant_phone ? `<span>📞 ${U.esc(c.complainant_phone)}</span>` : ''}
        ${c.admin_response ? '<span class="text-green-600 font-semibold">✓ تم الرد</span>' : ''}
      </div>
    </div>`;
  },
};

// =====================================================
// UI ACTIONS
// =====================================================
const UI = {
  reply(id) { const content = prompt('نص الرد:'); if (!content) return; try { DB.addReply(id, content); U.toast('تم إضافة الرد', 'success'); render(); } catch (e) { U.toast(e.message, 'error'); } },
  
  followUp(id) {
    const title = prompt('عنوان المهمة:');
    if (!title) return;
    const notes = prompt('ملاحظات (اختياري):') || '';
    const dueDate = prompt('تاريخ الاستحقاق (YYYY-MM-DD) - اختياري:') || null;
    if (dueDate && !/^\d{4}-\d{2}-\d{2}$/.test(dueDate)) {
      U.toast('⚠️ صيغة التاريخ غير صحيحة. استخدم YYYY-MM-DD', 'warning');
      return;
    }
    try {
      DB.addFollowUp(id, { title, notes, due_date: dueDate, status: 'pending' });
      U.toast('✅ تمت إضافة المتابعة', 'success');
      render();
    } catch (e) { U.toast(e.message, 'error'); }
  },
  
  async changeFollowUpStatus(fuId, corrId, newStatus) {
    try {
      await DB.updateFollowUp(fuId, { status: newStatus });
      U.toast('✅ تم تحديث حالة المتابعة', 'success');
      render();
    } catch (e) { U.toast(e.message, 'error'); }
  },
  
  async deleteFollowUp(fuId, corrId) {
    if (!confirm('⚠️ هل تريد حذف هذه المتابعة؟')) return;
    try {
      await DB.deleteFollowUp(fuId, corrId);
      U.toast('✅ تم حذف المتابعة', 'success');
      render();
    } catch (e) { U.toast(e.message, 'error'); }
  },
  
  async archive(id) { if (!confirm('تأكيد أرشفة هذه المراسلة؟')) return; try { await DB.archive(id); U.toast('تمت الأرشفة', 'success'); render(); } catch (e) { U.toast(e.message, 'error'); } },
  async restore(id) { try { await DB.restore(id); U.toast('تمت الاستعادة', 'success'); render(); } catch (e) { U.toast(e.message, 'error'); } },
  async del(id) { if (!confirm('⚠️ حذف نهائي؟')) return; try { await DB.remove(id); U.toast('تم الحذف', 'success'); Router.go('dashboard'); } catch (e) { U.toast(e.message, 'error'); } },
  openWhatsApp() { const msg = encodeURIComponent(`مرحباً، أنا من ${CONFIG.ORG}`); window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${msg}`, '_blank'); },
  forgotPassword() { const email = prompt('الرجاء إدخال بريدك الإلكتروني لاستعادة كلمة المرور:'); if (!email) return; if (sbConnected) { sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin }).then(() => U.toast('✅ تم إرسال رابط إعادة تعيين كلمة المرور', 'success')).catch(err => U.toast('❌ خطأ: ' + err.message, 'error')); } else { U.toast('⚠️ هذه الميزة متاحة فقط عند الاتصال بـ Supabase', 'warning'); } },
  registerNewUser() { if (!sbConnected) { U.toast('⚠️ التسجيل متوفر فقط عند الاتصال بـ Supabase', 'warning'); return; } const email = prompt('البريد الإلكتروني:'); if (!email) return; const password = prompt('كلمة المرور (6 أحرف على الأقل):'); if (!password || password.length < 6) { U.toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'warning'); return; } const fullName = prompt('الاسم الكامل:'); const username = prompt('اسم المستخدم:'); const role = prompt('الدور (super_admin/general_admin/sector_admin/central_oversight/sector_staff):', 'sector_staff'); sb.auth.signUp({ email, password, options: { data: { full_name: fullName || email.split('@')[0], username: username || email.split('@')[0], role: role || 'sector_staff' } } }).then(({ data, error }) => { if (error) throw error; U.toast('✅ تم إنشاء الحساب بنجاح!', 'success'); }).catch(err => U.toast('❌ خطأ: ' + err.message, 'error')); },
  
  async submitComplaint() {
    const sector = document.getElementById('compSector').value;
    const title = document.getElementById('compTitle').value.trim();
    const description = document.getElementById('compDesc').value.trim();
    const name = document.getElementById('compName').value.trim();
    const phone = document.getElementById('compPhone').value.trim();
    const type = document.getElementById('compType').value;
    const priority = document.getElementById('compPriority').value;
    const fileInput = document.getElementById('compFiles');
    const files = fileInput?.files ? Array.from(fileInput.files) : [];
    if (!title || !description) { U.toast('الرجاء إدخال العنوان والتفاصيل', 'warning'); return; }
    const btn = document.getElementById('submitComplaintBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جاري الإرسال...';
    try {
      await DB.createComplaint({ sector_id: sector, title, description, complainant_name: name, complainant_phone: phone, complainant_type: type, priority, files: files, source: 'internal' });
      U.toast('✅ تم إرسال الشكوى بنجاح', 'success');
      const u = Auth.user || {};
      Router.go(u.role === 'central_oversight' ? 'oversightDashboard' : 'complaints');
    } catch (e) { U.toast(e.message || 'حدث خطأ', 'error'); btn.disabled = false; btn.innerHTML = '📤 إرسال الشكوى'; }
  },
  
  async updateComplaint(id) {
    const status = document.getElementById('updateStatus').value;
    const response = document.getElementById('adminResponse').value.trim();
    const updates = { status, admin_response: response };
    if (status === 'resolved') { updates.resolved_by = Auth.user?.id; updates.resolved_at = new Date().toISOString(); }
    try { await DB.updateComplaint(id, updates); U.toast('✅ تم تحديث الشكوى', 'success'); Router.go('viewComplaint', { id }); } catch (e) { U.toast(e.message || 'حدث خطأ', 'error'); }
  },
  
  async exportOversightReport() {
    const u = Auth.user || {};
    const complaints = await DB.getComplaints({ sector_id: u.sector_id });
    const sector = SECTORS.find(s => s.id === u.sector_id);
    const format = prompt('اختر صيغة التصدير:\n1 - PDF\n2 - Excel', '1');
    if (format === '1') { await Reports.exportComplaintsPDF(complaints, sector?.name || ''); }
    else if (format === '2') { Reports.exportComplaintsExcel(complaints, sector?.name || ''); }
  },
  
  async syncOfflineData() { await DB.syncPending(); },
  
  copyAsText(id) {
    const r = appData.correspondence.find(x => x.id === id);
    if (!r) { U.toast('المراسلة غير موجودة', 'error'); return; }
    const s = SECTORS.find(x => x.id === r.sector_id);
    const text = `📋 ${CONFIG.ORG}\n\n🔢 الرقم: ${r.reference_number || '-'}\n📌 الموضوع: ${r.subject || '-'}\n📅 التاريخ: ${U.fmtDate(r.created_at)}\n القطاع: ${s?.name || '-'}\n⚡ الأولوية: ${r.priority === 'high' ? 'عالية' : r.priority === 'low' ? 'منخفضة' : r.priority === 'urgent' ? 'عاجلة' : 'عادية'}\n\n📝 المحتوى:\n${r.content || '-'}\n\n━━━━━━━━━━━━━━━\nتم الإنشاء بواسطة: ${CONFIG.APP_NAME}`;
    if (navigator.clipboard) { navigator.clipboard.writeText(text).then(() => U.toast('✅ تم نسخ المراسلة كنص', 'success')).catch(() => this.fallbackCopy(text)); } else { this.fallbackCopy(text); }
  },
  
  fallbackCopy(text) { const textarea = document.createElement('textarea'); textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0'; document.body.appendChild(textarea); textarea.select(); try { document.execCommand('copy'); U.toast('✅ تم نسخ المراسلة كنص', 'success'); } catch (e) { U.toast('❌ فشل النسخ', 'error'); } document.body.removeChild(textarea); },
  
  showQR(id) {
    const r = appData.correspondence.find(x => x.id === id);
    if (!r) return;
    const modal = document.getElementById('qrModal');
    const container = document.getElementById('qrContainer');
    if (!modal || !container) return;
    container.innerHTML = '';
    const qrData = `📋 ${r.reference_number || ''}\n📌 ${r.subject}\n📅 ${U.fmtDate(r.created_at)}\n\n${r.content || ''}`;
    try { new QRCode(container, { text: qrData, width: 220, height: 220, colorDark: '#0f766e', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); } catch (e) { container.innerHTML = '<div class="text-red-600">فشل إنشاء QR</div>'; }
    modal.classList.remove('hidden');
  },
  
  shareWhatsApp(id) {
    const r = appData.correspondence.find(x => x.id === id);
    if (!r) return;
    const s = SECTORS.find(x => x.id === r.sector_id);
    const text = `*${CONFIG.ORG}*\n\n🔢 الرقم: ${r.reference_number || '-'}\n📌 الموضوع: ${r.subject || '-'}\n التاريخ: ${U.fmtDate(r.created_at)}\n🏢 القطاع: ${s?.name || '-'}\n\n📝 المحتوى:\n${r.content || '-'}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  }
};

// =====================================================
// MAIN RENDER
// =====================================================
async function render() {
  Auth.load();
  const app = document.getElementById('app');
  const whatsappBtn = document.getElementById('whatsappBtn');
  sbConnected = isOnline && sb !== null;
  
  if (!Auth.user) {
    app.innerHTML = Views.login();
    whatsappBtn.classList.add('hidden');
    setTimeout(() => {
      const btn = document.getElementById('lgBtn');
      if (btn) { btn.onclick = handleLogin; document.getElementById('lgPass').addEventListener('keypress', e => { if (e.key === 'Enter') handleLogin(); }); }
    }, 0);
  } else {
    whatsappBtn.classList.remove('hidden');
    const u = Auth.user;
    if (u.role === 'central_oversight' && Router.page === 'dashboard') Router.page = 'oversightDashboard';
    
    if (sbConnected) {
      try {
        let filters = {};
        if (u.role === 'sector_admin' && u.sector_id) filters.sector_id = u.sector_id;
        appData.correspondence = await DB.getAll(filters);
        if (u.role === 'super_admin' || u.role === 'general_admin') {
          appData.complaints = await DB.getComplaints({});
        } else if (u.role === 'central_oversight' && u.sector_id) {
          appData.complaints = await DB.getComplaints({ sector_id: u.sector_id });
        } else if (u.role === 'sector_admin' && u.sector_id) {
          appData.complaints = await DB.getComplaints({ sector_id: u.sector_id });
        } else {
          appData.complaints = [];
        }
      } catch (e) {
        console.error("فشل جلب البيانات", e);
        appData = { correspondence: U.load('db_correspondence_cache', []), complaints: U.load('db_complaints_cache', []), _allFollowUps: [] };
      }
    } else {
      appData.correspondence = U.load('db_correspondence_cache', U.load('db_correspondence', []));
      appData.complaints = U.load('db_complaints_cache', U.load('db_complaints', []));
    }
    
    const views = {
      dashboard: () => Views.dashboard(appData.correspondence),
      sector: () => Views.sector(appData.correspondence),
      general: () => Views.general(appData.correspondence),
      archive: () => Views.archive(appData.correspondence),
      followups: () => Views.followups(appData.correspondence),
      create: () => Views.create(),
      view: () => Views.view(),
      complaints: () => Views.complaints(),
      oversightDashboard: () => Views.oversightDashboard(),
      oversightComplaints: () => Views.oversightComplaints(),
      createComplaint: () => Views.createComplaint(),
      viewComplaint: () => Views.viewComplaint(),
    };
    
    const viewFn = views[Router.page] || (u.role === 'central_oversight' ? views.oversightDashboard : views.dashboard);
    const html = await viewFn();
    app.innerHTML = html;
    bindEvents();
    updateSyncButton();
  }
}

function bindEvents() {
  if (Router.page === 'create') {
    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const sector = document.getElementById('fSec').value;
        const subject = document.getElementById('fSub').value.trim();
        const content = document.getElementById('fCon').value.trim();
        const sender = document.getElementById('fSen').value.trim();
        const priority = document.getElementById('fPri').value;
        const fileInput = document.getElementById('fFiles');
        const files = fileInput?.files ? Array.from(fileInput.files) : [];
        if (!subject || !content) { U.toast('الرجاء إدخال الموضوع والمحتوى', 'warning'); return; }
        saveBtn.disabled = true; saveBtn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
        try {
          const result = await DB.create({ sector_id: sector, subject, content, sender_name: sender, priority }, files);
          if (Array.isArray(result)) U.toast(`✅ تم تعميم المراسلة على ${result.length} قواطع`, 'success');
          else U.toast('✅ تم حفظ المراسلة', 'success');
          Router.go('dashboard');
        } catch (e) { U.toast(e.message || 'حدث خطأ', 'error'); saveBtn.disabled = false; saveBtn.innerHTML = '💾 حفظ المراسلة'; }
      };
    }
  }
  if (Router.page === 'createComplaint') { const btn = document.getElementById('submitComplaintBtn'); if (btn) btn.onclick = () => UI.submitComplaint(); }
  if (Router.page === 'complaints') {
    const filter = () => {
      const search = document.getElementById('cSearch')?.value.toLowerCase() || '';
      const status = document.getElementById('cStatus')?.value || '';
      const priority = document.getElementById('cPriority')?.value || '';
      const sector = document.getElementById('cSector')?.value || '';
      let filtered = [...appData.complaints];
      if (search) filtered = filtered.filter(c => (c.title + ' ' + c.description).toLowerCase().includes(search));
      if (status) filtered = filtered.filter(c => c.status === status);
      if (priority) filtered = filtered.filter(c => c.priority === priority);
      if (sector) filtered = filtered.filter(c => c.sector_id === sector);
      const el = document.getElementById('complaintsList');
      if (el) {
        if (filtered.length === 0) { el.innerHTML = '<div class="glass rounded-2xl p-12 text-center text-gray-500">📭 لا توجد نتائج</div>'; }
        else {
          const statusColors = { pending: 'bg-yellow-100 text-yellow-800', in_progress: 'bg-blue-100 text-blue-800', resolved: 'bg-green-100 text-green-800', rejected: 'bg-red-100 text-red-800' };
          const statusLabels = { pending: 'قيد الانتظار', in_progress: 'قيد المعالجة', resolved: 'تم الحل', rejected: 'مرفوضة' };
          const priorityColors = { low: 'bg-gray-100 text-gray-700', medium: 'bg-blue-100 text-blue-700', high: 'bg-orange-100 text-orange-700', urgent: 'bg-red-100 text-red-700' };
          const priorityLabels = { low: 'منخفضة', medium: 'متوسطة', high: 'عالية', urgent: 'عاجلة' };
          el.innerHTML = filtered.map(c => {
            const sec = SECTORS.find(s => s.id === c.sector_id);
            return `<div class="glass rounded-2xl shadow-lg p-5 card-hover cursor-pointer ${c.priority === 'urgent' ? 'border-2 border-red-300' : ''}" onclick="Router.go('viewComplaint', {id:'${c.id}'})">
              <div class="flex justify-between items-start mb-3 flex-wrap gap-2">
                <div class="flex-1">
                  <div class="flex items-center gap-2 text-xs text-gray-500 mb-1"><span>#${c.id.substring(0, 8)}</span><span>•</span><span>${U.fmtDate(c.created_at)}</span>${sec ? `<span>•</span><span>${sec.name}</span>` : ''}</div>
                  <h3 class="font-bold text-lg text-gray-800">${U.esc(c.title)}</h3>
                  <p class="text-sm text-gray-600 mt-1">${U.esc((c.description || '').substring(0, 150))}...</p>
                </div>
                <div class="flex flex-col gap-2">
                  <span class="px-3 py-1 rounded-full text-xs font-bold ${statusColors[c.status]}">${statusLabels[c.status]}</span>
                  <span class="px-3 py-1 rounded-full text-xs font-bold ${priorityColors[c.priority]}">${priorityLabels[c.priority]}</span>
                </div>
              </div>
              <div class="flex gap-4 text-xs text-gray-500 flex-wrap">
                ${c.complainant_phone ? `<span>📞 ${U.esc(c.complainant_phone)}</span>` : ''}
                <span>📤 ${U.esc(c.submitted_by_name || 'مستخدم')}</span>
                ${c.admin_response ? '<span class="text-green-600 font-semibold">✓ تم الرد</span>' : '<span class="text-orange-600">⏳ بانتظار الرد</span>'}
              </div>
            </div>`;
          }).join('');
        }
      }
    };
    const s = document.getElementById('cSearch'), st = document.getElementById('cStatus'), p = document.getElementById('cPriority'), sc = document.getElementById('cSector');
    if (s) s.oninput = filter; if (st) st.onchange = filter; if (p) p.onchange = filter; if (sc) sc.onchange = filter;
  }
}

async function handleLogin() {
  const email = document.getElementById('lgEmail').value.trim();
  const password = document.getElementById('lgPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('lgBtn');
  if (!email || !password) { errEl.textContent = 'الرجاء إدخال البريد وكلمة المرور'; errEl.classList.remove('hidden'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> جاري الدخول...'; errEl.classList.add('hidden');
  try { await Auth.login(email, password); U.toast(`مرحباً ${Auth.user.full_name}`, 'success'); render(); } catch (e) { errEl.textContent = e.message; errEl.classList.remove('hidden'); btn.disabled = false; btn.innerHTML = '🔐 تسجيل الدخول'; }
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault(); deferredPrompt = e;
  const app = document.getElementById('app');
  if (app && !Auth.user) {
    const installBtn = document.createElement('button');
    installBtn.className = 'install-pwa-btn';
    installBtn.innerHTML = '📱 تثبيت التطبيق على الهاتف';
    installBtn.onclick = async () => { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') U.toast('✅ تم تثبيت التطبيق!', 'success'); installBtn.remove(); deferredPrompt = null; };
    app.appendChild(installBtn);
  }
});

render();
updateSyncButton();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded (PWA + FollowUp Fixed + Reports)`);
</script>
</body>
