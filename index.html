<script>
// ============================================================
// CONFIGURATION - إعدادات التطبيق
// ============================================================
const CONFIG = {

  DEV: 'WTDOsama – وتد لبرمجة مواقع الويب',

  USER_KEY: 'deir_albalah_user',
  USERS_KEY: 'deir_albalah_users',
  OUTBOX_KEY: 'deir_albalah_outbox',
  SETTINGS_KEY: 'deir_albalah_settings',

const SECTORS = [
  { id: 'east', name: 'القاطع الشرقي', code: 'EAST', class: 'sector-east', icon: '🌅' },
  { id: 'west', name: 'القاطع الغربي', code: 'WEST', class: 'sector-west', icon: '🌊' },
  { id: 'north', name: 'القاطع الشمالي', code: 'NORTH', class: 'sector-north', icon: '🏔️' },

];

const ROLES = {
  super_admin: 'مدير عام للنظام',
  general_admin: 'مدير عام',
  sector_admin: 'مدير قاطع',
  sector_staff: 'موظف قاطع',
};

const DEFAULT_USERS = [
  { id: '1', username: 'admin', password: 'admin123', fullName: 'المدير العام', role: 'super_admin', sectorId: null },
  { id: '2', username: 'east', password: 'east123', fullName: 'مدير القاطع الشرقي', role: 'sector_admin', sectorId: 'east' },
  { id: '3', username: 'west', password: 'west123', fullName: 'مدير القاطع الغربي', role: 'sector_admin', sectorId: 'west' },
  { id: '4', username: 'north', password: 'north123', fullName: 'مدير القاطع الشمالي', role: 'sector_admin', sectorId: 'north' },
  { id: '5', username: 'south', password: 'south123', fullName: 'مدير القاطع الجنوبي', role: 'sector_admin', sectorId: 'south' },
];

// ============================================================
// UTILITIES - أدوات مساعدة
// ============================================================
const Utils = {
  uuid: () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  }),
  
  now: () => new Date().toISOString(),
  
  formatDate: (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  },
  
  formatShortDate: (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
  },
  
  generateRef: (sectorCode) => {
    const year = new Date().getFullYear();
    const rand = Math.floor(Math.random() * 9000) + 1000;
    return `DB-${sectorCode}-${year}-${rand}`;
  },
  
  escapeHtml: (str) => {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  },
  
  saveLocal: (key, data) => {
    try {
      localStorage.setItem(key, JSON.stringify(data));
      console.log(`✓ Saved to ${key}`);
      return true;
    } catch (e) {
      console.error(`✗ Failed to save ${key}:`, e);
      return false;
    }
  },
  
  loadLocal: (key, def = null) => {
    try { 
      const d = localStorage.getItem(key); 
      if (d) {
        const parsed = JSON.parse(d);
        console.log(`✓ Loaded ${key}:`, Array.isArray(parsed) ? `${parsed.length} items` : parsed);
        return parsed;
      }
      console.log(`⚠ ${key} not found, using default`);
      return def; 
    } catch (e) { 
      console.error(`✗ Failed to load ${key}:`, e);
      return def; 
    }
  },
  
  toast: (msg, type = 'info') => {
    const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-600' };
    const el = document.createElement('div');
    el.className = `fixed top-4 left-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-2xl z-[200] fade-in`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3500);
  },
};

// Initialize default users on first load
console.log('🚀 Initializing application...');
const existingUsers = Utils.loadLocal(CONFIG.USERS_KEY, null);
if (!existingUsers || existingUsers.length === 0) {
  console.log('📝 No users found, creating default users...');
  Utils.saveLocal(CONFIG.USERS_KEY, DEFAULT_USERS);
  console.log('✓ Default users created');
} else {
  console.log(`✓ Found ${existingUsers.length} existing users`);
}

// ============================================================
// API CLIENT - عميل API
// ============================================================
const ApiClient = {
  async request(method, path, data = null, options = {}) {
    const token = localStorage.getItem('auth_token');
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = `Bearer ${token}`;
    
    try {
      const res = await fetch(`${CONFIG.API_URL}${path}`, {
        method,
        headers,
        body: data ? JSON.stringify(data) : null,
        ...options,
      });
      
      if (res.status === 401) {
        Auth.logout();
        throw new Error('انتهت الجلسة، يرجى تسجيل الدخول');
      }
      
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.message || 'خطأ في الاتصال');
      return json;
    } catch (err) {
      if (err.message.includes('Failed to fetch')) {
        throw new Error('لا يوجد اتصال بالخادم');
      }
      throw err;
    }
  },
  
  get: (p) => this.request('GET', p),
  post: (p, d) => this.request('POST', p, d),
  put: (p, d) => this.request('PUT', p, d),
  delete: (p) => this.request('DELETE', p),
};

// ============================================================
// SERVICE ABSTRACTION - طبقة التجريد
// ============================================================
class LocalCorrespondenceService {
  getAll(filters = {}) {
    let data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    if (filters.sectorId) data = data.filter(d => d.sectorId === filters.sectorId);
    if (filters.search) {
      const s = filters.search.toLowerCase();
      data = data.filter(d => 
        (d.subject || '').toLowerCase().includes(s) ||
        (d.content || '').toLowerCase().includes(s) ||
        (d.referenceNumber || '').toLowerCase().includes(s) ||
        (d.sender || '').toLowerCase().includes(s)
      );
    }
    if (filters.priority) data = data.filter(d => d.priority === filters.priority);
    if (filters.archived !== undefined) data = data.filter(d => !!d.isArchived === filters.archived);
    return Promise.resolve(data.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)));
  }
  
  getById(id) {
    const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    return Promise.resolve(data.find(d => d.id === id));
  }
  
  async create(record) {
    const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    const newRec = {
      ...record,
      id: Utils.uuid(),
      referenceNumber: record.referenceNumber || Utils.generateRef(SECTORS.find(s => s.id === record.sectorId)?.code || 'XX'),
      createdAt: Utils.now(),
      updatedAt: Utils.now(),
      isArchived: false,
      replies: [],
      attachments: [],
      followUps: [],
      notes: [],
    };
    data.push(newRec);
    Utils.saveLocal(CONFIG.STORAGE_KEY, data);
    return newRec;
  }
  
  async update(id, updates) {
    const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    const idx = data.findIndex(d => d.id === id);
    if (idx === -1) throw new Error('السجل غير موجود');
    data[idx] = { ...data[idx], ...updates, updatedAt: Utils.now() };
    Utils.saveLocal(CONFIG.STORAGE_KEY, data);
    return data[idx];
  }
  
  async archive(id) { return this.update(id, { isArchived: true }); }
  async restore(id) { return this.update(id, { isArchived: false }); }
  
  async delete(id) {
    const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []).filter(d => d.id !== id);
    Utils.saveLocal(CONFIG.STORAGE_KEY, data);
  }
  
  async addReply(id, reply) {
    const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    const rec = data.find(d => d.id === id);
    if (!rec) throw new Error('السجل غير موجود');
    rec.replies = rec.replies || [];
    rec.replies.push({ id: Utils.uuid(), ...reply, createdAt: Utils.now() });
    rec.updatedAt = Utils.now();
    Utils.saveLocal(CONFIG.STORAGE_KEY, data);
    return rec;
  }
  
  async addFollowUp(id, followUp) {
    const data = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    const rec = data.find(d => d.id === id);
    if (!rec) throw new Error('السجل غير موجود');
    rec.followUps = rec.followUps || [];
    rec.followUps.push({ id: Utils.uuid(), ...followUp, createdAt: Utils.now() });
    rec.updatedAt = Utils.now();
    Utils.saveLocal(CONFIG.STORAGE_KEY, data);
    return rec;
  }
}

class ApiCorrespondenceService {
  constructor() { this.local = new LocalCorrespondenceService(); }
  
  async getAll(filters = {}) {
    try {
      const params = new URLSearchParams();
      Object.entries(filters).forEach(([k,v]) => v !== undefined && params.append(k, v));
      return await ApiClient.get(`/correspondence?${params}`);
    } catch (e) {
      Utils.toast('تعذر الاتصال بالخادم - عرض البيانات المحلية', 'warning');
      return this.local.getAll(filters);
    }
  }
  
  async getById(id) {
    try { return await ApiClient.get(`/correspondence/${id}`); }
    catch { return this.local.getById(id); }
  }
  
  async create(record) {
    if (!navigator.onLine) {
      await this.queueForSync('create', record);
      return this.local.create(record);
    }
    try {
      const created = await ApiClient.post('/correspondence', record);
      await this.local.create(created);
      return created;
    } catch (e) {
      await this.queueForSync('create', record);
      return this.local.create(record);
    }
  }
  
  async update(id, updates) {
    try {
      const updated = await ApiClient.put(`/correspondence/${id}`, updates);
      await this.local.update(id, updated);
      return updated;
    } catch { return this.local.update(id, updates); }
  }
  
  async archive(id) {
    try { await ApiClient.post(`/correspondence/${id}/archive`); } catch {}
    return this.local.archive(id);
  }
  
  async restore(id) {
    try { await ApiClient.post(`/correspondence/${id}/restore`); } catch {}
    return this.local.restore(id);
  }
  
  async delete(id) {
    try { await ApiClient.delete(`/correspondence/${id}`); } catch {}
    return this.local.delete(id);
  }
  
  async addReply(id, reply) {
    try { await ApiClient.post(`/correspondence/${id}/replies`, reply); } catch {}
    return this.local.addReply(id, reply);
  }
  
  async addFollowUp(id, followUp) {
    try { await ApiClient.post(`/follow-ups`, { correspondenceId: id, ...followUp }); } catch {}
    return this.local.addFollowUp(id, followUp);
  }
  
  async queueForSync(action, data) {
    const outbox = Utils.loadLocal(CONFIG.OUTBOX_KEY, []);
    outbox.push({ id: Utils.uuid(), action, data, createdAt: Utils.now(), clientId: Utils.uuid() });
    Utils.saveLocal(CONFIG.OUTBOX_KEY, outbox);
  }
  
  async syncOutbox() {
    const outbox = Utils.loadLocal(CONFIG.OUTBOX_KEY, []);
    if (outbox.length === 0) return;
    Utils.toast(`مزامنة ${outbox.length} عنصر...`, 'info');
    const remaining = [];
    for (const item of outbox) {
      try {
        if (item.action === 'create') await ApiClient.post('/correspondence', item.data);
      } catch { remaining.push(item); }
    }
    Utils.saveLocal(CONFIG.OUTBOX_KEY, remaining);
    if (remaining.length === 0) Utils.toast('تمت المزامنة بنجاح', 'success');
  }
}

const correspondenceService = CONFIG.USE_BACKEND ? new ApiCorrespondenceService() : new LocalCorrespondenceService();

// ============================================================
// AUTHENTICATION - نظام المصادقة
// ============================================================
const Auth = {
  getCurrentUser() {
    return Utils.loadLocal(CONFIG.USER_KEY, null);
  },
  
  login(username, password) {
    console.log('🔐 Login attempt:', { username, password });
    const users = Utils.loadLocal(CONFIG.USERS_KEY, DEFAULT_USERS);
    console.log('📋 Available users:', users.map(u => u.username));
    
    const user = users.find(u => u.username === username && u.password === password);
    
    if (!user) {
      console.error('✗ Login failed: Invalid credentials');
      throw new Error('بيانات الدخول غير صحيحة');
    }
    
    console.log('✓ Login successful:', user.fullName);
    const session = { ...user, loginAt: Utils.now() };
    delete session.password;
    Utils.saveLocal(CONFIG.USER_KEY, session);
    return session;
  },
  
  logout() {
    localStorage.removeItem(CONFIG.USER_KEY);
    localStorage.removeItem('auth_token');
    Router.navigate('login');
  },
  
  hasPermission(permission) {
    const user = this.getCurrentUser();
    if (!user) return false;
    const perms = {
      super_admin: ['all'],
      general_admin: ['all_sectors', 'manage_users', 'view_reports'],
      sector_admin: ['manage_sector', 'view_sector', 'manage_staff'],
      sector_staff: ['view_sector', 'create_correspondence'],
    };
    const userPerms = perms[user.role] || [];
    return userPerms.includes('all') || userPerms.includes(permission);
  },
};

// ============================================================
// EXPORT - التصدير
// ============================================================
const Exporter = {
  async toPDF(record) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    
    doc.setFont('helvetica');
    doc.setFontSize(16);
    doc.text(CONFIG.ORG, 105, 20, { align: 'center' });
    doc.setFontSize(12);
    doc.text(`Reference: ${record.referenceNumber}`, 105, 30, { align: 'center' });
    doc.text(`Date: ${Utils.formatShortDate(record.createdAt)}`, 105, 38, { align: 'center' });
    
    doc.setFontSize(14);
    doc.text(`Subject: ${record.subject}`, 20, 55);
    
    doc.setFontSize(11);
    const lines = doc.splitTextToSize(record.content || '', 170);
    doc.text(lines, 20, 70);
    
    doc.setFontSize(9);
    doc.text(`Generated: ${new Date().toLocaleString('en-GB')}`, 20, 280);
    doc.text(CONFIG.ORG, 105, 285, { align: 'center' });
    
    doc.save(`${record.referenceNumber}.pdf`);
  },
  
  toTXT(record) {
    const text = `${CONFIG.ORG}
================================
رقم المرجع: ${record.referenceNumber}
التاريخ: ${Utils.formatDate(record.createdAt)}
القطاع: ${SECTORS.find(s => s.id === record.sectorId)?.name || ''}
الأولوية: ${record.priority}
المرسل: ${record.sender || '-'}
================================
الموضوع: ${record.subject}

${record.content}

================================
${record.replies?.map(r => `\n--- رد (${Utils.formatDate(r.createdAt)}) ---\n${r.content}`).join('\n') || ''}
================================
© 2026 ${CONFIG.ORG}`;
    
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${record.referenceNumber}.txt`; a.click();
    URL.revokeObjectURL(url);
  },
  
  toExcel(records) {
    const data = records.map(r => ({
      'الرقم المرجعي': r.referenceNumber,
      'التاريخ': Utils.formatShortDate(r.createdAt),
      'القطاع': SECTORS.find(s => s.id === r.sectorId)?.name || '',
      'الموضوع': r.subject,
      'المحتوى': r.content,
      'الأولوية': r.priority,
      'المرسل': r.sender || '',
      'الحالة': r.isArchived ? 'مؤرشف' : 'نشط',
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'المراسلات');
    XLSX.writeFile(wb, `correspondence_${Date.now()}.xlsx`);
  },
  
  async toQR(record) {
    const data = JSON.stringify({
      ref: record.referenceNumber,
      subject: record.subject,
      date: record.createdAt,
      sector: record.sectorId,
      org: CONFIG.ORG,
    });
    const canvas = document.createElement('canvas');
    await QRCode.toCanvas(canvas, data, { width: 300, margin: 2 });
    const url = canvas.toDataURL();
    const a = document.createElement('a');
    a.href = url; a.download = `qr_${record.referenceNumber}.png`; a.click();
  },
  
  shareWhatsApp(record) {
    const text = `*${CONFIG.ORG}*\n\n📌 المرجع: ${record.referenceNumber}\n📅 التاريخ: ${Utils.formatShortDate(record.createdAt)}\n📝 الموضوع: ${record.subject}\n\n${record.content?.substring(0, 200)}...`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  },
};

// ROUTER - نظام التوجيه
// ============================================================
const Router = {
  current: 'login',
  params: {},
  
  navigate(route, params = {}) {
    this.current = route;
    this.params = params;
    window.location.hash = route + (params.id ? `/${params.id}` : '');
    App.render();
  },
  
  init() {
    window.addEventListener('hashchange', () => {
      const hash = window.location.hash.slice(1) || 'login';
      const [route, id] = hash.split('/');
      this.current = route;
      this.params = id ? { id } : {};
      App.render();
    });
    
    const hash = window.location.hash.slice(1);
    if (hash) {
      const [route, id] = hash.split('/');
      this.current = route;
      this.params = id ? { id } : {};
    }
  }
};

const App = {
  render() {
    const app = document.getElementById('app');
    const user = Auth.getCurrentUser();
    
    if (!user && Router.current !== 'login' && Router.current !== 'settings') {
      Router.navigate('login');
      return;
    }
    
    const routes = {
      login: Views.login,
      dashboard: Views.dashboard,
      sector: Views.sector,
      general: Views.general,
      archive: Views.archive,
      followups: Views.followups,
      view: Views.viewCorrespondence,
      settings: Views.settings,
      migration: Views.migration,
      users: Views.users,
    };
    
    const view = routes[Router.current] || Views.dashboard;
    app.innerHTML = view();
    app.classList.add('fade-in');
    
    if (typeof view.afterRender === 'function') view.afterRender();
  }
};

// ============================================================
// UI INTERACTIONS - تفاعلات الواجهة
// ============================================================
const UI = {
  openCreateModal(sectorId) {
    document.getElementById('createModal').classList.remove('hidden');
    document.getElementById('createForm').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await correspondenceService.create({
          sectorId: document.getElementById('formSector').value,
          subject: document.getElementById('formSubject').value,
          content: document.getElementById('formContent').value,
          sender: document.getElementById('formSender').value,
          priority: document.getElementById('formPriority').value,
        });
        Utils.toast('تم حفظ المراسلة', 'success');
        document.getElementById('createModal').classList.add('hidden');
        App.render();
      } catch (err) {
        Utils.toast(err.message, 'error');
      }
    };
  },
  
  openReplyModal(id) {
    const content = prompt('نص الرد:');
    if (!content) return;
    const author = prompt('اسم المرسل (اختياري):') || Auth.getCurrentUser().fullName;
    correspondenceService.addReply(id, { content, author }).then(() => {
      Utils.toast('تم إضافة الرد', 'success');
      App.render();
    });
  },
  
  openFollowUpModal(id) {
    const title = prompt('عنوان المهمة:');
    if (!title) return;
    const dueDate = prompt('تاريخ الاستحقاق (YYYY-MM-DD):') || null;
    const notes = prompt('ملاحظات:') || '';
    correspondenceService.addFollowUp(id, { title, dueDate, notes, status: 'pending' }).then(() => {
      Utils.toast('تمت إضافة المتابعة', 'success');
      App.render();
    });
  },
  
  async archiveRecord(id) {
    if (!confirm('تأكيد الأرشفة؟')) return;
    await correspondenceService.archive(id);
    Utils.toast('تمت الأرشفة', 'success');
    App.render();
  },
  
  async restoreRecord(id) {
    await correspondenceService.restore(id);
    Utils.toast('تمت الاستعادة', 'success');
    App.render();
  },
  
  async deleteRecord(id) {
    if (!confirm('⚠️ حذف نهائي؟ لا يمكن التراجع.')) return;
    await correspondenceService.delete(id);
    Utils.toast('تم الحذف', 'success');
    history.back();
  },
  
  saveSettings() {
    const useBackend = document.getElementById('useBackend').checked;
    const apiUrl = document.getElementById('apiUrl').value.trim();
    localStorage.setItem('USE_BACKEND', useBackend);
    localStorage.setItem('API_URL', apiUrl);
    CONFIG.USE_BACKEND = useBackend;
    CONFIG.API_URL = apiUrl;
    Utils.toast('تم حفظ الإعدادات - سيتم إعادة التحميل', 'success');
    setTimeout(() => location.reload(), 1000);
  },
  
  exportBackup() {
    const data = {
      version: CONFIG.VERSION,
      exportedAt: Utils.now(),
      correspondence: Utils.loadLocal(CONFIG.STORAGE_KEY, []),
      users: Utils.loadLocal(CONFIG.USERS_KEY, DEFAULT_USERS),
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `backup_${Date.now()}.json`; a.click();
    URL.revokeObjectURL(url);
    Utils.toast('تم تصدير النسخة الاحتياطية', 'success');
  },
  
  importBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.correspondence) Utils.saveLocal(CONFIG.STORAGE_KEY, data.correspondence);
        if (data.users) Utils.saveLocal(CONFIG.USERS_KEY, data.users);
        Utils.toast('تم الاستيراد بنجاح', 'success');
        App.render();
      } catch (err) {
        Utils.toast('ملف غير صالح', 'error');
      }
    };
    reader.readAsText(file);
  },
  
  async runMigration() {
    const status = document.getElementById('migrationStatus');
    const localData = Utils.loadLocal(CONFIG.STORAGE_KEY, []);
    
    if (!CONFIG.USE_BACKEND) {
      status.innerHTML = '<p class="text-red-600">⚠️ يجب تفعيل الاتصال بالخادم أولاً من الإعدادات</p>';
      return;
    }
    
    status.innerHTML = `<p>📤 جاري نقل ${localData.length} مراسلة...</p>`;
    let success = 0, failed = 0;
    
    for (const record of localData) {
      try {
        await ApiClient.post('/correspondence', record);
        success++;
        status.innerHTML = `<p class="text-green-600">✓ ${success} تم نقلها | ${failed} فشلت</p>`;
      } catch (e) {
        failed++;
        status.innerHTML = `<p class="text-orange-600">✓ ${success} تم نقلها | ${failed} فشلت (${e.message})</p>`;
      }
    }
    
    status.innerHTML = `<p class="text-teal-700 font-bold">✅ اكتمل النقل: ${success} نجحت، ${failed} فشلت</p>`;
  },
  
  openUserModal() {
    document.getElementById('userModal').classList.remove('hidden');
    document.getElementById('userForm').onsubmit = (e) => {
      e.preventDefault();
      const users = Utils.loadLocal(CONFIG.USERS_KEY, DEFAULT_USERS);
      users.push({
        id: Utils.uuid(),
        fullName: document.getElementById('uFullName').value,
        username: document.getElementById('uUsername').value,
        password: document.getElementById('uPassword').value,
        role: document.getElementById('uRole').value,
        sectorId: document.getElementById('uSector').value || null,
      });
      Utils.saveLocal(CONFIG.USERS_KEY, users);
      Utils.toast('تمت الإضافة', 'success');
      App.render();
    };
  },
  
  deleteUser(id) {
    if (!confirm('حذف المستخدم؟')) return;
    const users = Utils.loadLocal(CONFIG.USERS_KEY, DEFAULT_USERS).filter(u => u.id !== id);
    Utils.saveLocal(CONFIG.USERS_KEY, users);
    Utils.toast('تم الحذف', 'success');
    App.render();
  },
};

  Utils.toast('✅ عاد الاتصال', 'success');
  if (CONFIG.USE_BACKEND && correspondenceService.syncOutbox) {

});

window.addEventListener('offline', () => {
  Utils.toast('⚠️ انقطع الاتصال - الوضع المحلي', 'warning');
  App.render();
});

console.log(`%c© 2026 ${CONFIG.ORG}`, 'color:#666');
console.log(`%cDeveloper: ${CONFIG.DEV}`, 'color:#666');
