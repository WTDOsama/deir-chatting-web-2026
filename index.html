if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE_NAME = 'deir-iyawaat-v12.9.5';
    const ASSETS = ['/'];
    self.addEventListener('install', (e) => { e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(ASSETS).catch(err => console.log('Cache add failed:', err))).then(() => self.skipWaiting())); });
    self.addEventListener('activate', (e) => { e.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter(k => k !== CACHE_NAME).map(k => caches.delete(k)))).then(() => self.clients.claim())); });
    self.addEventListener('fetch', (e) => {
      if (e.request.method !== 'GET') return;
      e.respondWith(caches.match(e.request).then((cached) => {
        const fetchPromise = fetch(e.request).then((response) => {
          if (response && response.status === 200) { const clone = response.clone(); caches.open(CACHE_NAME).then((cache) => cache.put(e.request, clone)); }
          return response;
        }).catch(() => cached);
        return cached || fetchPromise;
      }));
    });
  `;
  const swBlob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).then((reg) => console.log('✓ Service Worker registered')).catch((err) => console.log('⚠ SW failed:', err.message));
}

  }),
  now: () => new Date().toISOString(),
  fmtDate: (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '',
  fmtShort: (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '',
  genRef: (code) => `DB-${code}-${new Date().getFullYear()}-${Math.floor(Math.random()*9000)+1000}`,
  esc: (s) => s ? String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '',
  save: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  load: (k, d = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  toast: (msg, type = 'info') => {

  getFileIcon: (type) => {
    const icons = {
      image: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',

      pdf: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
      archive: '<svg class="icon-svg" viewBox="0 0 24 24"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
      other: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>'
    };
    return icons[type] || icons.other;
  },
  getFileType: (mime, name) => {
    mime = mime || ''; name = name || '';
    const lowerName = name.toLowerCase();
    if (mime.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(lowerName)) return 'image';
    if (mime.includes('excel') || mime.includes('spreadsheet') || /\.(xlsx|xls|csv)$/i.test(lowerName)) return 'excel';
    if (mime.includes('pdf') || lowerName.endsWith('.pdf')) return 'pdf';
    if (mime.includes('word') || mime.includes('document') || /\.(doc|docx)$/i.test(lowerName)) return 'document';
    if (mime.includes('zip') || mime.includes('compressed') || mime.includes('rar') || /\.(zip|rar|7z|tar|gz)$/i.test(lowerName)) return 'archive';
    return 'other';
  },
  formatFileSize: (bytes) => {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  },

function subscribeToNotifications() {
  if (!sbConnected || !Auth.user) return;
  realtimeSubs.forEach(s => s?.unsubscribe());
  realtimeSubs = [];
  const notifSub = sb.channel('notifications')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, (payload) => {
      U.toast(`${payload.new.title}: ${payload.new.message}`, 'info');
      refreshNotifications();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, () => { refreshNotifications(); })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, () => { refreshNotifications(); })
    .subscribe((status) => { console.log('🔔 Realtime subscription status:', status); });
  realtimeSubs.push(notifSub);
}

async function refreshNotifications() {
  if (!sbConnected || !Auth.user) return;
  try {
    const { count, error } = await sb.from('notifications')
      .select('*', { count: 'exact', head: true })
      .eq('user_id', Auth.user.id)
      .eq('is_read', false);
    if (error) { console.error('Error counting notifications:', error); return; }
    const badge = document.getElementById('notifBadge');
    if (badge) { badge.textContent = count || 0; badge.classList.toggle('hidden', !count); }
  } catch (e) { console.error('Error in refreshNotifications:', e); }
}

const DB = {
  async getAll(filters = {}) {
    if (sbConnected) {
      try {
        let q = sb.from('correspondence').select('*, attachments(*), replies(*)');
        if (filters.sector_id) q = q.eq('sector_id', filters.sector_id);
        if (filters.is_archived !== undefined) q = q.eq('is_archived', filters.is_archived);
        const { data, error } = await q.order('created_at', { ascending: false });
        if (error) throw error;
        if (data && data.length > 0) {
          const corrIds = data.map(r => r.id);
          try {
            const { data: fuData } = await sb.from('follow_ups').select('*').in('correspondence_id', corrIds);
            if (fuData) { data.forEach(r => { r.follow_ups = fuData.filter(fu => fu.correspondence_id === r.id); }); }
            else { data.forEach(r => { r.follow_ups = []; }); }
          } catch (e) { console.warn('⚠️ Failed to fetch follow_ups separately:', e.message); data.forEach(r => { r.follow_ups = []; }); }
        }
        U.save('db_correspondence_cache', data);
        return data;
      } catch (e) { console.error('Error in getAll:', e); return U.load('db_correspondence_cache', []); }
    }
    return U.load('db_correspondence_cache', U.load('db_correspondence', []));
  },
  async create(rec, files = []) {
    if (sbConnected) {
      let targetSectorId = rec.sector_id;
      if (Auth.user && Auth.user.role === 'center_manager') {
        targetSectorId = centerSession?.sectorId || Auth.user.sector_id;
        if (!targetSectorId) {
          throw new Error('القطاع غير محدد - الرجاء تسجيل الدخول بالرمز مرة أخرى');
        }
      }
      if (!targetSectorId || targetSectorId === 'undefined') {
        throw new Error('القطاع غير محدد');
      }
      if (targetSectorId === 'ALL') {
        const results = [];
        for (const sector of SECTORS) {
          const newId = U.uuid();
          const refNum = U.genRef(sector.code);
          try {
            const { data: inserted, error: insertError } = await sb.from('correspondence').insert([{
              id: newId, reference_number: refNum, subject: rec.subject, content: rec.content,
              sender_id: Auth.user?.id, sender_name: rec.sender_name || Auth.user?.full_name,
              sector_id: sector.id, priority: rec.priority || 'normal',
              is_archived: false, created_at: new Date().toISOString()
            }]).select().single();
            if (insertError) throw insertError;
            let atts = [];
            if (files.length > 0) {
              try {
                await this.uploadAttachments(newId, files);
                const { data: attData } = await sb.from('attachments').select('*').eq('correspondence_id', newId);
                atts = attData || [];
              } catch (e) { console.error('Failed to upload attachments:', e); }
            }
            results.push({ ...inserted, attachments: atts, replies: [], follow_ups: [] });
          } catch (e) { console.error(`Error creating correspondence for sector ${sector.name}:`, e); }
        }
        return results;
      } else {
        const recordId = U.uuid();
        const refNum = rec.reference_number || U.genRef(SECTORS.find(s => s.id === targetSectorId)?.code || 'XX');
        try {
          const { data: inserted, error: insertError } = await sb.from('correspondence').insert([{
            id: recordId, reference_number: refNum, subject: rec.subject, content: rec.content,
            sender_id: Auth.user?.id, sender_name: Auth.user?.full_name || 'مدير مركز',
            sector_id: targetSectorId,
            priority: rec.priority || 'normal',
            is_archived: false, created_at: new Date().toISOString()
          }]).select().single();
          if (insertError) throw insertError;
          let atts = [];
          if (files.length > 0) {
            try {
              await this.uploadAttachments(recordId, files);
              const { data: attData } = await sb.from('attachments').select('*').eq('correspondence_id', recordId);
              atts = attData || [];
            } catch (e) { console.error('Failed to upload attachments:', e); }
          }
          return { ...inserted, attachments: atts, replies: [], follow_ups: [] };
        } catch (e) { console.error('Error creating correspondence:', e); throw e; }
      }
    } else {
      const recordId = U.uuid();
      const refNum = rec.reference_number || U.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX');
      const record = { id: recordId, reference_number: refNum, subject: rec.subject, content: rec.content,
        sender_name: rec.sender_name || Auth.user?.full_name, sector_id: rec.sector_id, priority: rec.priority || 'normal',
        is_archived: false, replies: [], follow_ups: [], attachments: [], created_at: U.now(), _pending: true };
      const pending = U.load('db_pending_sync', []);
      pending.push({ type: 'correspondence', action: 'create', data: record, files: files.map(f => ({ name: f.name, type: f.type, size: f.size })) });
      U.save('db_pending_sync', pending);
      const localData = U.load('db_correspondence', []);
      localData.push(record);
      U.save('db_correspondence', localData);
      U.save('db_correspondence_cache', localData);
      U.toast('💾 تم الحفظ محلياً', 'info');
      updateSyncButton();
      return record;
    }
  },
  async uploadAttachments(correspondenceId, files) {
    if (!sbConnected) return;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = file.name.split('.').pop();
      const path = `${correspondenceId}/${U.uuid()}.${ext}`;
      const { error: uploadError } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type, upsert: false });
      if (uploadError) throw new Error(`فشل رفع الملف ${file.name}: ${uploadError.message}`);
      await sb.from('attachments').insert([{
        correspondence_id: correspondenceId, file_name: path, original_name: file.name,
        mime_type: file.type, size_bytes: file.size, file_type: U.getFileType(file.type, file.name),
        storage_path: path, uploaded_by: Auth.user?.id,
      }]);
    }
  },
  async update(id, updates) {
    if (sbConnected) {
      const { data, error } = await sb.from('correspondence').update(updates).eq('id', id).select().single();
      if (error) throw error; return data;
    }
    const data = U.load('db_correspondence', []);
    const idx = data.findIndex(d => d.id === id);
    if (idx === -1) throw new Error('غير موجود');
    data[idx] = { ...data[idx], ...updates, updated_at: U.now() };
    U.save('db_correspondence', data);
    return data[idx];
  },
  async archive(id) { return this.update(id, { is_archived: true }); },
  async restore(id) { return this.update(id, { is_archived: false }); },
  async remove(id) {
    if (sbConnected) {
      const { error } = await sb.from('correspondence').delete().eq('id', id);
      if (error) { console.error('Delete error:', error); throw new Error(error.message || 'فشل حذف المراسلة'); }
      const localData = U.load('db_correspondence', []);
      const filtered = localData.filter(d => d.id !== id);
      U.save('db_correspondence', filtered);
      U.save('db_correspondence_cache', filtered);
      return true;
    }
    const data = U.load('db_correspondence', []);
    const filtered = data.filter(d => d.id !== id);
    U.save('db_correspondence', filtered);
    U.save('db_correspondence_cache', filtered);
    return true;
  },
  async addReply(id, content) {
    if (sbConnected) {
      const { data, error } = await sb.from('replies').insert([{ correspondence_id: id, user_id: Auth.user?.id, author_name: Auth.user?.full_name, content }]).select().single();
      if (error) throw error; return data;
    }
    const data = U.load('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    rec.replies = rec.replies || [];
    rec.replies.push({ id: U.uuid(), content, author: Auth.user?.full_name, created_at: U.now() });
    U.save('db_correspondence', data);
    return rec;
  },
  async addFollowUp(id, fu) {
    if (sbConnected) {
      try {
        const { data, error } = await sb.from('follow_ups').insert([{
          correspondence_id: id, user_id: Auth.user?.id, title: fu.title,
          notes: fu.notes || '', due_date: fu.due_date || null, status: fu.status || 'pending'

        if (error) throw new Error(error.message || 'فشل حفظ المتابعة');
        U.toast('✅ تمت إضافة المتابعة', 'success');
        return data;
      } catch (e) { console.error('Error adding follow-up:', e); throw e; }
    } else {
      const data = U.load('db_correspondence', []);
      const rec = data.find(d => d.id === id);
      if (rec) {
        rec.follow_ups = rec.follow_ups || [];
        rec.follow_ups.push({ id: U.uuid(), title: fu.title, notes: fu.notes || '', due_date: fu.due_date || null, status: fu.status || 'pending', created_at: U.now() });
        U.save('db_correspondence', data);
        U.save('db_correspondence_cache', data);
        U.toast('💾 تمت إضافة المتابعة محلياً', 'info');

        const { data, error } = await sb.from('follow_ups').update({ ...updates, updated_at: new Date().toISOString() }).eq('id', fuId).select().single();
        if (error) throw error; return data;

  async getComplaints(filters = {}) {
    if (sbConnected) {
      try {
        let q = sb.from('complaints').select('*');
        if (filters.sector_id) q = q.eq('sector_id', filters.sector_id);
        if (filters.status) q = q.eq('status', filters.status);
        if (filters.priority) q = q.eq('priority', filters.priority);
        const { data, error } = await q.order('created_at', { ascending: false });
        if (error) throw error;
        U.save('db_complaints_cache', data || []);
        return data || [];
      } catch (e) { return U.load('db_complaints_cache', []); }
    }
    let data = U.load('db_complaints_cache', U.load('db_complaints', []));
    if (filters.sector_id) data = data.filter(c => c.sector_id === filters.sector_id);
    if (filters.status) data = data.filter(c => c.status === filters.status);
    if (filters.priority) data = data.filter(c => c.priority === filters.priority);
    return data;
  },
  async createComplaint(complaint) {
    const files = complaint.files || [];
    const complaintData = {
      sector_id: complaint.sector_id, title: complaint.title, description: complaint.description,
      complainant_name: complaint.complainant_name || '', complainant_phone: complaint.complainant_phone || '',
      complainant_type: complaint.complainant_type || 'مواطن', priority: complaint.priority || 'medium',
      source: complaint.source || 'internal', submitted_by: Auth.user?.id,
      submitted_by_name: Auth.user?.full_name, status: 'pending', admin_response: '',
      created_at: new Date().toISOString()
    };
    const record = { ...complaintData, id: U.uuid(), _pending: !sbConnected, attachments: [] };
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').insert([complaintData]).select().single();
      if (error) throw new Error(error.message || 'فشل إنشاء الشكوى');
      if (files.length > 0 && data.id) {
        try {
          for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const ext = file.name.split('.').pop();
            const path = `complaints/${data.id}/${U.uuid()}.${ext}`;
            const { error: uploadError } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type, upsert: false });
            if (uploadError) { console.error('Failed to upload file:', uploadError); continue; }
            await sb.from('attachments').insert([{
              correspondence_id: data.id, file_name: path, original_name: file.name,
              mime_type: file.type, size_bytes: file.size, file_type: U.getFileType(file.type, file.name),
              storage_path: path, uploaded_by: Auth.user?.id,
            }]);
          }
          const { data: attData } = await sb.from('attachments').select('*').eq('correspondence_id', data.id);
          return { ...data, attachments: attData || [] };
        } catch (e) { console.error('Error uploading attachments:', e); }
      }
      return { ...data, attachments: [] };
    } else {
      const pending = U.load('db_pending_sync', []);
      pending.push({ type: 'complaint', action: 'create', data: record, files: files.map(f => ({ name: f.name, type: f.type, size: f.size })) });
      U.save('db_pending_sync', pending);
      const complaints = U.load('db_complaints', []);
      complaints.push(record);
      U.save('db_complaints', complaints);
      U.save('db_complaints_cache', complaints);
      U.toast('💾 تم حفظ الشكوى محلياً', 'info');
      updateSyncButton();
      return record;
    }
  },
  async updateComplaint(id, updates) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').update({ ...updates, updated_at: new Date().toISOString() }).eq('id', id).select().single();
      if (error) throw error; return data;
    }
    const complaints = U.load('db_complaints', []);
    const idx = complaints.findIndex(c => c.id === id);
    if (idx === -1) throw new Error('غير موجود');
    complaints[idx] = { ...complaints[idx], ...updates, updated_at: U.now() };
    U.save('db_complaints', complaints);
    return complaints[idx];
  },
  async getComplaintById(id) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').select('*').eq('id', id).single();
      if (!error && data) return data;
    }
    return U.load('db_complaints', []).find(c => c.id === id);
  },
  async getComplaintStats(sector_id) {
    const all = await this.getComplaints(sector_id ? { sector_id } : {});
    return {
      total: all.length, pending: all.filter(c => c.status === 'pending').length,
      in_progress: all.filter(c => c.status === 'in_progress').length,
      resolved: all.filter(c => c.status === 'resolved').length,
      rejected: all.filter(c => c.status === 'rejected').length,
      urgent: all.filter(c => c.priority === 'urgent').length,
    };
  },
  async syncPending() {
    if (!sbConnected) { U.toast('⚠️ لا يوجد اتصال بالإنترنت', 'warning'); return; }
    const pending = U.load('db_pending_sync', []);
    if (pending.length === 0) { U.toast('✅ لا توجد بيانات للمزامنة', 'success'); return; }
    U.toast(`🔄 جاري مزامنة ${pending.length} عنصر...`, 'info');
    let success = 0, failed = 0;
    const remaining = [];
    for (const item of pending) {
      try {
        if (item.type === 'correspondence' && item.action === 'create') { await this.create(item.data, []); success++; }
        else if (item.type === 'complaint' && item.action === 'create') { await this.createComplaint(item.data); success++; }
      } catch (e) { console.error('Sync failed for item:', e); remaining.push(item); failed++; }
    }
    U.save('db_pending_sync', remaining);
    updateSyncButton();
    if (failed === 0) U.toast(`✅ تمت مزامنة ${success} عنصر بنجاح`, 'success');
    else U.toast(`⚠️ تمت مزامنة ${success} وفشل ${failed}`, 'warning');
  }
};

const Reports = {
  buildReportHTML(title, subtitle, headers, rows, stats = null) {
    let html = `<div style="padding: 30px; background: white; direction: rtl; font-family: 'Cairo', sans-serif;">

          <div style="font-size: 12px; color: #6b7280; margin-top: 5px;">${key}</div>
        </div>`;
      }
      html += `</div>`;
    }
    html += `<table class="report-table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
      <thead><tr>${headers.map(h => `<th style="background: #0f766e; color: white; padding: 12px; text-align: right; border: 1px solid #0d5f59; font-weight: 700;">${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((row, idx) => `<tr style="background: ${idx % 2 === 0 ? '#ffffff' : '#f9fafb'};">${row.map(cell => `<td style="padding: 10px 12px; border: 1px solid #e5e7eb; text-align: right;">${cell}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>
    <div style="margin-top: 30px; padding-top: 20px; border-top: 2px solid #e5e7eb; text-align: center; color: #9ca3af; font-size: 12px;">
      <p>© ${new Date().getFullYear()} ${CONFIG.ORG} - جميع الحقوق محفوظة</p>
      <p>تم إنشاء هذا التقرير بواسطة ${CONFIG.APP_NAME}</p>
    </div></div>`;
    return html;
  },
  async exportPDF(filename, title, subtitle, headers, rows, stats = null) {
    U.toast('🔄 جاري إنشاء ملف PDF...', 'info');
    const container = document.getElementById('reportContainer');
    container.innerHTML = this.buildReportHTML(title, subtitle, headers, rows, stats);
    container.style.display = 'block';
    try {
      const canvas = await html2canvas(container, { scale: 2, useCORS: true, logging: false, backgroundColor: '#ffffff' });
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('l', 'mm', 'a4');
      const imgData = canvas.toDataURL('image/png');
      const imgWidth = 297;
      const pageHeight = 210;
      const imgHeight = canvas.height * imgWidth / canvas.width;
      let heightLeft = imgHeight;
      let position = 0;
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
      while (heightLeft >= 0) { position = heightLeft - imgHeight; pdf.addPage(); pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight); heightLeft -= pageHeight; }
      pdf.save(filename);
      U.toast('✅ تم تصدير PDF بنجاح', 'success');
    } catch (e) { console.error('PDF export error:', e); U.toast('❌ فشل تصدير PDF', 'error'); }
    finally { container.style.display = 'none'; container.innerHTML = ''; }
  },
  exportExcel(filename, sheetName, headers, rows) {
    U.toast('🔄 جاري إنشاء ملف Excel...', 'info');
    try {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
      ws['!cols'] = headers.map(h => ({ wch: Math.max(h.length * 2, 15) }));
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      XLSX.writeFile(wb, filename);
      U.toast('✅ تم تصدير Excel بنجاح', 'success');
    } catch (e) { console.error('Excel export error:', e); U.toast('❌ فشل تصدير Excel', 'error'); }
  },

          <div><label class="block text-sm font-semibold mb-2 text-gray-700">كلمة المرور</label><input type="password" id="lgPass" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="••••••••"></div>
          <button type="button" id="lgBtn" class="btn-primary w-full py-3 rounded-xl font-bold text-lg">تسجيل الدخول</button>
        </form>
        <div class="mt-6 pt-6 border-t border-gray-200">
          <p class="text-center text-gray-600 text-sm mb-3">دخول مديري المراكز بالرمز</p>
          <div id="codeInputSection">
            <label class="block text-sm font-semibold mb-2 text-gray-700">رمز الدخول</label>
            <input type="text" id="centerCodeInput" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none text-center text-2xl tracking-widest font-mono" placeholder="XXXX-XXXX" style="text-transform: uppercase;">
            <button type="button" onclick="UI.loginWithCode()" class="btn-primary w-full py-3 rounded-xl font-bold mt-2">دخول بالرمز</button>
          </div>
        </div>
        <div class="mt-4 text-xs text-gray-500 text-center">
          <p>الإصدار ${CONFIG.VERSION}</p>
          <p class="mt-1">© 2026 ${CONFIG.ORG}</p>
        </div>
      </div>
    </div>`;
  },
  
  centerCodeLogin() {
    return `<div class="min-h-screen flex items-center justify-center p-4">
      <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md fade-in text-center">
        <div class="text-6xl mb-3">${ICONS.key}</div>
        <h1 class="text-2xl font-bold text-teal-800 mb-2">دخول مدير مركز إيواء</h1>
        <p class="text-gray-600 text-sm mb-6">الرجاء إدخال رمز الدخول الخاص بمركزك</p>
        <div id="codeErr" class="hidden bg-red-100 border-r-4 border-red-500 text-red-700 p-3 rounded mb-4 text-sm"></div>
        <div id="codeSuccess" class="hidden bg-green-100 border-r-4 border-green-500 text-green-700 p-3 rounded mb-4 text-sm"></div>
        <form class="space-y-4" onsubmit="return false;">
          <div>
            <input type="text" id="centerCodeInput" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none text-center text-2xl tracking-widest font-mono" placeholder="XXXX-XXXX" maxlength="9" style="text-transform: uppercase;">
          </div>
          <button type="button" id="validateCodeBtn" class="btn-primary w-full py-3 rounded-xl font-bold text-lg">تحقق ودخول</button>
          <button type="button" onclick="Auth.logout()" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 py-3 rounded-xl font-bold cursor-pointer transition">تسجيل خروج</button>
        </form>
        <div class="mt-4 text-xs text-gray-500">
          <p>💡 الرمز مكون من 8 أحرف (مثل: EAST-0001)</p>
          <p class="mt-1">🔒 اتصال آمن ومشفر</p>
        </div>
      </div>
    </div>`;
  },

  dashboard(data) {
    data = data || appData.correspondence || [];
    const u = Auth.user || {};
    const active = data.filter(r => !r.is_archived);
    const archived = data.filter(r => r.is_archived);
    const withFu = data.filter(r => r.follow_ups && r.follow_ups.length > 0);
    return `<div class="min-h-screen">${this.navbar()}
      <div class="max-w-7xl mx-auto p-4 md:p-6 fade-in">
        <div class="glass rounded-2xl shadow-xl p-6 mb-6">
          <h1 class="text-3xl font-bold text-teal-800 mb-2">أهلاً ${U.esc(u.full_name)}</h1>
          <p class="text-gray-600">${ROLES[u.role] || 'مستخدم'} ${sbConnected ? '🔗 متصل' : '📡 أوفلاين'}</p>
          <div class="mt-3 grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
            <div class="bg-teal-50 p-3 rounded-xl"><div class="text-2xl font-bold text-teal-700">${active.length}</div><div class="text-xs text-gray-600">مراسلة نشطة</div></div>
            <div class="bg-gray-50 p-3 rounded-xl"><div class="text-2xl font-bold text-gray-700">${archived.length}</div><div class="text-xs text-gray-600">مؤرشفة</div></div>
            <div class="bg-purple-50 p-3 rounded-xl"><div class="text-2xl font-bold text-purple-700">${withFu.length}</div><div class="text-xs text-gray-600">بها متابعة</div></div>
            <div class="bg-blue-50 p-3 rounded-xl"><div class="text-2xl font-bold text-blue-700">${data.length}</div><div class="text-xs text-gray-600">الإجمالي</div></div>
          </div>
        </div>
        <h2 class="text-xl font-bold text-white mb-3">القواطع</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          ${SECTORS.map(s => {
            const count = active.filter(r => r.sector_id === s.id).length;
            return `<button onclick="Router.go('sector', {id:'${s.id}'})" class="glass rounded-2xl shadow-lg p-5 card-hover text-right cursor-pointer">
              <div class="bg-gradient-to-br ${s.color} text-white rounded-xl p-3 inline-flex items-center justify-center mb-2">${s.icon}</div>
              <h3 class="font-bold text-gray-800">${s.name}</h3>
              <div class="text-sm text-gray-500 mt-1">${count} مراسلة</div>
            </button>`;
          }).join('')}
        </div>
        <h2 class="text-xl font-bold text-white mb-3">الإجراءات السريعة</h2>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
          <button onclick="Router.go('create')" class="bg-gradient-to-br from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition flex items-center justify-center gap-2">${ICONS.plus} مراسلة جديدة</button>
          <button onclick="Router.go('general')" class="bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition flex items-center justify-center gap-2">${ICONS.chart} التقارير</button>
          <button onclick="Router.go('followups')" class="bg-gradient-to-br from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition flex items-center justify-center gap-2">${ICONS.clipboard} المتابعة</button>
          <button onclick="Router.go('archive')" class="bg-gradient-to-br from-gray-600 to-gray-700 hover:from-gray-700 hover:to-gray-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition flex items-center justify-center gap-2">${ICONS.archive} الأرشيف</button>
        </div>
        <div class="glass rounded-2xl shadow-xl p-6">
          <h2 class="text-xl font-bold text-gray-800 mb-4">آخر المراسلات</h2>
          ${active.length === 0 ? '<div class="text-center text-gray-500 py-8">لا توجد مراسلات بعد</div>' : active.slice(0, 5).map(r => this.card(r)).join('')}
        </div>
        <div class="text-center text-xs text-white/70 mt-8 pb-4"><p>© 2026 ${CONFIG.ORG}</p><p class="mt-1">تطوير: ${CONFIG.DEV}</p></div>
      </div>
    </div>`;
  },

  // ... (باقي الدوال محفوظة كما هي مع استبدال emojis بأيقونات SVG)
};
