<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
  * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }

  .glass { background: rgba(255,255,255,0.97); backdrop-filter: blur(10px); }

  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,118,110,0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }

  .chat-bubble.other { background: #e5e7eb; color: #1f2937; margin-right: auto; border-bottom-right-radius: 4px; }
  .attachment-chip { display: inline-flex; align-items: center; gap: 4px; background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 12px; font-size: 12px; margin: 2px; }
  .attachment-card { background: white; border-radius: 12px; padding: 12px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all 0.2s; border: 1px solid #e5e7eb; }
  .attachment-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateY(-1px); }
  .attachment-info { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .attachment-icon { font-size: 32px; flex-shrink: 0; }
  .attachment-name { font-weight: 600; color: #1f2937; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .attachment-size { font-size: 12px; color: #6b7280; }
  .download-btn { background: linear-gradient(135deg, #0f766e, #134e4a); color: white; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; transition: all 0.2s; }
  .download-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,118,110,0.4); }
  .quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
  .quick-actions button { padding: 8px 4px; border-radius: 8px; font-size: 12px; font-weight: 600; color: white; cursor: pointer; border: none; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .quick-actions button:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
  .qa-txt { background: #2563eb; }
  .qa-qr { background: #9333ea; }

  .qa-delete { background: #991b1b; }
  .oversight-gradient { background: linear-gradient(135deg, #7c2d12 0%, #9a3412 50%, #c2410c 100%); }
</style>

<script>
// =====================================================
// CONFIGURATION
// =====================================================
const CONFIG = {
  APP_NAME: 'مراسلات إدارة إيواءات دير البلح',
  ORG: 'إدارة إيواءات دير البلح',
  DEV: 'WTDOsama – وتد لبرمجة مواقع الويب',
  VERSION: '11.0.0-OversightSystem',
  SB_URL: 'https://vhypuurifaeqgyxdgubz.supabase.co',
  SB_KEY: 'sb_publishable_rhTVmxm81mzW-2_a4o7x6A_ii8b4hNk',
  USE_SB: true,
  WHATSAPP_NUMBER: '970592227958',
};

const SECTORS = [
  { id: '4c64a3cc-489c-4e90-8a75-394fae14023d', name: 'القاطع الشرقي', code: 'EAST', color: 'from-yellow-500 to-orange-600', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/><circle cx="12" cy="12" r="4"/></svg>' },
  { id: 'ed3f75d5-380d-40c7-bae9-ac83881f3f49', name: 'القاطع الغربي', code: 'WEST', color: 'from-blue-500 to-blue-700', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 16c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 8c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1 .6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>' },
  { id: '655618a6-1465-471a-bed3-0cdfbba1e87c', name: 'القاطع الشمالي', code: 'NORTH', color: 'from-purple-500 to-purple-700', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>' },
  { id: 'bce65411-4d2f-4cee-9602-83604232664d', name: 'القاطع الجنوبي', code: 'SOUTH', color: 'from-red-500 to-red-700', icon: '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>' },
];

const ROLES = {
  super_admin: 'مدير عام للنظام',
  general_admin: 'مدير عام',
  sector_admin: 'مدير قاطع',
  central_oversight: 'الرقابة المركزية',
  sector_staff: 'موظف قاطع',
};

let sb = null;
let sbConnected = false;
let realtimeSubs = [];
let appData = { correspondence: [], complaints: [] };

try {
  if (CONFIG.USE_SB && CONFIG.SB_URL && CONFIG.SB_KEY && CONFIG.SB_URL.includes('supabase.co') && !CONFIG.SB_KEY.includes('YOUR')) {
    sb = window.supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);
    sbConnected = true;
    console.log('✓ Supabase connected');
  } else {
    console.log('ℹ Local mode');
  }
} catch (e) { console.error('Supabase init failed:', e); }

// =====================================================
// UTILS
// =====================================================
const U = {
  uuid: () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  }),
  now: () => new Date().toISOString(),
  fmtDate: (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '',
  fmtShort: (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '',
  genRef: (code) => `DB-${code}-${new Date().getFullYear()}-${Math.floor(Math.random()*9000)+1000}`,
  esc: (s) => s ? String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '',
  save: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  load: (k, d = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  toast: (msg, type = 'info') => {
    const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-600' };
    const el = document.createElement('div');
    el.className = `fixed top-4 left-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-2xl z-[200] fade-in`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },
  getFileIcon: (type) => ({ image: '🖼️', excel: '📊', document: '📄', pdf: '📕', archive: '📦', other: '📎' }[type] || '📎'),
  getFileType: (mime, name) => {
    mime = mime || ''; name = name || '';
    const lowerName = name.toLowerCase();
    if (mime.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg|bmp)$/i.test(lowerName)) return 'image';
    if (mime.includes('excel') || mime.includes('spreadsheet') || /\.(xlsx|xls|csv)$/i.test(lowerName)) return 'excel';
    if (mime.includes('pdf') || lowerName.endsWith('.pdf')) return 'pdf';
    if (mime.includes('word') || mime.includes('document') || /\.(doc|docx)$/i.test(lowerName)) return 'document';
    if (mime.includes('zip') || mime.includes('compressed') || mime.includes('rar') || /\.(zip|rar|7z|tar|gz)$/i.test(lowerName)) return 'archive';
    return 'other';
  },
  formatFileSize: (bytes) => {
    if (!bytes) return '0 B';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  },
  getDownloadLabel: (type) => ({ image: 'تحميل الصورة', excel: 'تحميل Excel', document: 'تحميل الملف', pdf: 'تحميل PDF', archive: 'تحميل الملف', other: 'تحميل الملف' }[type] || 'تحميل الملف')
};

// =====================================================
// AUTH
// =====================================================
const Auth = {
  user: null,
  load() { this.user = U.load('db_user', null); return this.user; },
  async login(email, password) {
    if (sbConnected) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      this.user = profile || { id: data.user.id, full_name: email.split('@')[0], role: 'sector_staff' };
      subscribeToNotifications();
    } else {
      if (email === 'admin@deir-albalah.ps' && password === 'password') {
        this.user = { id: 'demo-1', username: 'admin', full_name: 'المدير العام', role: 'super_admin', sector_id: null };
      } else {
        throw new Error('بيانات الدخول غير صحيحة');
      }
    }
    U.save('db_user', this.user);
    return this.user;
  },
  async logout() {
    if (sbConnected) { await sb.auth.signOut(); realtimeSubs.forEach(s => s?.unsubscribe()); realtimeSubs = []; }
    this.user = null;
    localStorage.removeItem('db_user');
    render();
  }
};

function subscribeToNotifications() {
  if (!sbConnected || !Auth.user) return;
  const notifSub = sb.channel('notifications')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, (payload) => {
      U.toast(`🔔 ${payload.new.title}: ${payload.new.message}`, 'info');
      refreshNotifications();
    }).subscribe();
  realtimeSubs.push(notifSub);
}

async function refreshNotifications() {
  if (!sbConnected) return;
  const { count } = await sb.from('notifications').select('*', { count: 'exact', head: true }).eq('user_id', Auth.user.id).eq('is_read', false);
  const badge = document.getElementById('notifBadge');
  if (badge) { badge.textContent = count || 0; badge.classList.toggle('hidden', !count); }
}

// =====================================================
// DATA SERVICE
// =====================================================
const DB = {
  async getAll(filters = {}) {
    if (sbConnected) {
      let q = sb.from('correspondence').select('*, attachments(*), replies(*)');
      if (filters.sector_id) q = q.eq('sector_id', filters.sector_id);
      if (filters.is_archived !== undefined) q = q.eq('is_archived', filters.is_archived);
      const { data, error } = await q.order('created_at', { ascending: false });
      if (error) throw error;
      return data;
    }
    return U.load('db_correspondence', []);
  },
  
  async create(rec, files = []) {
    if (sbConnected) {
      if (rec.sector_id === 'ALL') {
        const results = [];
        for (const sector of SECTORS) {
          const newRec = await this._createSingle({ ...rec, sector_id: sector.id }, files);
          results.push(newRec);
        }
        return results;
      } else {
        return await this._createSingle(rec, files);
      }
    } else {
      const data = U.load('db_correspondence', []);
      const newRec = {
        id: U.uuid(),
        reference_number: rec.reference_number || U.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX'),
        subject: rec.subject, content: rec.content,
        sender_name: rec.sender_name || Auth.user?.full_name,
        sector_id: rec.sector_id, priority: rec.priority || 'normal',
        is_archived: false, replies: [], follow_ups: [], attachments: [],
        created_at: U.now(),
      };
      data.push(newRec);
      U.save('db_correspondence', data);
      return newRec;
    }
  },

  async _createSingle(rec, files = []) {
    const { data, error } = await sb.from('correspondence').insert([{
      reference_number: rec.reference_number || U.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX'),
      subject: rec.subject, content: rec.content,
      sender_id: Auth.user?.id,
      sender_name: rec.sender_name || Auth.user?.full_name,
      sector_id: rec.sector_id, priority: rec.priority || 'normal',
    }]).select().single();
    if (error) throw error;
    return data;
  },

  async uploadAttachments(correspondenceId, files) {
    if (!sbConnected) return;
    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      const ext = file.name.split('.').pop();
      const path = `${correspondenceId}/${U.uuid()}.${ext}`;
      const { error: uploadError } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type, upsert: false });
      if (uploadError) throw new Error(`فشل رفع الملف ${file.name}: ${uploadError.message}`);
      await sb.from('attachments').insert([{
        correspondence_id: correspondenceId, file_name: path, original_name: file.name,
        mime_type: file.type, size_bytes: file.size,
        file_type: U.getFileType(file.type, file.name),
        storage_path: path, uploaded_by: Auth.user?.id,
      }]);
    }
  },

  async update(id, updates) {
    if (sbConnected) {
      const { data, error } = await sb.from('correspondence').update(updates).eq('id', id).select().single();
      if (error) throw error;
      return data;
    }
    const data = U.load('db_correspondence', []);
    const idx = data.findIndex(d => d.id === id);
    if (idx === -1) throw new Error('غير موجود');
    data[idx] = { ...data[idx], ...updates, updated_at: U.now() };
    U.save('db_correspondence', data);
    return data[idx];
  },
  async archive(id) { return this.update(id, { is_archived: true }); },
  async restore(id) { return this.update(id, { is_archived: false }); },
  async remove(id) {
    if (sbConnected) { await sb.from('correspondence').delete().eq('id', id); return; }
    U.save('db_correspondence', U.load('db_correspondence', []).filter(d => d.id !== id));
  },
  async addReply(id, content) {
    if (sbConnected) {
      const { data, error } = await sb.from('replies').insert([{
        correspondence_id: id, user_id: Auth.user?.id, author_name: Auth.user?.full_name, content
      }]).select().single();
      if (error) throw error;
      return data;
    }
    const data = U.load('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    rec.replies = rec.replies || [];
    rec.replies.push({ id: U.uuid(), content, author: Auth.user?.full_name, created_at: U.now() });
    U.save('db_correspondence', data);
    return rec;
  },
  async addFollowUp(id, fu) {
    if (sbConnected) {
      const { data, error } = await sb.from('follow_ups').insert([{
        correspondence_id: id, user_id: Auth.user?.id, ...fu
      }]).select().single();
      if (error) throw error;
      return data;
    }
    const data = U.load('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    rec.follow_ups = rec.follow_ups || [];
    rec.follow_ups.push({ id: U.uuid(), ...fu, created_at: U.now() });
    U.save('db_correspondence', data);
    return rec;
  },
  async getById(id) {
    if (sbConnected) {
      const { data, error } = await sb.from('correspondence').select('*, attachments(*), replies(*)').eq('id', id).single();
      if (!error && data) return data;
    }
    return U.load('db_correspondence', []).find(d => d.id === id);
  },
  async getNotifications() {
    if (!sbConnected) return [];
    const { data } = await sb.from('notifications').select('*').eq('user_id', Auth.user?.id).order('created_at', { ascending: false }).limit(20);
    return data || [];
  },
  async markNotificationsRead() {
    if (!sbConnected) return;
    await sb.from('notifications').update({ is_read: true }).eq('user_id', Auth.user?.id).eq('is_read', false);
  },
  
  // ========== COMPLAINTS SERVICE ==========
  async getComplaints(filters = {}) {
    if (sbConnected) {
      let q = sb.from('complaints').select('*');
      if (filters.sector_id) q = q.eq('sector_id', filters.sector_id);
      if (filters.status) q = q.eq('status', filters.status);
      if (filters.priority) q = q.eq('priority', filters.priority);
      const { data, error } = await q.order('created_at', { ascending: false });
      if (error) throw error;
      return data || [];
    }
    let data = U.load('db_complaints', []);
    if (filters.sector_id) data = data.filter(c => c.sector_id === filters.sector_id);
    if (filters.status) data = data.filter(c => c.status === filters.status);
    if (filters.priority) data = data.filter(c => c.priority === filters.priority);
    return data;
  },
  
  async createComplaint(complaint) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').insert([{
        ...complaint,
        submitted_by: Auth.user?.id,
        submitted_by_name: Auth.user?.full_name,
      }]).select().single();
      if (error) throw error;
      return data;
    }
    const complaints = U.load('db_complaints', []);
    const newC = {
      ...complaint,
      id: U.uuid(),
      submitted_by: Auth.user?.id,
      submitted_by_name: Auth.user?.full_name,
      status: 'pending',
      created_at: U.now(),
    };
    complaints.push(newC);
    U.save('db_complaints', complaints);
    return newC;
  },
  
  async updateComplaint(id, updates) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints')
        .update({ ...updates, updated_at: new Date().toISOString() })
        .eq('id', id).select().single();
      if (error) throw error;
      return data;
    }
    const complaints = U.load('db_complaints', []);
    const idx = complaints.findIndex(c => c.id === id);
    if (idx === -1) throw new Error('غير موجود');
    complaints[idx] = { ...complaints[idx], ...updates, updated_at: U.now() };
    U.save('db_complaints', complaints);
    return complaints[idx];
  },
  
  async getComplaintById(id) {
    if (sbConnected) {
      const { data, error } = await sb.from('complaints').select('*').eq('id', id).single();
      if (!error && data) return data;
    }
    return U.load('db_complaints', []).find(c => c.id === id);
  },
  
  async getComplaintStats(sector_id) {
    const all = await this.getComplaints(sector_id ? { sector_id } : {});
    return {
      total: all.length,
      pending: all.filter(c => c.status === 'pending').length,
      in_progress: all.filter(c => c.status === 'in_progress').length,
      resolved: all.filter(c => c.status === 'resolved').length,
      rejected: all.filter(c => c.status === 'rejected').length,
      urgent: all.filter(c => c.priority === 'urgent').length,
    };
  },
};

// =====================================================
// UI ACTIONS
// =====================================================
const UI = {
  reply(id) {
    const content = prompt('نص الرد:');
    if (!content) return;
    try { DB.addReply(id, content); U.toast('تم إضافة الرد', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  followUp(id) {
    const title = prompt('عنوان المهمة:');
    if (!title) return;
    try { DB.addFollowUp(id, { title, status: 'pending' }); U.toast('تمت إضافة المتابعة', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  async archive(id) {
    if (!confirm('تأكيد أرشفة هذه المراسلة؟')) return;
    try { await DB.archive(id); U.toast('تمت الأرشفة', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  async restore(id) {
    try { await DB.restore(id); U.toast('تمت الاستعادة', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  async del(id) {
    if (!confirm('⚠️ حذف نهائي؟')) return;
    try { await DB.remove(id); U.toast('تم الحذف', 'success'); Router.go('dashboard'); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  openWhatsApp() {
    const msg = encodeURIComponent(`مرحباً، أنا من ${CONFIG.ORG}`);
    window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${msg}`, '_blank');
  },
  
  async submitComplaint() {
    const sector = document.getElementById('compSector').value;
    const title = document.getElementById('compTitle').value.trim();
    const description = document.getElementById('compDesc').value.trim();
    const name = document.getElementById('compName').value.trim();
    const phone = document.getElementById('compPhone').value.trim();
    const type = document.getElementById('compType').value;
    const priority = document.getElementById('compPriority').value;
    
    if (!title || !description) {
      U.toast('الرجاء إدخال العنوان والتفاصيل', 'warning');
      return;
    }
    
    const btn = document.getElementById('submitComplaintBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري الإرسال...';
    
    try {
      await DB.createComplaint({
        sector_id: sector, title, description,
        complainant_name: name, complainant_phone: phone,
        complainant_type: type, priority, attachments: [],
      });
      U.toast('✅ تم إرسال الشكوى بنجاح', 'success');
      const u = Auth.user || {};
      Router.go(u.role === 'central_oversight' ? 'oversightDashboard' : 'oversightComplaints');
    } catch (e) {
      U.toast(e.message || 'حدث خطأ', 'error');
      btn.disabled = false;
      btn.innerHTML = '📤 إرسال الشكوى';
    }
  },

  async updateComplaint(id) {
    const status = document.getElementById('updateStatus').value;
    const response = document.getElementById('adminResponse').value.trim();
    const updates = { status, admin_response: response };
    if (status === 'resolved') {
      updates.resolved_by = Auth.user?.id;
      updates.resolved_at = new Date().toISOString();
    }
    try {
      await DB.updateComplaint(id, updates);
      U.toast('✅ تم تحديث الشكوى', 'success');
      Router.go('viewComplaint', { id });
    } catch (e) {
      U.toast(e.message || 'حدث خطأ', 'error');
    }
  },

  async exportOversightReport() {
    const u = Auth.user || {};
    const complaints = await DB.getComplaints({ sector_id: u.sector_id });
    const sector = SECTORS.find(s => s.id === u.sector_id);
    
    let csv = '\ufeffنظام الرقابة المركزية - تقرير الشكاوى\n';
    csv += `القاطع: ${sector?.name || ''}\nتاريخ التقرير: ${U.fmtDate(new Date().toISOString())}\n\n`;
    csv += 'الرقم,العنوان,الحالة,الأولوية,المشتكي,الهاتف,التاريخ,الرد\n';
    
    complaints.forEach(c => {
      csv += `${c.id.substring(0,8)},"${c.title}","${c.status}","${c.priority}","${c.complainant_name || ''}","${c.complainant_phone || ''}","${U.fmtShort(c.created_at)}","${c.admin_response || ''}"\n`;
    });
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `تقرير_الرقابة_${sector?.code || ''}_${Date.now()}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    U.toast('✅ تم تصدير التقرير', 'success');
  },
};

async function render() {
  Auth.load();

  const whatsappBtn = document.getElementById('whatsappBtn');
  
  if (!Auth.user) {
    app.innerHTML = Views.login();
    whatsappBtn.classList.add('hidden');
    setTimeout(() => {
      const btn = document.getElementById('lgBtn');
      if (btn) {
        btn.onclick = handleLogin;
        document.getElementById('lgPass').addEventListener('keypress', e => {
          if (e.key === 'Enter') handleLogin();
        });
      }
    }, 0);
  } else {
    whatsappBtn.classList.remove('hidden');
    const u = Auth.user;
    
    // ✅ التوجيه التلقائي للرقابة المركزية
    if (u.role === 'central_oversight' && Router.page === 'dashboard') {
      Router.page = 'oversightDashboard';
    }
    
    // جلب البيانات
    if (sbConnected) {
      try {
        let filters = {};
        if (u.role === 'sector_admin' && u.sector_id) filters.sector_id = u.sector_id;
        appData.correspondence = await DB.getAll(filters);
        
        if (u.role === 'central_oversight' || u.role === 'sector_admin') {
          appData.complaints = await DB.getComplaints({ sector_id: u.sector_id });
        } else if (u.role === 'super_admin' || u.role === 'general_admin') {
          appData.complaints = await DB.getComplaints({});
        } else {
          appData.complaints = [];
        }
      } catch (e) {
        console.error("فشل جلب البيانات", e);
        appData = { correspondence: [], complaints: [] };
      }
    } else {
      appData.correspondence = U.load('db_correspondence', []);
      appData.complaints = U.load('db_complaints', []);
    }
    
    const views = {
      dashboard: () => Views.dashboard(appData.correspondence),
      sector: () => Views.sector(appData.correspondence),
      general: () => Views.general(appData.correspondence),
      archive: () => Views.archive(appData.correspondence),
      followups: () => Views.followups(appData.correspondence),
      create: () => Views.create(),
      view: () => Views.view(),
      complaints: () => Views.complaints(),
      oversightDashboard: () => Views.oversightDashboard(),
      oversightComplaints: () => Views.oversightComplaints(),
      createComplaint: () => Views.createComplaint(),
      viewComplaint: () => Views.viewComplaint(),
    };
    
    const viewFn = views[Router.page] || (u.role === 'central_oversight' ? views.oversightDashboard : views.dashboard);
    const html = await viewFn();
    app.innerHTML = html;
    
    bindEvents();
  }
}

function bindEvents() {
  if (Router.page === 'create') {
    const saveBtn = document.getElementById('saveBtn');
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const sector = document.getElementById('fSec').value;
        const subject = document.getElementById('fSub').value.trim();
        const content = document.getElementById('fCon').value.trim();
        const sender = document.getElementById('fSen').value.trim();
        const priority = document.getElementById('fPri').value;
        if (!subject || !content) { U.toast('الرجاء إدخال الموضوع والمحتوى', 'warning'); return; }
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
        try {
          const result = await DB.create({ sector_id: sector, subject, content, sender_name: sender, priority }, []);
          if (Array.isArray(result)) {
            U.toast(`✅ تم تعميم المراسلة على ${result.length} قواطع`, 'success');
          } else {
            U.toast('✅ تم حفظ المراسلة', 'success');
          }
          Router.go('dashboard');
        } catch (e) {
          U.toast(e.message || 'حدث خطأ', 'error');
          saveBtn.disabled = false;
          saveBtn.innerHTML = '💾 حفظ المراسلة';
        }
      };
    }
  }
  
  if (Router.page === 'createComplaint') {
    const btn = document.getElementById('submitComplaintBtn');
    if (btn) btn.onclick = () => UI.submitComplaint();
  }
}

async function handleLogin() {
  const email = document.getElementById('lgEmail').value.trim();
  const password = document.getElementById('lgPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('lgBtn');
  if (!email || !password) {
    errEl.textContent = 'الرجاء إدخال البريد وكلمة المرور';
    errEl.classList.remove('hidden');
    return;
  }
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جاري الدخول...';
  errEl.classList.add('hidden');
  try {
    await Auth.login(email, password);
    U.toast(`مرحباً ${Auth.user.full_name}`, 'success');
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '🔐 تسجيل الدخول';
  }
}

render();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded`);
</script>
</body>
</html>
