<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراسلات إدارة إيواءات دير البلح</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
  * { font-family: 'Cairo', sans-serif; }
  body { background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%); min-height: 100vh; margin: 0; }
  .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
  .btn-primary { background: linear-gradient(135deg, #0f766e, #134e4a); color: white; cursor: pointer; border: none; transition: all 0.3s; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,118,110,0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.4s ease-in; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div id="app" class="fade-in"></div>

<script>
// =====================================================
// CONFIGURATION - استبدل القيم دي ببياناتك
// =====================================================
const CONFIG = {
  APP_NAME: 'مراسلات إدارة إيواءات دير البلح',
  VERSION: '5.0.0',
  SUPABASE_URL: 'https://supabase.com/dashboard/project/vhypuurifaeqgyxdgubz/settings/api-keys',  // <-- حط رابط مشروعك هنا
  SUPABASE_KEY: 'sb_publishable_rhTVmxm81mzW-2_a4o7x6A_ii8b4hNk',          // <-- حط المفتاح هنا
};

// =====================================================
// SUPABASE CLIENT
// =====================================================
let sb = null;
try {
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  console.log('✓ Connected to Supabase');
} catch (e) {
  console.error('✗ Supabase connection failed:', e);
}

// =====================================================
// AUTH
// =====================================================
const Auth = {
  user: null,
  
  async login(email, password) {
    if (!sb) throw new Error('Supabase غير متصل');
    
    const { data, error } = await sb.auth.signInWithPassword({
      email,
      password
    });
    
    if (error) throw new Error(error.message);
    
    // جلب بيانات المستخدم من profiles
    const { data: profile } = await sb
      .from('profiles')
      .select('*')
      .eq('id', data.user.id)
      .single();
    
    this.user = profile || { 
      id: data.user.id, 
      full_name: email.split('@')[0], 
      role: 'sector_staff' 
    };
    
    return this.user;
  },
  
  async logout() {
    if (sb) await sb.auth.signOut();
    this.user = null;
    render();
  }
};

// =====================================================
// DATA SERVICE
// =====================================================
const DB = {
  async getSectors() {
    const { data, error } = await sb.from('sectors').select('*').order('name_ar');
    if (error) throw error;
    return data;
  },
  
  async getCorrespondence(filters = {}) {
    let query = sb.from('correspondence').select('*');
    
    if (filters.sector_id) {
      query = query.eq('sector_id', filters.sector_id);
    }
    if (filters.is_archived !== undefined) {
      query = query.eq('is_archived', filters.is_archived);
    }
    
    const { data, error } = await query.order('created_at', { ascending: false });
    if (error) throw error;
    return data;
  },
  
  async createCorrespondence(data) {
    const { data: result, error } = await sb
      .from('correspondence')
      .insert([{
        reference_number: `DB-${Date.now()}`,
        subject: data.subject,
        content: data.content,
        sender_name: Auth.user?.full_name || 'مستخدم',
        sector_id: data.sector_id,
        priority: data.priority || 'normal'
      }])
      .select()
      .single();
    
    if (error) throw error;
    return result;
  },
  
  async addReply(correspondenceId, content) {
    const { data, error } = await sb
      .from('replies')
      .insert([{
        correspondence_id: correspondenceId,
        author_name: Auth.user?.full_name,
        content
      }])
      .select()
      .single();
    
    if (error) throw error;
    return data;
  }
};

// =====================================================
// RENDER
// =====================================================
async function render() {
  const app = document.getElementById('app');
  
  if (!Auth.user) {
    // Login page
    app.innerHTML = `
      <div class="min-h-screen flex items-center justify-center p-4">
        <div class="glass rounded-3xl shadow-2xl p-8 w-full max-w-md">
          <div class="text-center mb-6">
            <div class="text-6xl mb-3">🏢</div>
            <h1 class="text-2xl font-bold text-teal-800">${CONFIG.APP_NAME}</h1>
            <p class="text-gray-600 text-sm mt-2">نظام المراسلات الإدارية</p>
          </div>
          
          <div id="errorMsg" class="hidden bg-red-100 border-r-4 border-red-500 text-red-700 p-3 rounded mb-4 text-sm"></div>
          
          <form class="space-y-4" onsubmit="return false;">
            <div>
              <label class="block text-sm font-semibold mb-2 text-gray-700">البريد الإلكتروني</label>
              <input type="email" id="emailInput" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="admin@deir-albalah.ps">
            </div>
            <div>
              <label class="block text-sm font-semibold mb-2 text-gray-700">كلمة المرور</label>
              <input type="password" id="passInput" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" placeholder="••••••••">
            </div>
            <button type="button" id="loginBtn" class="btn-primary w-full py-3 rounded-xl font-bold text-lg">
              🔐 تسجيل الدخول
            </button>
          </form>
          
          <div class="mt-4 text-xs text-gray-500 text-center">
            <p>الإصدار ${CONFIG.VERSION}</p>
          </div>
        </div>
      </div>
    `;
    
    document.getElementById('loginBtn').onclick = handleLogin;
  } else {
    // Dashboard
    app.innerHTML = `
      <div class="min-h-screen bg-gradient-to-br from-teal-700 to-teal-900">
        <nav class="glass shadow-lg sticky top-0 z-50">
          <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
              <span class="text-3xl">🏢</span>
              <div>
                <div class="font-bold text-teal-800">${CONFIG.APP_NAME}</div>
                <div class="text-xs text-gray-600">${Auth.user.full_name}</div>
              </div>
            </div>
            <button onclick="Auth.logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-semibold">
               خروج
            </button>
          </div>
        </nav>
        
        <div class="max-w-7xl mx-auto p-6">
          <div class="glass rounded-2xl shadow-xl p-6 mb-6">
            <h1 class="text-3xl font-bold text-teal-800 mb-2">👋 أهلاً ${Auth.user.full_name}</h1>
            <p class="text-gray-600">${Auth.user.role || 'مستخدم'}</p>
          </div>
          
          <div id="sectorsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="glass rounded-2xl shadow-lg p-6 text-center">
              <div class="text-gray-500">جاري تحميل القواطع...</div>
            </div>
          </div>
        </div>
      </div>
    `;
    
    // Load sectors
    loadSectors();
  }
}

async function handleLogin() {
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passInput').value;
  const errorMsg = document.getElementById('errorMsg');
  const loginBtn = document.getElementById('loginBtn');
  
  loginBtn.disabled = true;
  loginBtn.innerHTML = '⏳ جاري تسجيل الدخول...';
  errorMsg.classList.add('hidden');
  
  try {
    await Auth.login(email, password);
    render();
  } catch (error) {
    errorMsg.textContent = error.message;
    errorMsg.classList.remove('hidden');
    loginBtn.disabled = false;
    loginBtn.innerHTML = '🔐 تسجيل الدخول';
  }
}

async function loadSectors() {
  try {
    const sectors = await DB.getSectors();
    const container = document.getElementById('sectorsContainer');
    
    const sectorIcons = {
      'EAST': '🌅',
      'WEST': '',
      'NORTH': '️',
      'SOUTH': '️'
    };
    
    container.innerHTML = sectors.map(sector => `
      <button onclick="showSector('${sector.id}')" class="glass rounded-2xl shadow-lg p-6 text-right hover:shadow-2xl transition cursor-pointer">
        <div class="bg-gradient-to-br from-teal-500 to-teal-700 text-white rounded-xl p-3 inline-block text-3xl mb-2">
          ${sectorIcons[sector.code] || '📁'}
        </div>
        <h3 class="font-bold text-gray-800">${sector.name_ar}</h3>
      </button>
    `).join('');
  } catch (error) {
    console.error('Error loading sectors:', error);
  }
}

function showSector(sectorId) {
  alert(`فتح القاطع: ${sectorId}\n(سيتم إضافة صفحة المراسلات قريباً)`);
}

// Initialize
render();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded`);
</script>
</body>
</html>
