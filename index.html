  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
  * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
  body { background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%); min-height: 100vh; margin: 0; }
  .glass { background: rgba(255,255,255,0.97); backdrop-filter: blur(10px); }
  .btn-primary { background: linear-gradient(135deg, #0f766e, #134e4a); color: white; cursor: pointer; border: none; transition: all 0.3s; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,118,110,0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.3s ease-in; }

<script>

// =====================================================
const CONFIG = {

  ORG: 'إدارة إيواءات دير البلح',
  DEV: 'WTDOsama – وتد لبرمجة مواقع الويب',
  VERSION: '9.1.0',
  SB_URL: 'https://vhypuurifaeqgyxdgubz.supabase.co',
  SB_KEY: 'sb_publishable_rhTVmxm81mzW-2_a4o7x6A_ii8b4hNk',
  USE_SB: true,
  WHATSAPP_NUMBER: '9702227958',
};

const SECTORS = [
  { id: '4c64a3cc-489c-4e90-8a75-394fae14023d', name: 'القاطع الشرقي', code: 'EAST', color: 'from-yellow-500 to-orange-600', icon: '🌅' },
  { id: 'ed3f75d5-380d-40c7-bae9-ac83881f3f49', name: 'القاطع الغربي', code: 'WEST', color: 'from-blue-500 to-blue-700', icon: '🌊' },
  { id: '655618a6-1465-471a-bed3-0cdfbba1e87c', name: 'القاطع الشمالي', code: 'NORTH', color: 'from-purple-500 to-purple-700', icon: '🏔️' },
  { id: 'bce65411-4d2f-4cee-9602-83604232664d', name: 'القاطع الجنوبي', code: 'SOUTH', color: 'from-red-500 to-red-700', icon: '☀️' },
];

const ROLES = {
  super_admin: 'مدير عام للنظام',
  general_admin: 'مدير عام',
  sector_admin: 'مدير قاطع',
  sector_staff: 'موظف قاطع',
};

let sb = null;
let sbConnected = false;
let realtimeSubs = [];
let appData = []; // متغير عام لتخزين البيانات الحديثة

try {
  if (CONFIG.USE_SB && CONFIG.SB_URL && CONFIG.SB_KEY && CONFIG.SB_URL.includes('supabase.co') && !CONFIG.SB_KEY.includes('YOUR')) {
    sb = window.supabase.createClient(CONFIG.SB_URL, CONFIG.SB_KEY);
    sbConnected = true;
    console.log('✓ Supabase connected');
  } else {
    console.log('ℹ Local mode');
  }
} catch (e) { console.error('Supabase init failed:', e); }

const U = {
  uuid: () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  }),
  now: () => new Date().toISOString(),
  fmtDate: (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '',
  fmtShort: (iso) => iso ? new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '',
  genRef: (code) => `DB-${code}-${new Date().getFullYear()}-${Math.floor(Math.random()*9000)+1000}`,
  esc: (s) => s ? String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])) : '',
  save: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  load: (k, d = null) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  toast: (msg, type = 'info') => {
    const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-600' };
    const el = document.createElement('div');
    el.className = `fixed top-4 left-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-2xl z-[200] fade-in`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },
  getFileIcon: (type) => ({ image: '🖼️', excel: '📊', document: '📄', other: '📎' }[type] || '📎'),
  getFileType: (mime, name) => {
    mime = mime || ''; name = name || '';
    if (mime.startsWith('image/')) return 'image';
    if (mime.includes('excel') || mime.includes('spreadsheet') || name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv')) return 'excel';
    if (mime.includes('pdf') || mime.includes('document') || name.endsWith('.doc') || name.endsWith('.docx')) return 'document';
    return 'other';
  },
};

const Auth = {
  user: null,
  load() { this.user = U.load('db_user', null); return this.user; },
  async login(email, password) {
    if (sbConnected) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw new Error(error.message);
      const { data: profile } = await sb.from('profiles').select('*').eq('id', data.user.id).single();
      this.user = profile || { id: data.user.id, full_name: email.split('@')[0], role: 'sector_staff' };
      subscribeToNotifications();
    } else {
      if (email === 'admin@deir-albalah.ps' && password === 'password') {
        this.user = { id: 'demo-1', username: 'admin', full_name: 'المدير العام', role: 'super_admin', sector_id: null };
      } else {
        throw new Error('بيانات الدخول غير صحيحة');
      }
    }
    U.save('db_user', this.user);
    return this.user;
  },
  async logout() {
    if (sbConnected) { await sb.auth.signOut(); realtimeSubs.forEach(s => s?.unsubscribe()); realtimeSubs = []; }
    this.user = null;
    localStorage.removeItem('db_user');
    render();
  }
};

function subscribeToNotifications() {
  if (!sbConnected || !Auth.user) return;
  const notifSub = sb.channel('notifications')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: `user_id=eq.${Auth.user.id}` }, (payload) => {
      U.toast(`🔔 ${payload.new.title}: ${payload.new.message}`, 'info');
      refreshNotifications();
    }).subscribe();
  realtimeSubs.push(notifSub);
  
  const corrSub = sb.channel('correspondence')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'correspondence' }, () => {
      U.toast('📨 تم إضافة مراسلة جديدة', 'success');
      if (['dashboard', 'general', 'sector'].includes(Router.page)) render();
    }).subscribe();
  realtimeSubs.push(corrSub);
}

async function refreshNotifications() {
  if (!sbConnected) return;
  const { count } = await sb.from('notifications').select('*', { count: 'exact', head: true }).eq('user_id', Auth.user.id).eq('is_read', false);
  const badge = document.getElementById('notifBadge');
  if (badge) { badge.textContent = count || 0; badge.classList.toggle('hidden', !count); }
}

const DB = {
  async getAll(filters = {}) {
    if (sbConnected) {
      let q = sb.from('correspondence').select('*, attachments(*)');
      if (filters.sector_id) q = q.eq('sector_id', filters.sector_id);
      if (filters.is_archived !== undefined) q = q.eq('is_archived', filters.is_archived);
      const { data, error } = await q.order('created_at', { ascending: false });
      if (error) throw error;
      return data;
    }
    let data = U.load('db_correspondence', []);
    if (filters.sector_id) data = data.filter(d => d.sector_id === filters.sector_id);
    if (filters.is_archived !== undefined) data = data.filter(d => !!d.is_archived === filters.is_archived);
    if (filters.search) {
      const s = filters.search.toLowerCase();
      data = data.filter(d => (d.subject + ' ' + d.content + ' ' + d.reference_number).toLowerCase().includes(s));
    }
    if (filters.priority) data = data.filter(d => d.priority === filters.priority);
    return data.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  },
async create(rec, files = []) {
  let newRec;
  if (sbConnected) {
    const { data, error } = await sb.from('correspondence').insert([{
      reference_number: rec.reference_number || U.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX'),
      subject: rec.subject, content: rec.content,
      sender_id: Auth.user?.id,
      sender_name: rec.sender_name || Auth.user?.full_name,
      sector_id: rec.sector_id, priority: rec.priority || 'normal',
    }]).select().single();
    if (error) throw error;
    newRec = data;
    // رفع المرفقات إلى Supabase Storage
    if (files.length > 0) {
      await this.uploadAttachments(newRec.id, files);
      // إعادة جلب البيانات لتحديث المرفقات
      const { data: updated } = await sb.from('correspondence').select('*, attachments(*)').eq('id', newRec.id).single();
      newRec = updated;
    }
  } else {
    const data = U.load('db_correspondence', []);
    newRec = {
      id: U.uuid(),
      reference_number: rec.reference_number || U.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX'),
      subject: rec.subject, content: rec.content,
      sender_name: rec.sender_name || Auth.user?.full_name,
      sector_id: rec.sector_id, priority: rec.priority || 'normal',
      is_archived: false, replies: [], follow_ups: [], attachments: [],
      created_at: U.now(),
    };
    for (const file of files) {
      newRec.attachments.push({
        id: U.uuid(), file_name: file.name, original_name: file.name,
        mime_type: file.type, file_type: U.getFileType(file.type, file.name),
        size_bytes: file.size, data_url: file.data_url,
      });
    }
    data.push(newRec);
    U.save('db_correspondence', data);
  }
  return newRec;
},
  async uploadAttachments(correspondenceId, files) {
    if (!sbConnected) return;
    for (const file of files) {
      const ext = file.name.split('.').pop();
      const path = `${correspondenceId}/${U.uuid()}.${ext}`;
      const { error } = await sb.storage.from('attachments').upload(path, file, { contentType: file.type });
      if (error) throw error;
      const { data: { publicUrl } } = sb.storage.from('attachments').getPublicUrl(path);
      await sb.from('attachments').insert([{
        correspondence_id: correspondenceId, file_name: path, original_name: file.name,
        mime_type: file.type, size_bytes: file.size,
        file_type: U.getFileType(file.type, file.name),
        storage_path: publicUrl, uploaded_by: Auth.user?.id,
      }]);
    }
  },
  async update(id, updates) {
    if (sbConnected) {
      const { data, error } = await sb.from('correspondence').update(updates).eq('id', id).select().single();
      if (error) throw error;
      return data;
    }
    const data = U.load('db_correspondence', []);
    const idx = data.findIndex(d => d.id === id);
    if (idx === -1) throw new Error('غير موجود');
    data[idx] = { ...data[idx], ...updates, updated_at: U.now() };
    U.save('db_correspondence', data);
    return data[idx];
  },
  async archive(id) { return this.update(id, { is_archived: true }); },
  async restore(id) { return this.update(id, { is_archived: false }); },
  async remove(id) {
    if (sbConnected) { const { error } = await sb.from('correspondence').delete().eq('id', id); if (error) throw error; return; }
    U.save('db_correspondence', U.load('db_correspondence', []).filter(d => d.id !== id));
  },
  async addReply(id, content) {
    if (sbConnected) {
      const { data, error } = await sb.from('replies').insert([{
        correspondence_id: id, user_id: Auth.user?.id, author_name: Auth.user?.full_name, content
      }]).select().single();
      if (error) throw error;
      return data;
    }
    const data = U.load('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    if (!rec) throw new Error('غير موجود');
    rec.replies = rec.replies || [];
    rec.replies.push({ id: U.uuid(), content, author: Auth.user?.full_name, created_at: U.now() });
    U.save('db_correspondence', data);
    return rec;
  },
  async addFollowUp(id, fu) {
    if (sbConnected) {
      const { data, error } = await sb.from('follow_ups').insert([{
        correspondence_id: id, user_id: Auth.user?.id, ...fu
      }]).select().single();
      if (error) throw error;
      return data;
    }
    const data = U.load('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    if (!rec) throw new Error('غير موجود');
    rec.follow_ups = rec.follow_ups || [];
    rec.follow_ups.push({ id: U.uuid(), ...fu, created_at: U.now() });
    U.save('db_correspondence', data);
    return rec;
  },
  getById(id) { return appData.find(d => d.id === id) || U.load('db_correspondence', []).find(d => d.id === id); },
  async getNotifications() {
    if (!sbConnected) return [];
    const { data } = await sb.from('notifications').select('*').eq('user_id', Auth.user?.id).order('created_at', { ascending: false }).limit(20);
    return data || [];
  },
  async markNotificationsRead() {
    if (!sbConnected) return;
    await sb.from('notifications').update({ is_read: true }).eq('user_id', Auth.user?.id).eq('is_read', false);
  },
  async getChatMessages(limit = 50) {
    if (!sbConnected) return U.load('db_chat', []);
    const { data } = await sb.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(limit);
    return (data || []).reverse();
  },
  async sendChatMessage(message) {
    if (!sbConnected) {
      const msgs = U.load('db_chat', []);
      msgs.push({ id: U.uuid(), sender_id: Auth.user?.id, sender_name: Auth.user?.full_name, message, created_at: U.now() });
      U.save('db_chat', msgs);
      return msgs[msgs.length - 1];
    }
    const { data } = await sb.from('chat_messages').insert([{
      sender_id: Auth.user?.id, sender_name: Auth.user?.full_name, message
    }]).select().single();
    return data;
  },
  subscribeToChat(callback) {
    if (!sbConnected) return null;
    const sub = sb.channel('chat')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, (payload) => callback(payload.new))
      .subscribe();
    realtimeSubs.push(sub);
    return sub;
  },
};

        </div>
      </div>
    `;
  },

  dashboard(data) {
    data = data || appData;
    const u = Auth.user || {};
    const active = data.filter(r => !r.is_archived);
    const archived = data.filter(r => r.is_archived);
    const withFu = data.filter(r => r.follow_ups && r.follow_ups.length > 0);
    
    return `
      <div class="min-h-screen">
        ${this.navbar()}
        <div class="max-w-7xl mx-auto p-4 md:p-6 fade-in">
          <div class="glass rounded-2xl shadow-xl p-6 mb-6">
            <h1 class="text-3xl font-bold text-teal-800 mb-2">👋 أهلاً ${U.esc(u.full_name)}</h1>
            <p class="text-gray-600">${ROLES[u.role] || 'مستخدم'} ${sbConnected ? '🔗' : '💾'}</p>

          </div>
          <div class="flex items-center gap-1 md:gap-2 flex-wrap">
            <button onclick="Router.go('dashboard')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer">🏠 الرئيسية</button>
            <button onclick="Router.go('general')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer hidden md:inline">🏛️ الإدارة</button>
            <button onclick="Router.go('chat')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer hidden md:inline">💬 المحادثة</button>
            <button onclick="Router.go('notifications')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer relative">🔔 التنبيهات<span id="notifBadge" class="notification-badge hidden">0</span></button>
            <button onclick="Router.go('create')" class="px-3 py-1.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700 text-sm font-semibold cursor-pointer">➕ جديد</button>
            <button onclick="Auth.logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold cursor-pointer">🚪 خروج</button>
          </div>
        </div>
      </nav>
    `;
  },

  card(r) {
    const s = SECTORS.find(x => x.id === r.sector_id);
    const pc = r.priority === 'high' ? 'priority-high' : r.priority === 'low' ? 'priority-low' : 'priority-normal';
    return `
      <div onclick="Router.go('view', {id:'${r.id}'})" class="glass rounded-xl shadow-lg p-4 card-hover cursor-pointer ${pc}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 text-xs text-gray-500 mb-1 flex-wrap">
            <span>${r.reference_number}</span><span>•</span><span>${U.fmtShort(r.created_at)}</span>
            ${s ? `<span>•</span><span>${s.icon} ${s.name}</span>` : ''}
            ${r.sender_name ? `<span>•</span><span>👤 ${U.esc(r.sender_name)}</span>` : ''}
          </div>
          <h3 class="font-bold text-gray-800 truncate">${U.esc(r.subject)}</h3>
          <p class="text-sm text-gray-600 mt-1">${U.esc((r.content || '').substring(0, 150))}</p>
          <div class="flex gap-2 mt-2 flex-wrap text-xs">
            ${r.priority === 'high' ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded">🔴 عالية</span>' : ''}
            ${r.priority === 'normal' ? '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded">🔵 عادية</span>' : ''}
            ${r.priority === 'low' ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded">🟢 منخفضة</span>' : ''}
            ${r.is_archived ? '<span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded">📦 مؤرشف</span>' : ''}
            ${r.attachments?.length > 0 ? `<span class="bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded">📎 ${r.attachments.length}</span>` : ''}
            ${r.replies?.length > 0 ? `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">💬 ${r.replies.length}</span>` : ''}
            ${r.follow_ups?.length > 0 ? `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded">📋 ${r.follow_ups.length}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  },
};

const UI = {
  reply(id) {
    const content = prompt('نص الرد:');
    if (!content) return;
    try { DB.addReply(id, content); U.toast('تم إضافة الرد', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  followUp(id) {
    const title = prompt('عنوان المهمة:');
    if (!title) return;
    const due = prompt('تاريخ الاستحقاق (YYYY-MM-DD) - اختياري:') || null;
    const notes = prompt('ملاحظات - اختياري:') || '';
    try { DB.addFollowUp(id, { title, due_date: due, notes, status: 'pending' }); U.toast('تمت إضافة المتابعة', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  async archive(id) {
    if (!confirm('تأكيد أرشفة هذه المراسلة؟')) return;
    try { await DB.archive(id); U.toast('تمت الأرشفة', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  async restore(id) {
    try { await DB.restore(id); U.toast('تمت الاستعادة', 'success'); render(); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  async del(id) {
    if (!confirm('⚠️ حذف نهائي؟ لا يمكن التراجع!')) return;
    try { await DB.remove(id); U.toast('تم الحذف', 'success'); Router.go('dashboard'); }
    catch (e) { U.toast(e.message, 'error'); }
  },
  openWhatsApp() {
    const msg = encodeURIComponent(`مرحباً، أنا من ${CONFIG.ORG}`);
    window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${msg}`, '_blank');
  },
  async sendChat() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    try {
      await DB.sendChatMessage(msg);
      if (Router.page === 'chat') loadChatMessages();
    } catch (e) { U.toast(e.message, 'error'); }
  },
  async loadNotifications() {
    if (!sbConnected) {
      document.getElementById('notifList').innerHTML = '<div class="text-center text-gray-500 p-8">التنبيهات متاحة فقط عند الاتصال بـ Supabase</div>';
      return;
    }
    const notifs = await DB.getNotifications();
    const el = document.getElementById('notifList');
    if (notifs.length === 0) {
      el.innerHTML = '<div class="text-center text-gray-500 p-8">لا توجد تنبيهات</div>';
      return;
    }
    el.innerHTML = notifs.map(n => `
      <div class="bg-${n.is_read ? 'gray' : 'blue'}-50 border-r-4 border-${n.is_read ? 'gray' : 'blue'}-500 p-4 rounded ${!n.is_read ? 'font-semibold' : ''}">
        <div class="flex justify-between items-start">
          <div>
            <div class="font-bold">${U.esc(n.title)}</div>
            <div class="text-sm text-gray-700 mt-1">${U.esc(n.message)}</div>
            <div class="text-xs text-gray-500 mt-2">${U.fmtDate(n.created_at)}</div>
          </div>
          ${!n.is_read ? '<span class="bg-blue-500 text-white text-xs px-2 py-1 rounded">جديد</span>' : ''}
        </div>
      </div>
    `).join('');
  },
  async markAllRead() {
    await DB.markNotificationsRead();
    U.toast('تم تحديد جميع التنبيهات كمقروءة', 'success');
    UI.loadNotifications();
    refreshNotifications();
  },
};

const Exporter = {
  txt(id) {
    const r = DB.getById(id);
    if (!r) return;
    const text = `${CONFIG.ORG}\n================================\nالمرجع: ${r.reference_number}\nالتاريخ: ${U.fmtDate(r.created_at)}\nالقطاع: ${SECTORS.find(s => s.id === r.sector_id)?.name || ''}\nالأولوية: ${r.priority}\nالمرسل: ${r.sender_name || '-'}\n================================\nالموضوع: ${r.subject}\n\n${r.content}\n================================\n© 2026 ${CONFIG.ORG}`;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${r.reference_number}.txt`; a.click();
    URL.revokeObjectURL(url);
    U.toast('تم التصدير', 'success');
  },
  qr(id) {
    const r = DB.getById(id);
    if (!r) return;
    const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(`REF: ${r.reference_number}\nSUBJECT: ${r.subject}\nDATE: ${r.created_at}\nORG: ${CONFIG.ORG}`)}`;
    const a = document.createElement('a');
    a.href = url; a.download = `qr_${r.reference_number}.png`; a.target = '_blank'; a.click();
    U.toast('تم إنشاء QR', 'success');
  },
  wa(id) {
    const r = DB.getById(id);
    if (!r) return;
    const text = `*${CONFIG.ORG}*\n\n📌 ${r.reference_number}\n📅 ${U.fmtShort(r.created_at)}\n📝 ${r.subject}\n\n${(r.content || '').substring(0, 200)}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  },
  excel() {
    const data = appData.filter(r => !r.is_archived);
    const rows = data.map(r => ({
      'الرقم': r.reference_number, 'التاريخ': U.fmtShort(r.created_at),
      'القطاع': SECTORS.find(s => s.id === r.sector_id)?.name || '',
      'الموضوع': r.subject, 'المحتوى': r.content, 'الأولوية': r.priority, 'المرسل': r.sender_name || '',
    }));
    const csv = [Object.keys(rows[0] || {}).join(','), ...rows.map(r => Object.values(r).map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','))].join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `correspondence_${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
    U.toast('تم التصدير', 'success');
  },
};

function showSettings() {
  const useSb = confirm('هل تريد تفعيل Supabase؟\n\nOK = نعم (سيطلب الرابط والمفتاح)\nCancel = لا (الوضع المحلي)');
  if (useSb) {
    const url = prompt('أدخل Supabase URL:\n(مثال: https://xxxxx.supabase.co)', CONFIG.SB_URL);
    if (!url) return;
    const key = prompt('أدخل Supabase Anon Key:\n(يبدأ بـ eyJhbGci...)', CONFIG.SB_KEY);
    if (!key) return;
    localStorage.setItem('SB_URL', url);
    localStorage.setItem('SB_KEY', key);
    localStorage.setItem('USE_SB', 'true');
    U.toast('تم الحفظ - جاري إعادة التحميل...', 'success');
    setTimeout(() => location.reload(), 1000);
  } else {
    localStorage.removeItem('SB_URL');
    localStorage.removeItem('SB_KEY');
    localStorage.removeItem('USE_SB');
    U.toast('تم التفعيل للوضع المحلي', 'success');
    setTimeout(() => location.reload(), 1000);
  }
}

async function loadChatMessages() {
  const el = document.getElementById('chatMessages');
  if (!el) return;
  try {
    const msgs = await DB.getChatMessages();
    if (msgs.length === 0) {
      el.innerHTML = '<div class="text-center text-gray-500 py-8">لا توجد رسائل بعد. كن أول من يرسل رسالة!</div>';
      return;
    }
    el.innerHTML = msgs.map(m => `
      <div class="chat-bubble ${m.sender_id === Auth.user?.id ? 'me' : 'other'}">
        <div class="text-xs opacity-75 mb-1">${U.esc(m.sender_name || 'مستخدم')}</div>
        <div>${U.esc(m.message)}</div>
        <div class="text-xs opacity-60 mt-1">${U.fmtShort(m.created_at)}</div>
      </div>
    `).join('');
    el.scrollTop = el.scrollHeight;
  } catch (e) { el.innerHTML = '<div class="text-center text-red-500">خطأ في تحميل الرسائل</div>'; }
}

// =====================================================
// MAIN RENDER - مصحح لعرض بيانات القطاع فقط
// =====================================================
async function render() {
  Auth.load();
  const app = document.getElementById('app');
  const whatsappBtn = document.getElementById('whatsappBtn');
  
  if (!Auth.user) {
    app.innerHTML = Views.login();
    whatsappBtn.classList.add('hidden');
    setTimeout(() => {
      const btn = document.getElementById('lgBtn');
      if (btn) {
        btn.onclick = handleLogin;
        document.getElementById('lgPass').addEventListener('keypress', e => {
          if (e.key === 'Enter') handleLogin();
        });
      }
    }, 0);
  } else {
    whatsappBtn.classList.remove('hidden');
    
    // 1. سحب البيانات من Supabase مع فلتر القطاع إذا كان المستخدم مدير قطاع
    let filters = {};
    if (sbConnected && Auth.user.role === 'sector_admin' && Auth.user.sector_id) {
      filters.sector_id = Auth.user.sector_id;
    }
    
    if (sbConnected) {
      try {
        appData = await DB.getAll(filters);
      } catch (e) {
        console.error("فشل جلب البيانات", e);
        appData = [];
      }
    } else {
      appData = U.load('db_correspondence', []);
      if (Auth.user.role === 'sector_admin' && Auth.user.sector_id) {
        appData = appData.filter(r => r.sector_id === Auth.user.sector_id);
      }
    }
    
    // 2. عرض الصفحات
    const views = {
      dashboard: () => Views.dashboard(appData),
      sector: () => Views.sector(appData),
      general: () => Views.general(appData),
      archive: () => Views.archive(appData),
      followups: () => Views.followups(appData),
      create: () => Views.create(),
      view: () => Views.view(),
      chat: () => Views.chat(),
      notifications: () => Views.notifications(),
    };
    app.innerHTML = (views[Router.page] || Views.dashboard(appData))();
    
    // 3. ربط الأحداث
    bindEvents();
  }
}

function bindEvents() {
  if (Router.page === 'create') {
    const saveBtn = document.getElementById('saveBtn');
    const fileInput = document.getElementById('fFiles');
    const filePreview = document.getElementById('filePreview');
    let selectedFiles = [];
    
    if (fileInput) {
      fileInput.onchange = async (e) => {
        selectedFiles = Array.from(e.target.files);
        if (selectedFiles.length > 0) {
          filePreview.innerHTML = selectedFiles.map(f => `
            <div class="attachment-chip">
              ${U.getFileIcon(U.getFileType(f.type, f.name))} ${U.esc(f.name)} (${(f.size/1024).toFixed(1)} KB)
              <button type="button" onclick="this.parentElement.remove()" class="ml-1 text-red-600 hover:text-red-800">×</button>
            </div>
          `).join('');
        } else {
          filePreview.innerHTML = '';
        }
      };
    }
    
    if (saveBtn) {
      saveBtn.onclick = async () => {
        const sector = document.getElementById('fSec').value;
        const subject = document.getElementById('fSub').value.trim();
        const content = document.getElementById('fCon').value.trim();
        const sender = document.getElementById('fSen').value.trim();
        const priority = document.getElementById('fPri').value;
        
        if (!subject || !content) { 
          U.toast('الرجاء إدخال الموضوع والمحتوى', 'warning'); 
          return; 
        }
        
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="spinner"></span> جاري الحفظ...';
        
        try {
          // رفع المرفقات إذا وجدت
          const filesToUpload = selectedFiles.filter(f => filePreview.contains(f.parentElement));
          
          await DB.create({ 
            sector_id: sector, 
            subject, 
            content, 
            sender_name: sender, 
            priority 
          }, filesToUpload);
          
          U.toast('✅ تم حفظ المراسلة بنجاح', 'success');
          Router.go('dashboard');
        } catch (e) {
          U.toast(e.message, 'error');
          saveBtn.disabled = false;
          saveBtn.innerHTML = '💾 حفظ المراسلة';
        }
      };
    }
  }
  
  if (Router.page === 'sector') {
    const filter = () => {
      const sid = Router.params.id;
      const search = document.getElementById('sSearch')?.value.toLowerCase() || '';
      const pri = document.getElementById('sPri')?.value || '';
      const sort = document.getElementById('sSort')?.value || 'date';
      
      let data = [...appData].filter(r => r.sector_id === sid && !r.is_archived);
      if (search) data = data.filter(r => (r.subject + ' ' + r.content).toLowerCase().includes(search));
      if (pri) data = data.filter(r => r.priority === pri);
      if (sort === 'priority') {
        const o = { high: 0, normal: 1, low: 2 };
        data.sort((a,b) => o[a.priority] - o[b.priority]);
      }
      
      const el = document.getElementById('sList');
      if (el) {
        el.innerHTML = data.length === 0
          ? '<div class="glass rounded-2xl p-12 text-center text-gray-500">لا توجد نتائج</div>'
          : data.map(r => Views.card(r)).join('');
      }
    };
    const s = document.getElementById('sSearch'), p = document.getElementById('sPri'), so = document.getElementById('sSort');
    if (s) s.oninput = filter;
    if (p) p.onchange = filter;
    if (so) so.onchange = filter;
    filter();
  }
  
  if (Router.page === 'general') {
    const filter = () => {
      const search = document.getElementById('gSearch')?.value.toLowerCase() || '';
      const sec = document.getElementById('gSec')?.value || '';
      const pri = document.getElementById('gPri')?.value || '';
      
      let data = [...appData].filter(r => !r.is_archived);
      if (search) data = data.filter(r => (r.subject + ' ' + r.content).toLowerCase().includes(search));
      if (sec) data = data.filter(r => r.sector_id === sec);
      if (pri) data = data.filter(r => r.priority === pri);
      
      const el = document.getElementById('gList');
      if (el) {
        el.innerHTML = data.length === 0
          ? '<div class="glass rounded-2xl p-12 text-center text-gray-500">لا توجد نتائج</div>'
          : data.map(r => Views.card(r)).join('');
      }
    };
    const s = document.getElementById('gSearch'), sf = document.getElementById('gSec'), p = document.getElementById('gPri');
    if (s) s.oninput = filter;
    if (sf) sf.onchange = filter;
    if (p) p.onchange = filter;
    filter();
  }
  
  if (Router.page === 'chat') {
    loadChatMessages();
    DB.subscribeToChat((newMsg) => {
      loadChatMessages();
      if (newMsg.sender_id !== Auth.user?.id) {
        U.toast(`💬 رسالة جديدة من ${newMsg.sender_name}`, 'info');
      }
    });
  }
  
  if (Router.page === 'notifications') {
    UI.loadNotifications();
    refreshNotifications();
  }
}

async function handleLogin() {
  const email = document.getElementById('lgEmail').value.trim();
  const password = document.getElementById('lgPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('lgBtn');
  
  if (!email || !password) {
    errEl.textContent = 'الرجاء إدخال البريد وكلمة المرور';
    errEl.classList.remove('hidden');
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جاري الدخول...';
  errEl.classList.add('hidden');
  
  try {
    await Auth.login(email, password);
    U.toast(`مرحباً ${Auth.user.full_name}`, 'success');
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '🔐 تسجيل الدخول';
  }
}

// Initialize
render();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded`);
console.log(`Mode: ${sbConnected ? 'Supabase 🔗' : 'Local 💾'}`);
</script>
