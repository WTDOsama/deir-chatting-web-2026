<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراسلات إدارة إيواءات دير البلح</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
  * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
  body { background: linear-gradient(135deg, #0f766e 0%, #134e4a 100%); min-height: 100vh; margin: 0; }
  .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
  .btn-primary { background: linear-gradient(135deg, #0f766e, #134e4a); color: white; cursor: pointer; border: none; transition: all 0.3s; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15,118,110,0.4); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .hidden { display: none !important; }
  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .card-hover { transition: all 0.3s; }
  .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
  .priority-high { border-right: 4px solid #dc2626; }
  .priority-normal { border-right: 4px solid #2563eb; }
  .priority-low { border-right: 4px solid #16a34a; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  input, textarea, select { font-family: 'Cairo', sans-serif; }
  .scrollbar::-webkit-scrollbar { width: 8px; }
  .scrollbar::-webkit-scrollbar-thumb { background: #0f766e; border-radius: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// =====================================================
// CONFIGURATION
// =====================================================
const CONFIG = {
  APP_NAME: 'مراسلات إدارة إيواءات دير البلح',
  ORG: 'إدارة إيواءات دير البلح',
  DEV: 'WTDOsama – وتد لبرمجة مواقع الويب',
  VERSION: '6.0.0',
};

const SECTORS = [
  { id: 'east', name: 'القاطع الشرقي', code: 'EAST', color: 'from-yellow-500 to-orange-600', icon: '🌅' },
  { id: 'west', name: 'القاطع الغربي', code: 'WEST', color: 'from-blue-500 to-blue-700', icon: '' },
  { id: 'north', name: 'القاطع الشمالي', code: 'NORTH', color: 'from-purple-500 to-purple-700', icon: '🏔️' },
  { id: 'south', name: 'القاطع الجنوبي', code: 'SOUTH', color: 'from-red-500 to-red-700', icon: '☀️' },
];

const ROLES = {
  super_admin: 'مدير عام للنظام',
  general_admin: 'مدير عام',
  sector_admin: 'مدير قاطع',
  sector_staff: 'موظف قاطع',
};

// =====================================================
// DATA STORE (localStorage)
// =====================================================
const Store = {
  get(key, def = null) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch { return def; }
  },
  set(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch { return false; }
  },
  uuid() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },
  now() { return new Date().toISOString(); },
  fmtDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  },
  fmtShort(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' });
  },
  esc(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  },
  genRef(code) {
    return `DB-${code}-${new Date().getFullYear()}-${Math.floor(Math.random()*9000)+1000}`;
  },
  toast(msg, type = 'info') {
    const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-yellow-600' };
    const el = document.createElement('div');
    el.className = `fixed top-4 left-4 ${colors[type]} text-white px-6 py-3 rounded-lg shadow-2xl z-[200] fade-in`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  },
};

// =====================================================
// AUTH
// =====================================================
const Auth = {
  user: null,
  load() {
    this.user = Store.get('db_user', null);
    return this.user;
  },
  login(email, password) {
    if (email === 'admin@deir-albalah.ps' && password === 'password') {
      this.user = { id: 'demo-1', username: 'admin', full_name: 'المدير العام', role: 'super_admin', sector_id: null };
      Store.set('db_user', this.user);
      return this.user;
    }
    throw new Error('بيانات الدخول غير صحيحة');
  },
  logout() {
    this.user = null;
    localStorage.removeItem('db_user');
    render();
  }
};

// =====================================================
// CORRESPONDENCE DATA
// =====================================================
const DB = {
  getAll(filters = {}) {
    let data = Store.get('db_correspondence', []);
    if (filters.sector_id) data = data.filter(d => d.sector_id === filters.sector_id);
    if (filters.is_archived !== undefined) data = data.filter(d => !!d.is_archived === filters.is_archived);
    if (filters.search) {
      const s = filters.search.toLowerCase();
      data = data.filter(d => (d.subject + ' ' + d.content + ' ' + d.reference_number).toLowerCase().includes(s));
    }
    if (filters.priority) data = data.filter(d => d.priority === filters.priority);
    return data.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  },
  create(rec) {
    const data = Store.get('db_correspondence', []);
    const newRec = {
      id: Store.uuid(),
      reference_number: rec.reference_number || Store.genRef(SECTORS.find(s => s.id === rec.sector_id)?.code || 'XX'),
      subject: rec.subject,
      content: rec.content,
      sender_name: rec.sender_name || Auth.user?.full_name,
      sector_id: rec.sector_id,
      priority: rec.priority || 'normal',
      is_archived: false,
      replies: [],
      follow_ups: [],
      created_at: Store.now(),
    };
    data.push(newRec);
    Store.set('db_correspondence', data);
    return newRec;
  },
  update(id, updates) {
    const data = Store.get('db_correspondence', []);
    const idx = data.findIndex(d => d.id === id);
    if (idx === -1) throw new Error('السجل غير موجود');
    data[idx] = { ...data[idx], ...updates, updated_at: Store.now() };
    Store.set('db_correspondence', data);
    return data[idx];
  },
  archive(id) { return this.update(id, { is_archived: true }); },
  restore(id) { return this.update(id, { is_archived: false }); },
  remove(id) {
    Store.set('db_correspondence', Store.get('db_correspondence', []).filter(d => d.id !== id));
  },
  addReply(id, content) {
    const data = Store.get('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    if (!rec) throw new Error('غير موجود');
    rec.replies = rec.replies || [];
    rec.replies.push({ id: Store.uuid(), content, author: Auth.user?.full_name, created_at: Store.now() });
    Store.set('db_correspondence', data);
    return rec;
  },
  addFollowUp(id, fu) {
    const data = Store.get('db_correspondence', []);
    const rec = data.find(d => d.id === id);
    if (!rec) throw new Error('غير موجود');
    rec.follow_ups = rec.follow_ups || [];
    rec.follow_ups.push({ id: Store.uuid(), ...fu, created_at: Store.now() });
    Store.set('db_correspondence', data);
    return rec;
  },
  getById(id) {
    return Store.get('db_correspondence', []).find(d => d.id === id);
  }
};

// =====================================================
// ROUTER
// =====================================================
const Router = {
  page: 'dashboard',
  params: {},
  go(page, params = {}) {
    this.page = page;
    this.params = params;
    render();
    window.scrollTo(0, 0);
  }
};

// =====================================================
// VIEWS
// =====================================================
const Views = {
  login() {
    return `

            <div class="text-6xl mb-3">🏢</div>

          </div>

            <p>البريد: <strong>admin@deir-albalah.ps</strong></p>

              </div>
              <div class="bg-gray-50 p-3 rounded-xl">
                <div class="text-2xl font-bold text-gray-700">${archived.length}</div>

          <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            ${SECTORS.map(s => {
              const count = active.filter(r => r.sector_id === s.id).length;
              return `
                <button onclick="Router.go('sector', {id:'${s.id}'})" class="glass rounded-2xl shadow-lg p-5 card-hover text-right cursor-pointer">

            <button onclick="Router.go('create')" class="bg-gradient-to-br from-teal-600 to-teal-700 hover:from-teal-700 hover:to-teal-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition">

            <button onclick="Router.go('general')" class="bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition">
               التقارير
            </button>
            <button onclick="Router.go('followups')" class="bg-gradient-to-br from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition">
              📋 المتابعة
            </button>
            <button onclick="Router.go('archive')" class="bg-gradient-to-br from-gray-600 to-gray-700 hover:from-gray-700 hover:to-gray-800 text-white px-4 py-4 rounded-xl font-bold shadow-lg cursor-pointer transition">
              📦 الأرشيف
            </button>
          </div>

          <div class="glass rounded-2xl shadow-xl p-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4">🕐 آخر المراسلات</h2>
            ${active.length === 0 
              ? '<div class="text-center text-gray-500 py-8">لا توجد مراسلات بعد. اضغط "مراسلة جديدة" للبدء.</div>'

          <div class="text-center text-xs text-white/70 mt-8 pb-4">
            <p>© 2026 ${CONFIG.ORG} – جميع الحقوق محفوظة</p>
            <p class="mt-1">تطوير: ${CONFIG.DEV}</p>
          </div>
        </div>
      </div>

  },

  sector() {

    const s = SECTORS.find(x => x.id === sid);
    if (!s) return '<div class="p-8 text-white text-center">القطاع غير موجود</div>';
    const data = DB.getAll({ sector_id: sid, is_archived: false });
    
    return `
      <div class="min-h-screen">

          <div class="bg-gradient-to-br ${s.color} text-white rounded-2xl shadow-xl p-6 mb-6">
            <div class="flex items-center justify-between flex-wrap gap-3">

  archive() {
    const data = DB.getAll({ is_archived: true });
    return `

        ${this.navbar()}

  },

  followups() {
    const all = DB.getAll();
    const withFu = all.filter(r => r.follow_ups && r.follow_ups.length > 0);
    return `
      <div class="min-h-screen">
        ${this.navbar()}
        <div class="max-w-7xl mx-auto p-4 md:p-6 fade-in">
          <div class="bg-gradient-to-br from-purple-600 to-pink-600 text-white rounded-2xl shadow-xl p-6 mb-6">

                  </div>
                  <div class="space-y-2">
                    ${r.follow_ups.map(f => `
                      <div class="bg-purple-50 border-r-4 border-purple-500 p-3 rounded">
                        <div class="flex justify-between items-center">
                          <span class="font-semibold text-gray-800">${Store.esc(f.title || 'مهمة')}</span>

                        ${f.due_date ? `<div class="text-xs text-gray-600 mt-1">📅 ${Store.fmtShort(f.due_date)}</div>` : ''}

  create() {
    const preSector = Router.params.sector || 'east';
    return `
      <div class="min-h-screen">
        ${this.navbar()}
        <div class="max-w-3xl mx-auto p-4 md:p-6 fade-in">
          <div class="glass rounded-2xl shadow-xl p-6 md:p-8">
            <h1 class="text-2xl font-bold text-teal-800 mb-6">➕ مراسلة جديدة</h1>
            <form class="space-y-4" onsubmit="return false;">
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">القطاع *</label>
                <select id="fSec" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none">
                  ${SECTORS.map(s => `<option value="${s.id}" ${s.id===preSector?'selected':''}>${s.icon} ${s.name}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">الموضوع *</label>
                <input type="text" id="fSub" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none">
              </div>
              <div class="grid md:grid-cols-2 gap-3">
                <div>
                  <label class="block text-sm font-semibold mb-1 text-gray-700">المرسل</label>
                  <input type="text" id="fSen" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none" value="${Store.esc(Auth.user?.full_name || '')}">
                </div>
                <div>
                  <label class="block text-sm font-semibold mb-1 text-gray-700">الأولوية</label>
                  <select id="fPri" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none">
                    <option value="normal">عادية</option>
                    <option value="high">عالية</option>
                    <option value="low">منخفضة</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-sm font-semibold mb-1 text-gray-700">المحتوى *</label>
                <textarea id="fCon" rows="8" class="w-full px-4 py-2 border-2 border-gray-200 rounded-xl focus:border-teal-600 focus:outline-none"></textarea>
              </div>
              <div class="flex gap-2">
                <button type="button" id="saveBtn" class="btn-primary flex-1 py-3 rounded-xl font-bold cursor-pointer">💾 حفظ المراسلة</button>
                <button type="button" onclick="Router.go('dashboard')" class="bg-gray-300 hover:bg-gray-400 px-6 py-3 rounded-xl font-bold cursor-pointer">إلغاء</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    `;
  },

  view() {
    const id = Router.params.id;
    const r = DB.getById(id);
    if (!r) return '<div class="p-8 text-white text-center">السجل غير موجود</div>';
    const s = SECTORS.find(x => x.id === r.sector_id);
    
    return `
      <div class="min-h-screen">
        ${this.navbar()}
        <div class="max-w-4xl mx-auto p-4 md:p-6 fade-in">
          <button onclick="history.back()" class="mb-4 text-white hover:text-gray-200 font-semibold cursor-pointer">→ رجوع</button>
          
          <div class="glass rounded-2xl shadow-xl p-6 md:p-8">
            <div class="border-b-2 border-teal-600 pb-4 mb-6">
              <div class="text-center">
                <h1 class="text-2xl font-bold text-teal-800">${CONFIG.ORG}</h1>
                <p class="text-gray-600 mt-1">نظام المراسلات الإدارية</p>
              </div>
            </div>
            
            <div class="grid md:grid-cols-2 gap-4 mb-6">
              <div><div class="text-xs text-gray-500">الرقم المرجعي</div><div class="font-bold text-lg text-teal-700">${r.reference_number}</div></div>
              <div><div class="text-xs text-gray-500">التاريخ</div><div class="font-semibold">${Store.fmtDate(r.created_at)}</div></div>

              <div><div class="text-xs text-gray-500">الأولوية</div><div class="font-semibold">${r.priority === 'high' ? '🔴 عالية' : r.priority === 'low' ? '🟢 منخفضة' : '🔵 عادية'}</div></div>
              ${r.sender_name ? `<div class="md:col-span-2"><div class="text-xs text-gray-500">المرسل</div><div class="font-semibold">${Store.esc(r.sender_name)}</div></div>` : ''}
            </div>
            
            <div class="mb-6">
              <div class="text-xs text-gray-500 mb-1">الموضوع</div>
              <h2 class="text-xl font-bold text-gray-800">${Store.esc(r.subject)}</h2>
            </div>
            
            <div class="mb-6">
              <div class="text-xs text-gray-500 mb-1">المحتوى</div>
              <div class="bg-gray-50 p-4 rounded-xl whitespace-pre-wrap leading-relaxed">${Store.esc(r.content)}</div>
            </div>
            
            ${r.replies && r.replies.length > 0 ? `
              <div class="mb-6">
                <h3 class="font-bold text-lg text-gray-800 mb-3">💬 الردود (${r.replies.length})</h3>
                <div class="space-y-3">
                  ${r.replies.map(rp => `
                    <div class="bg-blue-50 border-r-4 border-blue-500 p-4 rounded">
                      <div class="text-xs text-gray-500 mb-1">${Store.fmtDate(rp.created_at)} – ${Store.esc(rp.author || 'مستخدم')}</div>
                      <div class="whitespace-pre-wrap">${Store.esc(rp.content)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
            
            ${r.follow_ups && r.follow_ups.length > 0 ? `
              <div class="mb-6">
                <h3 class="font-bold text-lg text-gray-800 mb-3">📋 المتابعة</h3>
                <div class="space-y-2">
                  ${r.follow_ups.map(f => `
                    <div class="bg-purple-50 border-r-4 border-purple-500 p-3 rounded">
                      <div class="font-semibold">${Store.esc(f.title || 'مهمة')}</div>
                      ${f.due_date ? `<div class="text-xs text-gray-600"> ${Store.fmtShort(f.due_date)}</div>` : ''}
                      ${f.notes ? `<div class="text-sm text-gray-700">${Store.esc(f.notes)}</div>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}
          </div>
          
          <div class="glass rounded-2xl shadow-xl p-4 mt-4">
            <h3 class="font-bold mb-3">⚡ إجراءات</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
              <button onclick="Exporter.txt('${r.id}')" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer"> TXT</button>
              <button onclick="Exporter.qr('${r.id}')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">🔳 QR</button>
              <button onclick="Exporter.wa('${r.id}')" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">📱 WhatsApp</button>
              <button onclick="UI.reply('${r.id}')" class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">💬 رد</button>
              <button onclick="UI.followUp('${r.id}')" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">📋 متابعة</button>
              ${r.is_archived 
                ? `<button onclick="UI.restore('${r.id}')" class="bg-orange-600 hover:bg-orange-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">📤 استعادة</button>`
                : `<button onclick="UI.archive('${r.id}')" class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">📦 أرشفة</button>`
              }
              <button onclick="UI.del('${r.id}')" class="bg-red-800 hover:bg-red-900 text-white px-3 py-2 rounded-lg font-semibold text-sm cursor-pointer">🗑️ حذف</button>
            </div>
          </div>
        </div>
      </div>
    `;
  },

  navbar() {
    const u = Auth.user || {};
    if (!u.id) return '';
    return `
      <nav class="glass shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-2">
          <div class="flex items-center gap-3">
            <span class="text-2xl"></span>
            <div>
              <div class="font-bold text-teal-800 text-sm md:text-base">${CONFIG.APP_NAME}</div>
              <div class="text-xs text-gray-600 hidden md:block">${Store.esc(u.full_name)}</div>
            </div>
          </div>
          <div class="flex items-center gap-1 md:gap-2 flex-wrap">
            <button onclick="Router.go('dashboard')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer"> الرئيسية</button>
            <button onclick="Router.go('general')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer hidden md:inline">🏛️ الإدارة</button>
            <button onclick="Router.go('archive')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer hidden md:inline">📦 الأرشيف</button>
            <button onclick="Router.go('followups')" class="px-3 py-1.5 rounded-lg hover:bg-teal-50 text-sm font-semibold cursor-pointer hidden md:inline">📋 متابعة</button>
            <button onclick="Router.go('create')" class="px-3 py-1.5 rounded-lg bg-teal-600 text-white hover:bg-teal-700 text-sm font-semibold cursor-pointer">➕ جديد</button>
            <button onclick="Auth.logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-sm font-semibold cursor-pointer">🚪 خروج</button>
          </div>
        </div>
      </nav>
    `;
  },

  card(r, showRestore = false) {
    const s = SECTORS.find(x => x.id === r.sector_id);
    const pc = r.priority === 'high' ? 'priority-high' : r.priority === 'low' ? 'priority-low' : 'priority-normal';
    return `
      <div onclick="Router.go('view', {id:'${r.id}'})" class="glass rounded-xl shadow-lg p-4 card-hover cursor-pointer ${pc}">
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 text-xs text-gray-500 mb-1 flex-wrap">
            <span>${r.reference_number}</span><span>•</span>
            <span>${Store.fmtShort(r.created_at)}</span>
            ${s ? `<span>•</span><span>${s.icon} ${s.name}</span>` : ''}
            ${r.sender_name ? `<span>•</span><span>👤 ${Store.esc(r.sender_name)}</span>` : ''}
          </div>
          <h3 class="font-bold text-gray-800 truncate">${Store.esc(r.subject)}</h3>
          <p class="text-sm text-gray-600 mt-1">${Store.esc((r.content || '').substring(0, 150))}</p>
          <div class="flex gap-2 mt-2 flex-wrap text-xs">
            ${r.priority === 'high' ? '<span class="bg-red-100 text-red-700 px-2 py-0.5 rounded"> عالية</span>' : ''}
            ${r.priority === 'normal' ? '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded">🔵 عادية</span>' : ''}
            ${r.priority === 'low' ? '<span class="bg-green-100 text-green-700 px-2 py-0.5 rounded">🟢 منخفضة</span>' : ''}
            ${r.is_archived ? '<span class="bg-gray-200 text-gray-700 px-2 py-0.5 rounded">📦 مؤرشف</span>' : ''}
            ${r.replies?.length > 0 ? `<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">💬 ${r.replies.length}</span>` : ''}
            ${r.follow_ups?.length > 0 ? `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded">📋 ${r.follow_ups.length}</span>` : ''}
          </div>
        </div>
      </div>
    `;
  },
};

// =====================================================
// UI ACTIONS
// =====================================================
const UI = {
  reply(id) {
    const content = prompt('نص الرد:');
    if (!content) return;
    try {
      DB.addReply(id, content);
      Store.toast('تم إضافة الرد', 'success');
      render();
    } catch (e) { Store.toast(e.message, 'error'); }
  },
  followUp(id) {
    const title = prompt('عنوان المهمة:');
    if (!title) return;
    const due = prompt('تاريخ الاستحقاق (YYYY-MM-DD) - اختياري:') || null;
    const notes = prompt('ملاحظات - اختياري:') || '';
    try {
      DB.addFollowUp(id, { title, due_date: due, notes, status: 'pending' });
      Store.toast('تمت إضافة المتابعة', 'success');
      render();
    } catch (e) { Store.toast(e.message, 'error'); }
  },
  archive(id) {
    if (!confirm('تأكيد أرشفة هذه المراسلة؟')) return;
    try { DB.archive(id); Store.toast('تمت الأرشفة', 'success'); render(); }
    catch (e) { Store.toast(e.message, 'error'); }
  },
  restore(id) {
    try { DB.restore(id); Store.toast('تمت الاستعادة', 'success'); render(); }
    catch (e) { Store.toast(e.message, 'error'); }
  },
  del(id) {
    if (!confirm('⚠️ حذف نهائي؟ لا يمكن التراجع!')) return;
    try { DB.remove(id); Store.toast('تم الحذف', 'success'); Router.go('dashboard'); }
    catch (e) { Store.toast(e.message, 'error'); }
  },
};

// =====================================================
// EXPORT
// =====================================================
const Exporter = {
  txt(id) {
    const r = DB.getById(id);
    if (!r) return;
    const text = `${CONFIG.ORG}\n================================\nالمرجع: ${r.reference_number}\nالتاريخ: ${Store.fmtDate(r.created_at)}\nالقطاع: ${SECTORS.find(s => s.id === r.sector_id)?.name || ''}\nالأولوية: ${r.priority}\nالمرسل: ${r.sender_name || '-'}\n================================\nالموضوع: ${r.subject}\n\n${r.content}\n================================\n© 2026 ${CONFIG.ORG}`;
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${r.reference_number}.txt`; a.click();
    URL.revokeObjectURL(url);
    Store.toast('تم التصدير', 'success');
  },
  qr(id) {
    const r = DB.getById(id);
    if (!r) return;
    const data = `REF: ${r.reference_number}\nSUBJECT: ${r.subject}\nDATE: ${r.created_at}\nORG: ${CONFIG.ORG}`;
    const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(data)}`;
    const a = document.createElement('a');
    a.href = url; a.download = `qr_${r.reference_number}.png`; a.target = '_blank'; a.click();
    Store.toast('تم إنشاء QR', 'success');
  },
  wa(id) {
    const r = DB.getById(id);
    if (!r) return;
    const text = `*${CONFIG.ORG}*\n\n📌 ${r.reference_number}\n📅 ${Store.fmtShort(r.created_at)}\n📝 ${r.subject}\n\n${(r.content || '').substring(0, 200)}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  },
  excel() {
    const data = DB.getAll({ is_archived: false });
    const rows = data.map(r => ({
      'الرقم': r.reference_number,
      'التاريخ': Store.fmtShort(r.created_at),
      'القطاع': SECTORS.find(s => s.id === r.sector_id)?.name || '',
      'الموضوع': r.subject,
      'المحتوى': r.content,
      'الأولوية': r.priority,
      'المرسل': r.sender_name || '',
    }));
    const csv = [
      Object.keys(rows[0] || {}).join(','),
      ...rows.map(r => Object.values(r).map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(','))
    ].join('\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `correspondence_${Date.now()}.csv`; a.click();
    URL.revokeObjectURL(url);
    Store.toast('تم التصدير', 'success');
  },
};

// =====================================================
// MAIN RENDER
// =====================================================
function render() {
  Auth.load();
  const app = document.getElementById('app');
  
  if (!Auth.user) {
    app.innerHTML = Views.login();
    document.getElementById('lgBtn').onclick = handleLogin;
    document.getElementById('lgPass').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleLogin();
    });
  } else {
    const views = {
      dashboard: () => Views.dashboard(),
      sector: () => Views.sector(),
      general: () => Views.general(),
      archive: () => Views.archive(),
      followups: () => Views.followups(),
      create: () => Views.create(),
      view: () => Views.view(),
    };
    app.innerHTML = (views[Router.page] || Views.dashboard)();
    
    // Bind create form
    if (Router.page === 'create') {
      const saveBtn = document.getElementById('saveBtn');
      if (saveBtn) {
        saveBtn.onclick = () => {
          const sector = document.getElementById('fSec').value;
          const subject = document.getElementById('fSub').value.trim();
          const content = document.getElementById('fCon').value.trim();
          const sender = document.getElementById('fSen').value.trim();
          const priority = document.getElementById('fPri').value;
          
          if (!subject || !content) {
            Store.toast('الرجاء إدخال الموضوع والمحتوى', 'warning');
            return;
          }
          
          saveBtn.disabled = true;
          saveBtn.innerHTML = '⏳ جاري الحفظ...';
          
          try {
            DB.create({ sector_id: sector, subject, content, sender_name: sender, priority });
            Store.toast('تم حفظ المراسلة بنجاح', 'success');
            Router.go('dashboard');
          } catch (e) {
            Store.toast(e.message, 'error');
            saveBtn.disabled = false;
            saveBtn.innerHTML = '💾 حفظ المراسلة';
          }
        };
      }
    }
    
    // Bind sector filters
    if (Router.page === 'sector') {
      const filter = () => {
        const sid = Router.params.id;
        const search = document.getElementById('sSearch')?.value.toLowerCase() || '';
        const pri = document.getElementById('sPri')?.value || '';
        const sort = document.getElementById('sSort')?.value || 'date';
        
        let data = DB.getAll({ sector_id: sid, is_archived: false });
        if (search) data = data.filter(r => (r.subject + ' ' + r.content).toLowerCase().includes(search));
        if (pri) data = data.filter(r => r.priority === pri);
        if (sort === 'priority') {
          const o = { high: 0, normal: 1, low: 2 };
          data.sort((a,b) => o[a.priority] - o[b.priority]);
        }
        
        const el = document.getElementById('sList');
        if (el) {
          el.innerHTML = data.length === 0
            ? '<div class="glass rounded-2xl p-12 text-center text-gray-500">لا توجد نتائج</div>'
            : data.map(r => Views.card(r)).join('');
        }
      };
      const s = document.getElementById('sSearch'), p = document.getElementById('sPri'), so = document.getElementById('sSort');
      if (s) s.oninput = filter;
      if (p) p.onchange = filter;
      if (so) so.onchange = filter;
    }
    
    // Bind general filters
    if (Router.page === 'general') {
      const filter = () => {
        const search = document.getElementById('gSearch')?.value.toLowerCase() || '';
        const sec = document.getElementById('gSec')?.value || '';
        const pri = document.getElementById('gPri')?.value || '';
        
        let data = DB.getAll({ is_archived: false });
        if (search) data = data.filter(r => (r.subject + ' ' + r.content).toLowerCase().includes(search));
        if (sec) data = data.filter(r => r.sector_id === sec);
        if (pri) data = data.filter(r => r.priority === pri);
        
        const el = document.getElementById('gList');
        if (el) {
          el.innerHTML = data.length === 0
            ? '<div class="glass rounded-2xl p-12 text-center text-gray-500">لا توجد نتائج</div>'
            : data.map(r => Views.card(r)).join('');
        }
      };
      const s = document.getElementById('gSearch'), sf = document.getElementById('gSec'), p = document.getElementById('gPri');
      if (s) s.oninput = filter;
      if (sf) sf.onchange = filter;
      if (p) p.onchange = filter;
    }
  }
}

async function handleLogin() {
  const email = document.getElementById('lgEmail').value.trim();
  const password = document.getElementById('lgPass').value;
  const errEl = document.getElementById('loginErr');
  const btn = document.getElementById('lgBtn');
  
  if (!email || !password) {
    errEl.textContent = 'الرجاء إدخال البريد وكلمة المرور';
    errEl.classList.remove('hidden');
    return;
  }
  
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:20px;height:20px;border:3px solid #f3f3f3;border-top:3px solid #0f766e;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle"></span> جاري الدخول...';
  errEl.classList.add('hidden');
  
  try {
    Auth.login(email, password);
    Store.toast(`مرحباً ${Auth.user.full_name}`, 'success');
    render();
  } catch (e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false;
    btn.innerHTML = '🔐 تسجيل الدخول';
  }
}

// Initialize
render();
console.log(`✓ ${CONFIG.APP_NAME} v${CONFIG.VERSION} loaded`);
console.log('🎯 All buttons are now functional!');
</script>
